Oracle trace file.", "Media Management messages for SBT devices are always written to sbtio.log.", "RMAN error stacks should be read from the bottom up as that is the order in which errors are generated."], "correct": [0, 5], "choose": 2, "explain": "", "origNote": "rman target / log=mybackup.log<br/>RMAN LOG 意思就是將log寫入檔案,此時您的終端機畫面上是看不到任何執行過程與輸出的" }, { "id": "E8-Q7", "exam": 8, "q": 7, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 4, "stem": "<p>Which three are true about RMAN archival backups with the RESTORE POINT clause? (Choose three.)<\/p>", "options": ["They can optionally be written to a fast recovery area (FRA).", "The ARCHIVAL attribute for a backup overrides the RMAN retention policy.", "All archive logs are retained after an archival backup is taken, until the next archival backup is taken of the same database.", "They are never considered obsolete by RMAN.", "Archive logs are retained if they are necessary to allow the database to be recovered to a consistent state when an archival backup is restored.", "The SPFILE is included in the archival backup."], "correct": [1, 4, 5], "choose": 3, "explain": "", "origNote": "Archive logs are retained if they are necessary to allow the database to be recovered to a consistent state when an archival backup is restored. (如果為了讓歸檔備份還原時能將資料庫復原到一致狀態，必要的歸檔日誌將會被保留。)<br/><br/>您誤選的陷阱分析：<br/>They can optionally be written to a fast recovery area (FRA). (您誤選的選項)<br/>錯誤原因： 這是 Oracle 的硬性規定。快速復原區 (FRA) 的設計初衷是為了「短期、日常」的快速循環覆寫與自動空間管理。而 Archival Backup 是要放好幾年不能動的。如果把它放在 FRA，會永遠霸占空間並破壞 FRA 的自動清理機制。因此，Oracle 嚴格禁止將帶有 KEEP 屬性的長期備份寫入 FRA，您必須將其存放到獨立的磁碟路徑或磁帶 (SBT) 中。" }, { "id": "E8-Q43", "exam": 8, "q": 43, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 4, "stem": "<p>Which two are true about creating RMAN backups for an Oracle container database? (Choose two.)<\/p>", "options": ["Tablespaces from different PDBs with identical names must be backed up by connecting RMAN separately to each PDB to back up the tablespaces.", "SPFILE backups can be created while connected to an application root PDB.", "The BACKUP DATABASE PLUS ARCHIVELOG command will back up archive logs when RMAN is connected to a PDB.", "The BACKUP PLUGGABLE DATABASE command can be used to back up CDB$ROOT.", "The BACKUP DATABASE command will create a pluggable database (PDB) backup when RMAN is connected to a PDB."], "correct": [3, 4], "choose": 2, "explain": "", "origNote": "SPFILE backups can be created while connected to an application root PDB. 陷阱:an application root PDB" }, { "id": "E9-Q15", "exam": 9, "q": 15, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 5, "stem": "<p>Which two are true about backup encryption? (Choose two.)<\/p>", "options": ["Backup encryption can be enabled selectively for specific tablespaces", "Keystore-based encryption is the default mode for RMAN backup encryption", "The Transparent Data Encryption (TDE) keystore is backed up using RMAN", "Image copies can be encrypted", "Vendor-specific media management software can be used for making encrypted RMAN backups to media", "The BACKUP BACKUPSET command can encrypt and decrypt backup sets"], "correct": [0, 1], "choose": 2, "explain": "", "origNote": "新題型" }, { "id": "E9-Q17", "exam": 9, "q": 17, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 5, "stem": "<p>Which three are true about using an RMAN Recovery Catalog with a pluggable database (PDB) target connection in Oracle Database 19c and later releases? (Choose three.)<\/p>", "options": ["The base catalog owner must give the Virtual Private Catalog access to metadata for one or more PDBs.", "The target PDB must be registered in both the base catalog and the Virtual Private Catalog.", "The base catalog must be enabled for Virtual Private Catalog use.", "The base catalog must be used by RMAN when performing point-in-time recovery for the PDB registered in the Virtual Private Catalog.", "The target PDB must be registered in a Virtual Private Catalog.", "The target PDB must be registered in a base catalog."], "correct": [0, 2, 5], "choose": 3, "explain": "", "origNote": "正確選項分析：<br/>註冊於基礎目錄 (Registered in a base catalog)： 這是所有目錄管理的源頭。無論您要切分出多少個 VPC，實體資料庫 (包含 CDB 與其底下的 PDB) 都必須先統一註冊在最底層的「基礎目錄 (Base Catalog)」裡面。<br/>啟用 VPC 支援 (Enabled for VPC use)： 在基礎目錄建立後，預設並未開啟 VPC 功能。DBA 必須執行特定的設定步驟（例如升級目錄結構或建立 VPC 擁有者並授權），才能讓這個基礎目錄支援 VPC 的運作機制。<br/>由擁有者授權 (Give access to metadata)： VPC 的本質是「資料列層級的存取控制」。基礎目錄擁有者必須透過指令 (如 GRANT CATALOG FOR DATABASE <pdb_name> TO <vpc_owner>;)，明確地將特定 PDB 的備份資料視野，授權給該 VPC 的擁有者。<br/>錯誤選項陷阱分析 (為什麼您的選項與其他不能選)：<br/>The base catalog must be used by RMAN when performing point-in-time recovery for the PDB... (您誤選的項目)<br/>錯誤原因： 建立 VPC 的最大目的，就是要讓 PDB 的本機管理員 (Local DBA) 可以獨立自主地進行備份與還原！當 PDB 管理員連線到他們的 VPC 時，完全有權限自己執行該 PDB 的時間點復原 (PITR)，不需要強制退回到使用 Base Catalog 才能做。<br/>The target PDB must be registered in both the base catalog and the Virtual Private Catalog.<br/>The target PDB must be registered in a Virtual Private Catalog.<br/>錯誤原因： 「註冊 (Register)」這個實體動作只會發生在基礎目錄上一次。VPC 只是基礎目錄上方的一個「受限視圖 (Restricted View)」，您不需要（也無法）在 VPC 裡面「再次註冊」同一個 PDB。<\/vpc_owner><\/pdb_name>" }, { "id": "E11-Q37", "exam": 11, "q": 37, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 5, "stem": "<p>Which three are true about using an RMAN Recovery Catalog with a pluggable database (PDB) target connection in Oracle Database 19c and later releases? (Choose three.)<\/p>", "options": ["The target PDB must be registered in a Virtual Private Catalog.", "The base catalog must be used by RMAN when performing point-in-time recovery for the PDB registered in the Virtual Private Catalog.", "The target PDB must be registered in a base catalog.", "The target PDB must be registered in both the base catalog and the Virtual Private Catalog.", "The base catalog owner must give the Virtual Private Catalog access to metadata for one or more PDBs.", "The base catalog must be enabled for Virtual Private Catalog use."], "correct": [0, 1, 4], "choose": 3, "explain": "", "origNote": "題型需要實作搞懂" }, { "id": "E11-Q45", "exam": 11, "q": 45, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 5, "stem": "<p>Which three are true about Recovery Manager (RMAN) in Oracle Database 19c and later releases? (Choose three.)<\/p>", "options": ["A Virtual Private Catalog used to register a container database can be created in a non-container database.", "A Virtual Private Catalog used to register a container database can be created in a pluggable database.", "It is always possible for RMAN to connect to a pluggable database as a target if any RMAN Catalog is used.", "A Virtual Private Catalog used to register a container database must be created in a pluggable database.", "It is always possible for RMAN to connect to a pluggable database as a target.", "It is only possible for RMAN to connect to a pluggable database as a target if an RMAN Virtual Private Catalog is used."], "correct": [0, 1, 4], "choose": 3, "explain": "", "origNote": "Virtual Private Catalog題型要注意<br/>It is always possible for RMAN to connect to a pluggable database as a target. (RMAN 總是能夠以「目標資料庫 (Target)」的方式連線到 PDB。) - 您漏勾了這個，反而誤勾了帶有條件限制的選項。<br/>It is always possible for RMAN to connect... if any RMAN Catalog is used. (您誤選的選項)<br/><br/>錯誤原因： 畫蛇添足的條件限制。RMAN 連線到 PDB 作為 Target 根本不需要依賴任何 RMAN Catalog。預設情況下，備份資訊會記錄在目標資料庫的 Control File 裡。加上 if... 條件反而扭曲了這個原生功能。" }, { "id": "E12-Q1", "exam": 12, "q": 1, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 5, "stem": "<p>You have configured RMAN SBT channels to write backups to media.<br/>You then take an RMAN backup by using this command:<br/>RMAN&gt; BACKUP AS COMPRESSED BACKUPSET<br/>                                    DATABASE<br/>                                    KEEP UNTIL TIME ‘SYSDATE + 730‘<br/>                                    RESTORE POINT ‘OLD_CONFIGURATION‘ ;<br/>Which three are true? (Choose three.)<\/p>", "options": ["The control file is included in the self-contained archival backup.", "The restore point is a label for the system change number (SCN) that will be saved two years after the archival backup was taken.", "The data file backups in the self-contained archive backup are not considered obsolete for two years regardless of the retention policy.", "The restore point is a label for the system change number (SCN) before the archival backup was taken.", "The SPFILE is included in the self-contained archival backup.", "All archive logs created after this backup are kept for two years."], "correct": [0, 2, 4], "choose": 3, "explain": "", "origNote": "The data file backups in the self-contained archive backup are not considered obsolete for two years regardless of the retention policy<br/>一般 RMAN 的保留原則 (Retention Policy) 可能是保留 7 天或 2 份備份。但 KEEP UNTIL TIME 'SYSDATE + 730' 就像是給了這份備份一張為期兩年的「免死金牌」。在這 730 天內，不管您怎麼下達 DELETE OBSOLETE 指令，RMAN 絕對不會把這份特定的備份刪除。" }, { "id": "E1-Q22", "exam": 1, "q": 22, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 1, "stem": "<p>Examine the command for creating pluggable database PDB2 in container database CDB2.<\/p>\n<p><img decoding=\"async\" src=\"../images/E01_Q022_img1.png\"/><\/p>\n<p>Select three options, any one of which is required for it to execute successfully. (Choose three.)<\/p>", "options": ["Add the FILE_NAME_CONVERT clause to the statement and set the PDB_FILE_NAME_CONVERT parameter.", "Add only the CREATE_FILE_DEST clause to the statement.", "Set only the PDB_FILE_NAME_CONVERT parameter.", "Set the PDB_FILE_NAME_CONVERT parameter and enable OMF.", "Enable only OMF.", "Add the FILE_NAME_CONVERT clause to the statement and enable Oracle Managed Files (OMF)"], "correct": [1, 2, 4], "choose": 3, "explain": "", "origNote": "當執行 CREATE PLUGGABLE DATABASE pdb2 ... 且未寫路徑時，Oracle 需要知道要把 PDB$SEED 的資料檔案複製到哪裡。<br/>Oracle 提供了以下 3 種獨立的方式（只要滿足其中任何一種即可成功執行）：<br/>方式一（選項 B）：SQL 子句指定<br/>在 SQL 語句中加上 CREATE_FILE_DEST = '/u01/app/oracle/oradata/CDB1/pdb2'。單獨加這個子句即可成功。<br/>方式二（選項 C）：參數檔設定<br/>在資料庫初始化參數中設定 PDB_FILE_NAME_CONVERT = ('/pdbseed/', '/pdb2/')。單獨設定此參數即可成功。<br/>方式三（選項 E）：啟用 OMF 自動管理<br/>在資料庫設定 DB_CREATE_FILE_DEST（即開啟 OMF）。單獨開啟 OMF 即可自動生成路徑並成功建立。<br/>❌ 為什麼 A、D、F 是錯誤答案？<br/>A. Add FILE_NAME_CONVERT clause AND set PDB_FILE_NAME_CONVERT parameter<br/>錯誤原因：語句寫了 FILE_NAME_CONVERT 就不需要再去設 PDB_FILE_NAME_CONVERT 參數，兩者不需要同時存在。<br/>D. Set PDB_FILE_NAME_CONVERT parameter AND enable OMF<br/>錯誤原因：啟用了 OMF（如選項 E）就不需要設定 PDB_FILE_NAME_CONVERT；反之亦然。題幹問的是「只需具備哪一項就能成功」，因此「強迫兩者同時設定」是錯誤的。<br/>F. Add FILE_NAME_CONVERT clause AND enable OMF<br/>錯誤原因：同理，只要有其中一種即可，不需要同時具備。" }, { "id": "E1-Q39", "exam": 1, "q": 39, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 1, "stem": "<p>Which two are true about changing the LOCAL_UNDO_ENABLED property to false in a CDB? (Choose two.)<\/p>", "options": ["After the change, only a common user with the required privilege can create an undo tablespace in CDB&amp;ROOT.", "Any new PDB and existing PDBs are automatically configured to use the default undo tablespace in CDB$ROOT.", "After the change, only one undo tablespace can exist in CDB$ROOT.", "After the change, any user with the required privilege can create an undo tablespace in the PDBs.", "Undo tablespaces existing in PDBs must be dropped before the change.", "After the change, each existing PDB has to be reopened for the new undo mode to take effect."], "correct": [0, 5], "choose": 2, "explain": "", "origNote": "這題探討的是 Oracle 多租戶架構 (Multitenant Architecture) 中，將 LOCAL_UNDO_ENABLED 屬性更改為 false（關閉 Local Undo） 所帶來的影響。<br/><br/>核心觀念：<br/><br/>預設狀態 (TRUE)： Oracle 12c R2 起，預設為 Local Undo 模式，每個 PDB 都有自己專屬獨立的 Undo 表空間。<br/><br/>更改為 FALSE： 系統會切換回 Shared Undo 模式 (共享模式)。在這種模式下，所有的 PDB 都不再擁有自己的 Undo 空間，而是全部共用根容器 (CDB$ROOT) 裡的 Undo 表空間。<br/><br/>正確答案解析<br/>A. After the change, only a common user with the required privilege can create an undo tablespace in CDB$ROOT.（正確）<br/><br/>說明： 當切換為 Shared Undo 模式後，Undo 表空間的建立與管理權限完全收回到根容器 (CDB$ROOT)。因此，只有具備足夠權限的公用使用者 (Common User，例如 SYS) 才能在 CDB$ROOT 中建立 Undo 表空間。（註：題目選項中的 CDB&amp;ROOT 應為題庫的排版筆誤，實為 CDB$ROOT）。<br/><br/>F. After the change, each existing PDB has to be reopened for the new undo mode to take effect.（正確）<br/><br/>說明： 更改 Undo 模式屬於資料庫架構層級的重大異動。執行完修改指令後，系統不會立刻對運行中的 PDB 熱套用。你必須將現有的各個 PDB 關閉並重新啟動 (reopened)，新的 Undo 模式才會正式生效。<br/><br/>為什麼其他選項是錯的？<br/>B 錯誤： 選項說「所有 PDB 會自動被設定去使用預設的 Undo 表空間」。雖然它們確實會去使用 CDB$ROOT 的 Undo 空間，但如選項 F 所述，這不是「自動」瞬間發生的，而是需要重啟 PDB 才能生效。<br/><br/>C 錯誤： 選項說「在 CDB$ROOT 中只能存在一個 Undo 表空間」。<br/><br/>真相： 即使在 Shared 模式下，你在 CDB$ROOT 依然可以建立多個 Undo 表空間（例如 UNDOTBS1、UNDOTBS2），只是「同一個時間點」只能有一個處於啟用 (Active) 狀態而已。<br/><br/>D 錯誤： 選項說「任何有權限的使用者都可以在 PDB 中建立 Undo 表空間」。<br/><br/>真相： 既然已經改為 false (Shared Undo)，PDB 內部就完全禁止建立自己的 Undo 表空間了。<br/><br/>E 錯誤： 選項說「在更改設定之前，必須先將 PDB 中現有的 Undo 表空間刪除 (dropped)」。<br/><br/>真相： Oracle 沒有這項強制規定。你可以先切換模式並重啟 PDB，舊有的 Local Undo 表空間會變成閒置狀態，之後 DBA 再手動去清理刪除即可，不需要在切換「之前」強制刪除。" }, { "id": "E2-Q38", "exam": 2, "q": 38, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 1, "stem": "<p>Oracle Managed Files (OMF) is enabled in a CDB and this command is successfully executed:<\/p>\n<p><img decoding=\"async\" src=\"../images/E02_Q038_img1.png\"/><\/p>\n<p>Which three are true? (Choose three.)<\/p>", "options": ["Application PDBs that are subsequently created in the APP1 application container will be cloned from APP1$SEED.", "An application seed PDB is created for APP1.", "An application root PDB is created for APP1.", "A default service is created for the application root APP1.", "Application PDBs that are subsequently created in the APP1 application container will be cloned from PDB$SEED.", "APP1 can never be unplugged."], "correct": [2, 3, 4], "choose": 3, "explain": "", "origNote": "題目執行的指令是：<br/>CREATE PLUGGABLE DATABASE app1 AS APPLICATION CONTAINER ...<br/><br/>這個指令的唯一作用是建立一個應用程式容器的「根目錄（Application Root）」。它不會自動幫你建立專屬的應用程式種子（Application Seed，即 app1$seed），也不會自動建立應用程式 PDB。<br/><br/>✅ 正確選項詳解<br/>C. An application root PDB is created for APP1.<br/><br/>正確。 這是 AS APPLICATION CONTAINER 子句的直接行為。它會建立一個名為 app1 的 Application Root PDB，作為這個應用程式容器的管理核心。<br/><br/>D. A default service is created for the application root APP1.<br/><br/>正確。 在 Oracle 系統中，每當建立任何一種 PDB（包含 Application Root）時，都會自動建立一個與該 PDB 同名的預設網路服務（Default Service），讓應用程式可以透過 Listener 連線進來。<br/><br/>E. Application PDBs that are subsequently created in the APP1 application container will be cloned from PDB$SEED.<br/><br/>正確。 這是本題最容易搞混的考點。因為上述指令沒有建立專屬的 Application Seed（app1$seed）。在缺乏專屬 Seed 的情況下，如果你隨後要在這個 app1 容器內建立新的應用程式 PDB，Oracle 預設會退而求其次，從整個 CDB 層級的標準種子庫（PDB$SEED）來進行複製（Clone）。<br/><br/>❌ 錯誤選項陷阱<br/>B. An application seed PDB is created for APP1.<br/><br/>錯誤。 建立 Application Container 絕對不會自動生成 Application Seed。如果你需要一個專屬的 Seed，你必須由 DBA 額外下達指令手動建立（例如：CREATE PLUGGABLE DATABASE AS SEED...）。<br/><br/>A. Application PDBs that are subsequently created in the APP1 application container will be cloned from APP1$SEED.<br/><br/>錯誤。 承上題 B 的邏輯，因為這個指令根本還沒有建立 APP1$SEED，所以後續建立 PDB 時無從 clone 起，只能去抓標準的 PDB$SEED（即選項 E 的行為）。<br/><br/>F. APP1 can never be unplugged.<br/><br/>錯誤。 Application Root 在本質上也是一個 PDB，它完全支援像一般 PDB 一樣被拔出（Unplug）並重新插入（Plug）到其他的 CDB 中。" }, { "id": "E3-Q9", "exam": 3, "q": 9, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 1, "stem": "<p>Which are three of the steps taken by Database Configuration Assistant (DBCA) to clone a remote pluggable database (PBD) starting from Oracle 19c? (Choose three.)<\/p>", "options": ["creating a database link from CDB$ROOT in the local database to the PDB in the remote system that is to be cloned", "creating a database link from CDB$ROOT in the local database to CDB$ROOT in the remote system that is to be cloned", "creating a new empty PDB in the local database from PDB$SEED", "creating a database link from CDB$ROOT in the remote database to be cloned to CDB$ROOT in the local database.", "automatically dropping the database link to the remote database if it already exists", "creating a database link from CDB$ROOT in the remote database to the PDB in the local database", "opening the cloned PDB"], "correct": [0, 2, 6], "choose": 3, "explain": "", "origNote": "這題（Question 9）確實是在考 「使用 DBCA 複製遠端 PDB (Remote PDB Clone)」時，系統底層會自動執行的步驟。<br/>1.建立連向遠端 PDB 的 DB Link (選項 A)。<br/>2.利用 PDB$SEED 在本機建一個空殼 (選項 C)。<br/>3.複製完成後把這個新 PDB 打開 (選項 G)。" }, { "id": "E3-Q14", "exam": 3, "q": 14, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 1, "stem": "<p>Your container database, CDB1, is in local undo mode.<br/>\nYou successfully execute this command while connected to CDB1:<br/>\nCREATE PLUGGABLE DATABASE pdb1 –<br/>\nADMIN USER pdb1_admin IDENTIFIED BY pdb123 ROLES=(CONNECT)<br/>\nCREATE_FILE_DEST=‘/u01/app/oracle/oradata/cdb1/pdb1‘;<br/>\nWhich three are true about PDB1? (Choose three.)<\/p>", "options": ["Service PDB1 is created for remote logins to PDB1.", "It is in mount state after creation.", "It has no local users.", "It has the same number of roles as CDB1.", "It has the same common users defined as does CDB1.", "It has only local roles."], "correct": [0, 1, 4], "choose": 3, "explain": "", "origNote": "繼承公用使用者 (選項 E 正確)： PDB 建立時，會自動從 CDB$ROOT 繼承所有的「公用使用者 (Common Users)」（如 SYS、SYSTEM 等）。" }, { "id": "E4-Q15", "exam": 4, "q": 15, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 2, "stem": "<p>Which two are true about changing the LOCAL_UNDO_ENABLED property to false in a CDB? (Choose two.)<\/p>", "options": ["After the change, any user with the required privilege can create an undo tablespace in the PDBs.", "After the change, only one undo tablespace can exist in CDB$ROOT.", "After the change, each existing PDB has to be reopened for the new undo mode to take effect.", "Undo tablespaces existing in PDBs must be dropped before the change.", "Any new PDB and existing PDBs are automatically configured to use the default undo tablespace in CDB$ROOT.", "After the change, only a common user with the required privilege can create an undo tablespace in CDB$ROOT."], "correct": [2, 5], "choose": 2, "explain": "", "origNote": "Any new PDB and existing PDBs are automatically configured to use the default undo tablespace in CDB$ROOT. (這個敘述過於籠統且帶有陷阱。雖然 PDB 會使用 CDB$ROOT 的 Undo，但關鍵點在於「現有的 PDB」不會「自動」無縫切換，它們必須如正確選項所述「重新開啟 (reopened)」才能套用設定。)" }, { "id": "E4-Q18", "exam": 4, "q": 18, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 2, "stem": "<p>For which two requirements can you use the <strong>USER_TABLESPACE<\/strong> clause with the <strong>CREATE PLUGGABLE DATABASE<\/strong> command? <em>(Choose two.)<\/em><\/p>", "options": ["to exclude a temp tablespace when plugging in a PDB", "to include specific user tablespaces only when relocating a PDB", "to specify a default tablespace in a PDB cloned from another PDB in the same CDB.", "to specify the list of user tablespaces to include when moving a non-CDB to a PDB", "to exclude all tablespaces except SYSTEM, SYSAUX, and TEMP when plugging in a PDB", "to specify the list of tablespaces to include when creating a PDB from the CDB seed"], "correct": [1, 3], "choose": 2, "explain": "", "origNote": "CREATE PLUGGABLE DATABASE pdb_new <br/>FROM pdb_old@dblink <br/>USER_TABLESPACES=('USERS', 'SALES_DATA') <br/>RELOCATE;" }, { "id": "E5-Q9", "exam": 5, "q": 9, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 2, "stem": "<p>Which three can be done using Oracle Database Configuration Assistant (DBCA) starting from Oracle Database 19c? (Choose three.)<\/p>", "options": ["cloning a remote container database in silent mode", "relocating a remote container database in silent mode", "relocating a remote pluggable database in silent mode", "cloning a remote pluggable database in silent mode", "relocating a remote pluggable database in interactive mode", "cloning a remote container database in interactive mode"], "correct": [0, 2, 3], "choose": 3, "explain": "", "origNote": "Relocate Remote PDB： 將遠端機器上的 PDB 幾乎無停機地「搬移 (Relocate)」到本地端。錯誤選項陷阱分析 (為什麼 Interactive mode 錯？)：cloning a remote container database in interactive mode (您勾錯的選項)   relocating a remote pluggable database in interactive mode   錯誤原因： 陷阱在 \"interactive mode (互動式/圖形化介面模式)\"。雖然 DBCA 的圖形化介面也能做很多事，但 Oracle 在 19c 官方發布的新特性清單中，特別強調並針對的是 Silent Mode (靜默模式) 下對 Remote CDB/PDB 複製與搬移的支援。考題直接對應了官方的新功能說明文件，因此所有標示 interactive mode 的選項都是用來混淆的誘餌。" }, { "id": "E5-Q19", "exam": 5, "q": 19, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 2, "stem": "<p>Which three are true about creating container databases (CDBs) and pluggable databases (PDBs) in Oracle 19c and later releases? (Choose three.)<\/p>", "options": ["A CDB can be duplicated using Recovery Manager (RMAN) with no configuration required before starting the duplication.", "A PDB snapshot can be a sparse copy of a source PDB.", "A snapshot copy PDB can be a full copy of a source PDB.", "A PDB snapshot can be a full copy of a source PDB.", "A PDB snapshot depends on an existing storage snapshot of the source PDB.", "A CDB can be duplicated using the Database Configuration Assistant (DBCA) in silent mode with no configuration required before starting the duplication."], "correct": [1, 3, 5], "choose": 3, "explain": "", "origNote": "個答案中，只有一個是正確的，另外兩個踩到了名詞與機制的陷阱！   真正正確的三個選項是：A PDB snapshot can be a sparse copy of a source PDB. (PDB 快照可以是來源 PDB 的稀疏複本)   A PDB snapshot can be a full copy of a source PDB. (PDB 快照可以是來源 PDB 的完整複本)   A CDB can be duplicated using the Database Configuration Assistant (DBCA) in silent mode with no configuration required before starting the duplication. (可以使用 DBCA 靜默模式複製 CDB，在開始複製前不需進行任何手動配置)   💡 專家技術解析這題考驗的是 DBA 對 Oracle 19c 中 CDB 複製工具 (DBCA vs RMAN) 的準備工作差異，以及 快照技術名詞 (PDB Snapshot vs Snapshot Copy PDB) 的嚴格區分。錯誤選項陷阱分析 (為什麼您勾的另外兩個錯了？)：A CDB can be duplicated using Recovery Manager (RMAN) with no configuration required... (您誤踩的陷阱)   錯誤原因： 就像我們在前一題 (Q18) 討論過的，使用 RMAN 執行 DUPLICATE 之前，DBA 必須親自手動準備好一個輔助執行個體 (Auxiliary Instance)。您必須寫好 pfile、啟動到 NOMOUNT 狀態、甚至設定 SQL*Net 連線。這絕對稱不上是 \"no configuration required (無需配置)\"。正確做法： 相反地，如果您使用 DBCA 靜默模式 (dbca -createDuplicateDB ...)，DBCA 會在背景全自動幫您建 pfile、開輔助執行個體、跑 RMAN 複製，這才是真正的「無需事前配置」。A snapshot copy PDB can be a full copy of a source PDB. (您誤踩的陷阱)   錯誤原因： 這是 Oracle 考題最愛玩的文字遊戲。Snapshot Copy PDB： 這是一項依賴底層儲存系統 (如 ACFS 或 ZFS) 快照技術的功能。既然是儲存層級的快照指標，它天生就必定是稀疏的 (Sparse)，絕對不會是「完整複本 (Full copy)」。PDB Snapshot： 這是 18c 以後引入的獨立功能（常搭配快照輪播 Snapshot Carousel 使用）。它可以是唯讀的「完整拷貝 (Full copy)」，也可以搭配特定儲存變成「稀疏拷貝 (Sparse copy)」。所以這題的正確答案是另外兩個描述 PDB Snapshot 的選項" }, { "id": "E8-Q14", "exam": 8, "q": 14, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 2, "stem": "<p>Which three can be done using Oracle Database Configuration Assistant (DBCA) starting from Oracle Database 19c? (Choose three.)<\/p>", "options": ["cloning a remote pluggable database in silent mode", "relocating a remote container database in interactive mode", "cloning a remote container database in interactive mode", "relocating a remote pluggable database in silent mode", "relocating a remote pluggable database in interactive mode", "cloning a remote container database in silent mode"], "correct": [0, 3, 5], "choose": 3, "explain": "", "origNote": "陷阱原因： 雖然 DBCA 提供了圖形化的互動模式 (Interactive mode)，但在 19c 的官方文件與新功能宣告中，針對「遠端 (remote)」的 PDB/CDB 複製與重新定位，特別強調的是透過 Silent mode 所帶來的無縫整合與自動化腳本支援" }, { "id": "E9-Q10", "exam": 9, "q": 10, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 3, "stem": "<p>Which are two of the steps taken by Database Configuration Assistant (DBCA) to clone a remote pluggable database (PDB) starting from Oracle 19c? (Choose two.)<\/p>", "options": ["creating a database link from CDB$ROOT in the local database to the PDB in the remote system that is to be cloned", "backing up the cloned PDB", "leaving the cloned PDB in mount state", "opening the cloned PDB", "creating a database link from CDB$ROOT in the local database to CDB$ROOT in the remote system that is to be cloned"], "correct": [3, 4], "choose": 2, "explain": "", "origNote": "錯誤原因： 如果您是純手工下達 CREATE PLUGGABLE DATABASE ... FROM ... 指令，建立完畢後 PDB 確實會預設停留在 MOUNTED 狀態，需要您手動 ALTER PLUGGABLE DATABASE ... OPEN。但是！這題問的是 DBCA 的行為，DBCA 作為一個自動化精靈工具，它的最後一個步驟會貼心地幫您把 PDB「打開 (Opening)」，而不是讓它留在 MOUNT 狀態。" }, { "id": "E10-Q35", "exam": 10, "q": 35, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 3, "stem": "<p>Which two are true about Lockdown profiles in a container database (CDB) and its pluggable databases (PDBs)? (Choose two.)<\/p>", "options": ["A PDB Lockdown profile can be created in a regular PDB.", "A Lockdown profile created from a base Lockdown profile is always automatically modified if the profile on which it is based is modified.", "A Lockdown profile created from a base Lockdown profile is never automatically modified if the profile on which it is based is modified.", "A PDB Lockdown profile can be created in an application root.", "A PDB Lockdown profile can be created in CDB$ROOT."], "correct": [3, 4], "choose": 2, "explain": "", "origNote": "新題型!!<br/>這是一個標準的「實務與考題預設解答有落差」的陷阱題！<br/><br/>根據 1Z0-083 官方考試的預設解答，您勾選的項目中有一個與標準答案不符。<br/><br/>官方題庫的正確解答是：<br/><br/>☑ A PDB Lockdown profile can be created in an application root. (PDB 鎖定設定檔可以在應用程式根目錄中建立。)<br/><br/>☑ A PDB Lockdown profile can be created in CDB$ROOT. (PDB 鎖定設定檔可以在 CDB$ROOT 中建立。)<br/><br/>💡 專家技術解析與考試生存指南<br/>這題考驗的是 DBA 對於多租戶架構中「權限管控 (Lockdown Profiles)」層級的理解。<br/><br/>為什麼官方答案是這兩個？<br/><br/>集中管理的初衷 (CDB$ROOT)： 在 Oracle 12.2 剛推出這個功能時，Lockdown Profile 只能建立在全域根目錄 (CDB$ROOT) 中。它的設計初衷是讓超級管理員在最上層建立好安全規範，然後套用到下層的各個 PDB，限制他們不能執行某些指令（例如禁止 ALTER SYSTEM 或限制某些網路功能）。<br/><br/>應用程式層級的集中管控 (application root)： 隨著 Application Container 架構的引入，Oracle 允許在「應用程式根目錄 (Application Root)」中建立設定檔，這樣就能統一把安全規範套用到該應用程式底下的所有 Application PDBs。<br/><br/>為什麼您選的 regular PDB 在考試中不能選？<br/><br/>實務上的確可以 (18c/19c 新功能)： 您的觀念在實務上是正確的！從 Oracle 18c 開始，官方確實開放了在一般的 PDB 裡面建立「本機鎖定設定檔 (Local PDB Lockdown Profile)」。<br/><br/>考試的潛規則： 這題是從 12cR2 延續下來的經典考題。在 OCP 考試的語境中，題目沒有特別標示 \"Local\" 時，它指的通常是可以用來「分發/套用給別人」的公用鎖定設定檔 (Common PDB Lockdown Profile)。這種具有向下約束力的 Profile，只能建立在 CDB$ROOT 或 Application Root。為了順利拿分，請務必記住這兩個「根目錄 (Root)」級別的答案。<br/><br/>錯誤選項陷阱分析 (關於基底設定檔)：<br/><br/>A Lockdown profile created from a base... is always / never automatically modified...<br/><br/>這兩個選項在探討「繼承與連動」。當您使用 CREATE PDB LOCKDOWN PROFILE p2 FROM p1; 時，Oracle 在底層只是做了一個「當下狀態的靜態複製」。未來如果您修改了 p1，這些變更是不會 (never) 自動同步到 p2 的。雖然 never 這個敘述在技術上是正確的，但本題的官方解答邏輯更側重於「建立位置 (Where to create)」，因此標準答案鎖定在兩個 Root 目錄上。" }, { "id": "E12-Q4", "exam": 12, "q": 4, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 3, "stem": "<p>Which two are true about PDB archive files? (Choose two.)<\/p>", "options": ["They must be created using the DBMS_PDB package", "They contain a PDB manifest file and all the data files in compressed form for a PDB", "They contain a PDB manifest file and all the data files in uncompressed form for a PDB", "DBMS_PDB.CHECK_PLUG_COMPATIBILITY can be run against a PDB archive", "They contain all the data files only in uncompressed form for a PDB", "They contain all the data files only in compressed form for a PDB"], "correct": [1, 3], "choose": 2, "explain": "", "origNote": "新題型<br/>在早期的版本，當您 Unplug 一個 PDB 時，只會產生一個 XML 清單檔，您還必須「手動」去複製所有的底層資料檔 (.dbf) 到目標伺服器。為了簡化這個流程，Oracle 引入了 PDB Archive (.pdb 檔)。<br/><br/>正確選項分析：<br/><br/>PDB Archive 的內容物 (...manifest file and all the data files in compressed form...)：<br/>當您在 Unplug 時指定副檔名為 .pdb (例如：UNPLUG INTO '/path/mydb.pdb')，Oracle 會自動將 XML 清單檔與所有相關的資料檔打包，並壓縮成單一個檔案。這讓 DBA 只要搬移一個檔案就能完成 PDB 的轉移，非常方便。<br/><br/>相容性檢查 (DBMS_PDB.CHECK_PLUG_COMPATIBILITY...)：<br/>在將 PDB 插回另一個 CDB 之前，最佳實務是先檢查相容性。這個內建的 PL/SQL 包過去只接受 .xml 檔作為參數，但在支援 PDB Archive 後，它也能直接讀取 .pdb 壓縮檔來進行分析，確認目標 CDB 是否支援這個 PDB。" }, { "id": "E12-Q8", "exam": 12, "q": 8, "topic": "10_Multitenant_PDB", "topicTitle": "Multitenant CDB / PDB 管理", "part": 3, "stem": "<p>A container database called CDB1 is OMF-enabled.<br/>PDB_FILE_NAME_CONVERT is not configured in CDB1.<br/>PDB1 was unplugged from CDB1 earlier in the week.<br/>Examine this command, which will be executed in CDB1:<br/>CREATE PLUGGABLE DATABASE pdb1 –<br/>USING ′/u01/app/oracle/oradata/pdb1.xml‘<br/>SOURCE_FILE_NAME_CONVERT =<br/>(′/u01/app/oracle/oradata/‘, ′/u02/app/oracle/oradata/‘);<br/>Which two are true? (Choose two.)<\/p>", "options": ["/u01/app/oracle/oradata/pdb1.xml does not contain the current locations of data files for PDB1.", "PDB1 must be dropped from CDB1.", "PDB_FILE_NAME_CONVERT must be set before executing the command.", "DBMS_PDB.CHECK_PLUG_COMPATIBILITY must be run in CDB1 before executing the command.", "PDB1 data files already exist in the correct location."], "correct": [0, 1], "choose": 2, "explain": "", "origNote": "為什麼必須先 Drop PDB1 (PDB1 must be dropped...)：<br/>當您執行 UNPLUG 指令時，Oracle 會產生一份 XML 檔來記錄 PDB 的中繼資料，但 該 PDB 依然會保留在 CDB 的資料字典中（狀態會變成 UNPLUGGED）。如果您想要用相同的名稱 (pdb1) 重新把它 Plug 回同一個 CDB，您必須先執行 DROP PLUGGABLE DATABASE pdb1 KEEP DATAFILES;，清掉舊有的記錄後，才能執行 CREATE PLUGGABLE DATABASE。<br/><br/>SOURCE_FILE_NAME_CONVERT 的真正用途 (xml does not contain the current locations...)：<br/>為什麼指令中需要加上 SOURCE_FILE_NAME_CONVERT？這個參數專門用來處理「實體檔案在 Unplug 之後，被人為在 OS 層級移動過了」的情境。<br/>也就是說，當初產生的 pdb1.xml 裡面記錄資料檔在 /u01/...，但後來檔案被移走了。為了讓 Oracle 找得到「現在」檔案在哪裡來當作來源，我們用語法告訴它：「請把 XML 裡的 /u01/ 替換成 /u02/ 去找檔案」。這直接證明了 XML 檔內的記錄已經不是檔案現在的真實位置。<br/><br/>錯誤選項陷阱分析 (為什麼您勾選的不能選)：<br/><br/>PDB1 data files already exist in the correct location. (您誤選的選項)<br/><br/>錯誤原因： 如果檔案「已經在未來要運作的正確位置上」，我們在執行 CREATE PLUGGABLE DATABASE 時，會明確加上 NOCOPY 子句，叫 Oracle 直接用原地的檔案。但題目中的指令並沒有 NOCOPY，這代表 Oracle 會執行「複製」動作。加上這台 CDB 是 OMF-enabled (啟用 Oracle 管理檔案)，所以 Oracle 會從 SOURCE_FILE_NAME_CONVERT 算出的來源端，把檔案複製到 OMF 自動決定的新路徑去。檔案現在並不在最終的「正確」位置上。" }] };

    const REASONS = ["觀念不清", "看錯題目", "粗心誤選", "單字不懂", "題目陷阱", "死背記錯", "題庫疑慮"];

    /* ---------------- storage ---------------- */
    let store = load();
    function load() {
      try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.records) return s; } catch (e) { }
      return { records: {}, settings: {} };
    }
    function save() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); refreshStats(); }
    function rec(id) { return store.records[id] ||= { attempts: 0, wrong: 0, right: 0, note: "", reasons: [], star: false, mastered: false, lastPicks: [], lastResult: null, lastWrongAt: null }; }
    function isWrong(id) { const r = store.records[id]; return r && r.wrong > 0 && !r.mastered; }

    /* ---------------- cloud sync (GitHub Gist) ---------------- */
    const DEFAULT_GIST_ID = "9d0d720da681e9b2b01fc6efbd817c84";
    const GIST_FILENAME = "1z0-083-data.json";

    function getGistConfig() {
      let token = localStorage.getItem("gist_token");
      let gistId = localStorage.getItem("gist_id");

      if (!token) {
        token = prompt("請輸入您的 GitHub Personal Access Token (需勾選 gist 權限)：");
        if (token) {
          token = token.trim();
          localStorage.setItem("gist_token", token);
        }
      }

      if (!gistId) {
        gistId = prompt("請輸入您的 Gist ID：", DEFAULT_GIST_ID);
        if (gistId) {
          gistId = gistId.trim().replace(/\/+$/, "").split("/").pop();
          localStorage.setItem("gist_id", gistId);
        }
      }

      if (!token || !gistId) {
        alert("⚠️ 缺少 GitHub Token 或 Gist ID，無法執行雲端同步。");
        return null;
      }

      return { token, gistId };
    }

    async function syncToCloud() {
      const config = getGistConfig();
      if (!config) return;

      try {
        // 複製 localStorage 並排除 gist_token 與 gist_id，避免 Token 上傳至 Gist 被 GitHub 自動撤銷 (Secret Scanning)
        const backupData = { ...localStorage };
        delete backupData.gist_token;
        delete backupData.gist_id;

        const response = await fetch(`https://api.github.com/gists/${config.gistId}`, {
          method: "PATCH",
          headers: {
            "Authorization": `Bearer ${config.token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            files: {
              [GIST_FILENAME]: {
                content: JSON.stringify(backupData, null, 2)
              }
            }
          })
        });

        if (response.ok) {
          alert("✅ 進度已成功備份至雲端！");
        } else {
          const errData = await response.json().catch(() => ({}));
          if (response.status === 401 || response.status === 403 || response.status === 404) {
            localStorage.removeItem("gist_token");
            localStorage.removeItem("gist_id");
          }
          alert(`❌ 備份失敗 (${response.status})：${errData.message || response.statusText}\n\n(若為認證或 ID 錯誤，已自動清除舊設定，請再點一次按鈕重新輸入 Token)`);
        }
      } catch (error) {
        console.error("雲端備份錯誤：", error);
        alert("❌ 網路連線異常或備份過程發生錯誤：" + error.message);
      }
    }

    async function syncFromCloud() {
      const config = getGistConfig();
      if (!config) return;

      try {
        const response = await fetch(`https://api.github.com/gists/${config.gistId}`, {
          headers: {
            "Authorization": `Bearer ${config.token}`,
            "Accept": "application/vnd.github+json"
          }
        });

        if (response.ok) {
          const gist = await response.json();
          const file = gist.files && gist.files[GIST_FILENAME];
          if (!file || !file.content) {
            alert(`❌ 在此 Gist 中找不到 ${GIST_FILENAME} 的備份資料！`);
            return;
          }
          const data = JSON.parse(file.content);
          for (const key in data) {
            if (Object.prototype.hasOwnProperty.call(data, key) && key !== "gist_token" && key !== "gist_id") {
              localStorage.setItem(key, data[key]);
            }
          }
          alert("✅ 已成功從雲端下載進度！即將重新整理頁面。");
          location.reload();
        } else {
          const errData = await response.json().catch(() => ({}));
          if (response.status === 401 || response.status === 403 || response.status === 404) {
            localStorage.removeItem("gist_token");
            localStorage.removeItem("gist_id");
          }
          alert(`❌ 下載失敗 (${response.status})：${errData.message || response.statusText}\n\n(若為認證或 ID 錯誤，已自動清除舊設定，請再點一次按鈕重新輸入 Token)`);
        }
      } catch (error) {
        console.error("雲端下載錯誤：", error);
        alert("❌ 網路連線異常或下載過程發生錯誤：" + error.message);
      }
    }

    /* ---------------- helpers ---------------- */
    const $ = s => document.querySelector(s);
    const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[a[i], a[j]] = [a[j], a[i]]; } return a; };

    /* ---------------- sidebar ---------------- */

    /* ---------------- session ---------------- */

      ${a.submitted ? `<div class="result ${a.ok ? "ok" : "bad"}">${a.ok ? "🎉 答對了！" : "😵 答錯了"} <small>正確答案：${correctLetters}</small></div>` : ""}
      <div class="actions">
        <button class="btn" id="prev" ${S.idx === 0 ? "disabled" : ""}>← 上一題</button>

          : `<button class="btn primary" id="submit" ${a.picks.length ? "" : "disabled"}>提交答案</button>`}
        ${a.submitted && r.wrong && !r.mastered ? `<button class="btn" id="master">✅ 標記已掌握</button>` : ""}
        <div class="spacer"></div>
        <span class="hint">${multi ? `已選 ${a.picks.length} / ${q.choose}` : ""}</span>
      </div>
      ${a.submitted && (q.origNote || q.explain) ? `
        <details class="box" id="orig" ${(!a.ok && $("#opt-opennote").checked) ? "open" : ""}>

    }

    function bookIds() {
      let ids = DATA.questions.map(q => q.id).filter(id => {
        const r = store.records[id]; if (!r) return false;
        if (bookFilter.show === "wrong") return isWrong(id);

      });

      const R = id => store.records[id];
      if (bookFilter.sort === "wrong") ids.sort((a, b) => R(b).wrong - R(a).wrong);

    }
    function renderBook() {
      $("#crumb").innerHTML = "<b>錯題本</b>";
      const ids = bookIds();
      $("#view").innerHTML = `
    <div class="wb-tools">

      <button class="btn primary" id="wb-practice" ${ids.length ? "" : "disabled"}>▶ 練習這 ${ids.length} 題</button>
      <button class="btn" id="wb-md">⬇ 匯出 Markdown</button>

    </div>
    ${ids.length ? ids.map(wbItem).join("") : `<div class="empty card">🎉 目前沒有符合條件的題目</div>`}`;
      $("#f-show").value = bookFilter.show; $("#f-topic").value = bookFilter.topic; $("#f-sort").value = bookFilter.sort;
      $("#f-show").onchange = e => { bookFilter.show = e.target.value; renderBook(); };
      $("#f-topic").onchange = e => { bookFilter.topic = e.target.value; renderBook(); };
      $("#f-sort").onchange = e => { bookFilter.sort = e.target.value; renderBook(); };
      $("#wb-practice").onclick = () => startSession(ids, "錯題本練習");
      $("#wb-md").onclick = () => exportMd(ids);
      $("#wb-json").onclick = () => download(`ocp083_quiz_backup_${today()}.json`, JSON.stringify(store, null, 2), "application/json");
      $("#wb-import").onclick = () => $("#import-file").click();
      $("#wb-reset").onclick = () => { if (confirm("確定清除所有作答紀錄與筆記？建議先備份 JSON。")) { store = { records: {}, settings: {} }; save(); renderTopics(); renderBook(); } };
    }
    const today = () => new Date().toISOString().slice(0, 10);
    const strip = h => { const d = document.createElement("div"); d.innerHTML = h; d.querySelectorAll("br").forEach(b => b.replaceWith("\n")); return d.textContent.trim(); };
    function exportMd(ids) {
      let md = `# Oracle 1Z0-083 錯題本（${today()}）\n\n共 ${ids.length} 題\n`;
      ids.forEach((id, n) => {
        const q = QMAP[id], r = rec(id);
        md += `\n---\n\n## ${n + 1}. ${id.split("@")[0]}　〔${q.topicTitle}〕　錯 ${r.wrong}/${r.attempts} 次\n\n${strip(q.stem)}\n\n`;
        q.options.forEach((o, i) => { md += `- ${q.correct.includes(i) ? "✅" : (r.lastPicks || []).includes(i) ? "❌" : "　"} **${LETTERS[i]}.** ${strip(o)}\n`; });
        md += `\n**正解：** ${q.correct.map(i => LETTERS[i]).join(", ")}　**上次選：** ${(r.lastPicks || []).map(i => LETTERS[i]).join(", ") || "-"}\n`;
        if (r.reasons.length) md += `\n**錯誤原因：** ${r.reasons.join("、")}\n`;
        if (r.note) md += `\n**我的筆記：**\n\n> ${r.note.replace(/\n/g, "\n> ")}\n`;
      });
      download(`ocp083_wrong_book_${today()}.md`, md, "text/markdown");
    }
    function download(name, text, type) {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" }));
      a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    $("#import-file").onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      f.text().then(t => {
        try {
          const s = JSON.parse(t); if (!s.records) throw 0;
          const merge = confirm("按「確定」合併到目前紀錄；按「取消」完全覆蓋。");
          store = merge ? { ...store, records: { ...store.records, ...s.records } } : s;
          save(); renderTopics(); setView(view); toast("匯入完成");
        } catch (err) { alert("檔案格式不正確"); }
      });
      e.target.value = "";
    };

    /* ---------------- wiring ---------------- */
    const allIds = () => DATA.questions.map(q => q.id);
    $("#btn-all").onclick = () => { startSession(allIds(), "全部題目"); closeMenu(); };
    $("#btn-random").onclick = () => { startSession(shuffle(allIds()).slice(0, 20), "隨機 20 題"); closeMenu(); };
    $("#btn-wrong").onclick = () => { startSession(allIds().filter(isWrong), "練習錯題"); closeMenu(); };
    $("#btn-star").onclick = () => { startSession(allIds().filter(id => store.records[id]?.star), "加星題目"); closeMenu(); };
    $("#btn-unseen").onclick = () => { startSession(allIds().filter(id => !store.records[id]?.attempts), "未作答題目"); closeMenu(); };
    $("#btn-book").onclick = () => { setView("book"); closeMenu(); };
    $(".brand").onclick = () => { setView("home"); closeMenu(); };
    $("#tab-home").onclick = () => setView("home");
    $("#tab-quiz").onclick = () => setView(S ? "quiz" : "home");
    $("#tab-book").onclick = () => setView("book");
    $("#menu").onclick = () => $("#sidebar").classList.toggle("show");
    function closeMenu() { $("#sidebar").classList.remove("show"); }
    ["opt-shufq", "opt-shufo", "opt-opennote"].forEach(k => {
      const el = $("#" + k); if (store.settings?.[k] !== undefined) el.checked = store.settings[k];
      el.onchange = () => { store.settings ||= {}; store.settings[k] = el.checked; save(); };
    });
    document.addEventListener("keydown", e => {
      if (view !== "quiz" || !S || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT" || e.ctrlKey || e.metaKey || e.altKey) return;
      const id = S.list[S.idx], a = S.ans[id], k = e.key.toUpperCase();
      const di = LETTERS.indexOf(k);
      if (di >= 0 && di < a.order.length && k.length === 1) { togglePick(a.order[di]); }
      else if (e.key === "Enter") { e.preventDefault(); a.submitted ? next() : submit(); }
      else if (e.key === "ArrowRight") go(S.idx + 1);
      else if (e.key === "ArrowLeft") go(S.idx - 1);
      else if (k === "S") toggleStar();
    });

    renderTopics(); refreshStats(); setView("home");
  </script>
</body>

</html>
