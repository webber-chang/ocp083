jar 工具的目的是掃描資料庫的資料字典與中繼資料，找出升級前需要修正的問題，並為你產生對應的修復指令碼 (preupgrade_fixups.sql)。<br/>為了能夠讀取這些內部字典資訊，該 PDB 必須處於開啟狀態（READ ONLY 或 READ WRITE 皆可）。如果 PDB 只是在 MOUNTED 狀態，系統無法讀取其內部資料，自然就無法為它產生修復指令碼。<br/><br/>套用到題目的情境：<br/><br/>CDB1 (根容器 CDB$ROOT)： 整個系統的基石，工具一定會掃描並產生。 ➔ (產生)<br/><br/>PDB$SEED： 狀態為 READ ONLY，可以讀取。 ➔ (產生)<br/><br/>PDB1： 狀態為 READ WRITE，可以讀取。 ➔ (產生)<br/><br/>PDB2： 狀態為 MOUNTED（未開啟），工具無法連入掃描。 ➔ (不產生)<br/><br/>因此，修復指令碼只會針對 CDB1, PDB$SEED, 和 PDB1 產生。" }, { "id": "E2-Q48", "exam": 2, "q": 48, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 2, "stem": "<p>Which two are true about an Oracle gold image-based installation in Oracle 18c and later releases? (Choose two.)<\/p>", "options": ["It can be used for both Oracle Database and Oracle Grid Infrastructure installation.", "It can only install and configure Oracle Database software. The database has to be created separately.", "It does not require the setup wizard.", "It uses a single RPM that automatically extracts and installs the Oracle Database software.", "It can be used to install and upgrade Oracle Database for single-instance and cluster configurations."], "correct": [0, 4], "choose": 2, "explain": "", "origNote": "✅ 正確選項解析<br/>A. It can be used for both Oracle Database and Oracle Grid Infrastructure installation. (可用於安裝 Oracle Database 與 Oracle Grid Infrastructure)<br/>正確。Oracle 不僅為 Database (關聯式資料庫軟體) 提供 Gold Image，也為 Grid Infrastructure (叢集與儲存管理軟體) 提供 Gold Image。兩者的安裝模式現在都是直接解壓到各自的 Home 目錄中執行設定。<br/><br/>E. It can be used to install and upgrade Oracle Database for single-instance and cluster configurations. (可用於安裝與升級單一執行個體與叢集架構的 Oracle Database)<br/>正確。Gold Image 的設計不僅是為了全新安裝 (Install)，它也是佈署 Out-of-Place Upgrade (異地升級) 或快速套用 RU (Release Update) 補丁的標準做法，且完全支援單機版 (Single-instance) 與 RAC (Cluster) 叢集環境。<br/><br/>❌ 錯誤選項解析<br/>B. It can only install and configure Oracle Database software. The database has to be created separately. (只能安裝與設定資料庫「軟體」。資料庫必須另外建立)<br/>錯誤。雖然 Gold Image 主要包含軟體二進位檔 (Binaries)，但當您執行解壓後的 runInstaller 啟動圖形介面 (OUI) 或靜默安裝時，依然會提供「建立並設定資料庫 (Create and configure a database)」的選項，您不需要強制分開執行 DBCA 才能建庫。<br/><br/>C. It does not require the setup wizard. (不需要安裝精靈)<br/>錯誤。把 zip 檔解壓縮到 $ORACLE_HOME 只是第一步。您仍然必須執行 runInstaller（開啟 setup wizard 圖形介面）或使用回應檔 (Response file) 進行靜默安裝，以便將該 Oracle Home 註冊到 Central Inventory、重新連結 (relink) 執行檔，以及設定作業系統群組權限。<br/><br/>D. It uses a single RPM that automatically extracts and installs the Oracle Database software. (使用單一 RPM 自動解壓並安裝 Oracle Database 軟體)<br/>錯誤。雖然 Oracle 18c 確實引入了另一種全新的「RPM-based 安裝」功能（透過 yum/dnf 安裝單一 RPM 檔），但那與本題問的「Gold Image-based (基於黃金映像檔)」是兩種不同的安裝機制。Gold Image 是使用 .zip 壓縮檔，而非 RPM。" }, { "id": "E3-Q23", "exam": 3, "q": 23, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 2, "stem": "<p>Which three are true about patchsets? (Choose three.)<\/p>", "options": ["They can be applied in a rolling fashion for Clusterware and the databases.", "They can introduce new features.", "They are installed via OPatch or OPatchAuto.", "Installing a patchset is considered an ?upgrade?.", "They are only released quarterly.", "A base release is not needed to install patchsets."], "correct": [1, 3, 5], "choose": 3, "explain": "", "origNote": "introduce --介紹、採用<br/><br/>Patchset (修補程式集，如 11.2.0.4) = 當作「升級」來對待。有新功能、會動到核心字典、必須停機 (Downtime)。<br/><br/>PSU / RU (季度更新包) = 當作「維護」來對待。專注修 Bug 與補漏洞、可以用 OPatch 進行 RAC 節點的輪替滾動升級 (Rolling Upgrade)，能做到服務不中斷。" }, { "id": "E4-Q6", "exam": 4, "q": 6, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 2, "stem": "<p>Examine this command:<br/>$ rhpctl move database -sourcehome Oracle_home_path -destinationhome Oracle_home_path<br/>For which two purposes can you use this command? (Choose two.)<\/p>", "options": ["to switch back to the previous Oracle home as part of a rollback operation", "to switch to a patched Oracle Database home", "to switch the Oracle Database home when using a centralized Rapid Home Provisioning server", "to switch to a read-only Oracle home", "to switch an existing Oracle Database home to a newer release of Oracle software on the same server"], "correct": [0, 1], "choose": 2, "explain": "", "origNote": "在 Oracle 資料庫的管理與 OCP 考試情境中，\"Newer Release\" (新版本升級) 與 \"Patch\" (修補程式更新) 是兩個完全不同的維度，它們使用的工具、影響範圍與底層邏輯都不一樣。以下為你詳細對比這兩者的核心差異：1. Newer Release (新版本 / 升級 Upgrade)定義： 指的是跨大版本的升級 (Major Upgrade)。例如將資料庫從 Oracle 12c 升級到 Oracle 19c，或是從 18c 升級到 19c。底層變化： 這是非常具破壞性與結構性的變更。資料庫的核心架構、資料字典 (Data Dictionary) 的結構、甚至系統表格都會發生重大改變。使用的指令 / 工具：如果你是手動或用圖形介面升級，通常會使用 DBUA (Database Upgrade Assistant)。如果你使用 RHP (Rapid Home Provisioning) 來管理，你必須使用 rhpctl upgrade database 指令，因為它需要觸發資料字典的升級腳本。複雜度與風險： 極高。通常需要長時間的停機 (Downtime) 以及嚴格的應用程式相容性測試。2. Patch (修補程式 / 更新 Patching)定義： 指的是在同一個大版本之內，套用錯誤修正、安全性更新 (Release Update, RU) 或小幅度優化。例如你的資料庫原本是 19.3，套用 Patch 後變成 19.14，但它依然是 Oracle 19c。底層變化： 核心架構與資料字典的結構基本上維持不變，主要是替換有 Bug 的二進位執行檔 (Binaries) 或做輕微的 SQL 修補。使用的指令 / 工具：傳統作法：使用 opatch 或 opatchauto。使用 RHP 異地修補 (Out-of-place patching)：準備好一個已經打完 Patch 的新資料夾 (Destination Home)，然後使用 rhpctl move database 指令將資料庫「平移」過去運行。   複雜度與風險： 較低。透過異地修補機制，可以將停機時間縮短到只有重新啟動資料庫的那幾分鐘，且若發生問題可以隨時 rollback (退回)。" }, { "id": "E5-Q4", "exam": 5, "q": 4, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 2, "stem": "<p>Which three are true about using Database Upgrade Assistant (DBUA) to upgrade a database? (Choose three.)<\/p>", "options": ["A whole database backup must exist before upgrade", "Multiple databases with the same ORACLE_HOME can be upgraded simultaneously.", "All pluggable databases are automatically upgraded as part of a container database upgrade.", "DBUA must be launched from the target Oracle Home.", "The database must be opened in read-only mode.", "The Pre-Upgrade Information Tool script is executed by DBUA."], "correct": [2, 3, 5], "choose": 3, "explain": "", "origNote": "Multiple databases with the same ORACLE_HOME can be upgraded simultaneously. (您勾錯的選項)<br/>錯誤原因： 雖然同一個舊的 Oracle Home 底下可能跑了好幾個獨立的資料庫（例如 DB1, DB2, DB3），但 單一個 DBUA 視窗/程序每次只能針對「一個」資料庫（或單一個 CDB 及其 PDB）進行升級。你不能在 DBUA 介面上打勾多個獨立的資料庫叫它「同時」升級。" }, { "id": "E7-Q32", "exam": 7, "q": 32, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 2, "stem": "<p>Which three are true about opatchauto? (Choose three.)<\/p>", "options": ["It requires the Oracle Grid Infrastructure and Oracle Database instances to be shut down before being invoked.", "It applies patches in nonrolling mode by default.", "It is used to apply interim patches to Oracle Grid Infrastructure and Oracle Database home combinations.", "It performs a shutdown and then a restart of all processes in both Oracle Grid Infrastructure and Oracle Database home during the patching process.", "It must be invoked by a user with root user privileges.", "Patches are applied via opatchauto."], "correct": [2, 3, 4], "choose": 3, "explain": "", "origNote": "It must be invoked by a user with root user privileges.<br/>Patches are applied via opatchauto. (您誤選的選項)<br/><br/>錯誤原因： 這是一個觀念陷阱。opatchauto 是一個「自動化流程編排工具 (Orchestrator)」，它負責流程控制與權限切換，但真正將 Patch 檔案應用到底層二進制檔的，依然是傳統的 opatch 執行檔" }, { "id": "E7-Q39", "exam": 7, "q": 39, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 3, "stem": "<p>Examine this command: $ rhpctl move database sourcehome Oracle_home_path destinationhome Oracle_home_path For which two purposes can you use this command? (Choose two.)<\/p>", "options": ["to switch to a patched Oracle Database home", "to switch to a read-only Oracle home", "to switch an existing Oracle Database home to a newer release of Oracle software on the same server", "to switch back to the previous Oracle home as part of a rollback operation", "to switch the Oracle Database home when using a centralized Rapid Home Provisioning server"], "correct": [0, 3], "choose": 2, "explain": "", "origNote": "Newer Release (跨大版本升級)： 例如從 Oracle 12c、18c 升級到 19c。這類操作會變更資料庫核心資料字典 (Data Dictionary) 的實體結構，因此必須使用 rhpctl upgrade database 指令<br/>Patched Home (同版本修補/Release Update)： 例如在 Oracle 19c 內部從 19.3 更新到 19.10。這只是替換底層的二進制執行檔 (Binaries) 以修復漏洞，核心結構並未改變，因此使用的是 rhpctl move database 指令來「移動」環境。" }, { "id": "E8-Q15", "exam": 8, "q": 15, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 3, "stem": "<p>Which two are true about an RPM-based Oracle Database installation? (Choose two.)<\/p>", "options": ["It requires an Unbreakable Linux Network (ULN) subscription.", "It includes the Oracle Preinstallation RPM.", "It uses a service configuration script to create a single-instance database as part of the installation.", "It performs a software-only Oracle Database installation.", "From Oracle Database 18c, a single RPM can be used to install only Oracle Database Server for a single instance."], "correct": [2, 3], "choose": 2, "explain": "", "origNote": "服務配置指令碼 (Service configuration script)：<br/>軟體安裝完成後，RPM 會在系統中放置一個設定指令碼（通常位於 /etc/init.d/oracledb_ORCLCDB-19c configure）。DBA 只要執行這個腳本，它就會在背景自動呼叫 DBCA 並幫您建好一個預設的單機版容器資料庫 (CDB) 與 PDB。這被視為 RPM 安裝流程的標準後半段作業。<br/><br/>您誤選的陷阱分析：<br/>It includes the Oracle Preinstallation RPM. (您誤選的選項)<br/>錯誤原因： 這是一個非常容易混淆的觀念！oracle-database-preinstall-19c（用來自動配置 OS 參數、建立 oracle 使用者與群組的套件）是一個獨立的 RPM 檔案，它是安裝 Database RPM 的「先決條件 (Prerequisite)」，但它並沒有被包裝 (include) 在 Database RPM 檔案裡面。您必須先透過 yum install 獨立安裝它。" }, { "id": "E9-Q41", "exam": 9, "q": 41, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 3, "stem": "<p>Which two are true about a read-only Oracle home? (Choose two.)<\/p>", "options": ["It is enabled by performing a software-only Oracle Database installation and then running the roohctl -enable script.", "It is enabled by performing an Oracle Database installation with database creation and then running the roohctl -enable script.", "Its configuration data and log files reside in subdirectories under the Oracle home.", "It contains an image that can be distributed across multiple servers.", "It requires the Rapid Home Provisioning service."], "correct": [0, 3], "choose": 2, "explain": "", "origNote": "新題型" }, { "id": "E11-Q4", "exam": 11, "q": 4, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 3, "stem": "<p>You must migrate a non-CDB Oracle 11g Database to a CDB without first performing an upgrade to the non-CDB.<br/>User-defined objects are stored in several tablespaces in the non-CDB.<br/>Which three methods can you use? (Choose three.)<\/p>", "options": ["the DBMS_PDB package", "Data Pump full database export and import", "replication using GoldenGate", "cloning the non-CDB as a PDB", "Data Pump full transportable database", "Data Pump transportable tablespaces"], "correct": [1, 4, 5], "choose": 3, "explain": "", "origNote": "關於將未升級的 Oracle 11g non-CDB 直接遷移到 CDB 的考題，這是一個非常經典的版本限制陷阱題，您勾選的答案並不完全正確。<br/><br/>官方題庫的正確解答應該是：<br/><br/>☑ Data Pump full database export and import (Data Pump 完整資料庫匯出與匯入)<br/><br/>☑ Data Pump full transportable database (Data Pump 完整可傳輸資料庫)<br/><br/>☑ Data Pump transportable tablespaces (Data Pump 可傳輸表空間)<br/><br/>💡 專家技術解析<br/>這題的「破題關鍵」在於兩個條件：「來源端是 Oracle 11g」 以及 「沒有事先將 11g 升級 (without first performing an upgrade)」。<br/><br/>Oracle 11g 是一個非常舊的版本，它完全不懂什麼是多租戶架構 (CDB/PDB)。所有跟 PDB 扯上關係的「原生捷徑」在 11g 身上通通不管用。因此，您只能依賴 Oracle 最傳統、跨版本相容性最強的資料搬移神器：Data Pump 家族。<br/><br/>正確選項分析 (為什麼 Data Pump 家族可以)：<br/><br/>Data Pump full database export and import (expdp/impdp)： 這是純邏輯的遷移。您可以從 11g 倒出資料，然後直接灌進 12c/19c 的 PDB 中，完全不受底層架構改變的影響。<br/><br/>Data Pump transportable tablespaces (TTS) 與 full transportable database： 這是物理檔案遷移結合邏輯中繼資料的方法。只要 11g 升級到 11.2.0.3 以上，Oracle 官方支援直接將 11g 的資料檔 (Datafiles) 拔下來，透過 Data Pump 匯出 Metadata，然後直接「插入 (Plug)」到 12c 以上的 PDB 中，速度極快且不需事先升級整個 11g 系統。<br/><br/>錯誤選項陷阱分析 (為什麼您選的其他兩個不行)：<br/><br/>cloning the non-CDB as a PDB (您勾選的錯誤選項)：<br/><br/>錯誤原因： 透過 Database Link 直接執行 CREATE PLUGGABLE DATABASE ... FROM non-CDB 這種熱複製 (Cloning) 技術，要求來源端的 non-CDB 至少必須是 Oracle 12c (12.1.0.2)。11g 不支援這種無縫接軌的 PDB 複製語法。<br/><br/>replication using GoldenGate (您勾選的錯誤選項)：<br/><br/>錯誤原因： 雖然 GoldenGate 確實可以跨版本同步資料，但在 OCP 考試的標準定義中，GoldenGate 是用來做「資料複寫 (Replication)」以達到零停機時間的輔助工具，它本身無法幫您搬移/建立資料庫的基礎字典檔與結構。標準的「資料庫遷移 (Migrate a database)」解答依然會圍繞在原生工具 Data Pump 上。<br/><br/>the DBMS_PDB package：<br/><br/>錯誤原因： DBMS_PDB.DESCRIBE 是用來產生 XML 描述檔，讓 non-CDB 可以直接拔出並插入為 PDB 的套件。但這個套件是 12c 才發明的，11g 的系統裡面根本沒有這個套件，自然無法使用。" }, { "id": "E11-Q19", "exam": 11, "q": 19, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 3, "stem": "<p>Examine this configuration:<br/>\n1. CDB1 is an Oracle container database from an older release.<br/>\n2. PDB1, PDB2, PDB3, and PDB4 are pluggable databases in CDB1.<br/>\nA priority list UpgrdList has these entries:<br/>\n1, pdb2<br/>\n2, pdb1, pdb3<br/>\nYou execute this command:<br/>\n$ /u01/app/oracle/product/18.1.0/db_1/rdbms/admin/dbupgrade -L UpgrdList<br/>\nIn which order will the upgrade occur?<\/p>", "options": ["CDB$ROOT, PDB$SEED, PDB2, PDB1, and PDB3", "CDB$ROOT, PDB$SEED, PDB1, PDB3, PDB2, and PDB4", "CDB$ROOT, PDB2, PDB1, and PDB3", "CDB$ROOT, PDB$SEED, PDB2, PDB1, PDB3, and PDB4", "CDB$ROOT, PDB1, PDB2, PDB3, and PDB4"], "correct": [3], "choose": 1, "explain": "", "origNote": "新題型喔<br/>CDB$ROOT 永遠第一個升級。<br/>PDB$SEED 永遠在第一批 PDB 升級時處理。<br/>Priority 1 的 PDB 接著升級。<br/>Priority 2 的 PDB 在 Priority 1 完成後升級。<br/>沒有列在 Priority List 的 PDB，最後才依預設方式升級。" }, { "id": "E1-Q27", "exam": 1, "q": 27, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 1, "stem": "<p>A user complains about poor database performance.<br/>You want to verify if the user?s session has waited for certain types of I/O activity.<br/>Which view displays all waits waited on by a session at least once?<\/p>", "options": ["V$SESSION_EVENT", "V$SESSTAT", "V$SESSION_WAIT", "V$SESSION_WAIT_CLASS", "V$SESSION"], "correct": [0], "choose": 1, "explain": "", "origNote": "解析： V$SESSION_EVENT 記錄了每個 session 自從連線建立以來，所遭遇過的所有等待事件的累計歷史數據（只要該 session 曾經歷過該等待事件至少一次就會被記錄）。因此，若要檢查某個 session 是否曾經歷過特定的 I/O 等待，查詢這個檢視表是最適合的。" }, { "id": "E1-Q35", "exam": 1, "q": 35, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 1, "stem": "<p>Which three are true about monitoring waits for sessions and services? (Choose three.)<\/p>", "options": ["V$SESSION_EVENT displays all waits for all past and existing sessions if the wait has occurred at least once for a session.", "V$SERVICE_EVENT displays all waits for all services if the wait has occurred at least once for a service.", "V$SESSION_WAIT_CLASS displays waits broken down by wait class only for waiting sessions.", "V$SESSION_WAIT and V$SESSION both contain details of the event on which a non-waiting session last waited.", "V$SESSION_EVENT displays all waits for all past sessions if the wait has occurred at least once for a session.", "V$SESSION_WAIT and V$SESSION both contain details of the event on which a session is currently waiting."], "correct": [1, 2, 5], "choose": 3, "explain": "", "origNote": "all past =&gt;過去的一切<br/>b d f<br/>正確答案解析   <br/>⚠️ 注意： 根據您畫面中的題庫解答，它勾選了 B、C、F。但以 Oracle 官方架構與運作機制來說，C 是錯誤的，D 才是正確的。這類題庫經常會有答案錯誤的情況，以下為您提供正確的技術解析：   <br/><br/>真理標準答案應為：B、D、F   <br/><br/>B. V$SERVICE_EVENT displays all waits for all services if the wait has occurred at least once for a service.（正確）   <br/><br/>解析： V$SERVICE_EVENT 會以「服務（Service）」為單位，追蹤並統計該服務所經歷的等待事件。只要該等待事件在該服務中發生過至少一次，就會被記錄在此視圖中。   <br/><br/>F. V$SESSION_WAIT and V$SESSION both contain details of the event on which a session is currently waiting.（正確）   <br/><br/>解析： 從 Oracle 10g 開始，V$SESSION 視圖整合了等待事件的欄位（如 EVENT、STATE、WAIT_TIME）。當 Session 的狀態為正在等待（STATE = 'WAITING'）時，這兩個視圖都會顯示該 Session 「目前正在等待」的事件詳細資訊。   <br/><br/>D. V$SESSION_WAIT and V$SESSION both contain details of the event on which a non-waiting session last waited.（正確）<br/><br/>解析： 如果一個 Session 目前沒有在等待（例如正在 CPU 執行運算），它的狀態會顯示為已等待（如 WAITED KNOWN TIME 或 WAITED SHORT TIME）。此時，這兩個視圖裡的 EVENT 欄位並不會清空，而是會保留並顯示該 Session 「上一次（last waited）」發生的等待事件。<br/><br/>為什麼其他選項是錯的？<br/>C 錯誤（題庫給錯的答案）：<br/><br/>選項說 V$SESSION_WAIT_CLASS 顯示的等待類別統計「僅限於正在等待的 session (only for waiting sessions)」。<br/><br/>真相： 這是錯的。V$SESSION_WAIT_CLASS 記錄的是 Session 連線以來的累計（Cumulative）等待時間分類。不管該 Session 目前是不是正在等待，它都會顯示歷史累計的數據。<br/><br/>A 與 E 錯誤：<br/><br/>這兩個選項都提到 V$SESSION_EVENT 會顯示「過去的（past）」Session。<br/><br/>真相： V$SESSION_EVENT 只會記錄「目前仍連線中（existing）」的 Session 歷史等待數據。一旦 Session 斷開（Disconnect），該 Session 的資料就會從此視圖中被清除（相關時間會被匯總到系統層級的 V$SYSTEM_EVENT）。" }, { "id": "E1-Q40", "exam": 1, "q": 40, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 1, "stem": "<p>Which three are true about thresholds, metrics, and server-generated alerts? (Choose three.)<\/p>", "options": ["All metrics are instance related.", "Cleared stateful alerts are displayed by querying DBA_ALERT_HISTORY.", "A space usage management alert is automatically cleared after the underlying problem is resolved.", "They are generated by SMON when a tablespace is 97% full.", "Metrics are statistical counts for a specific unit.", "STATISTICS_LEVEL must be set to ALL to generate alerts."], "correct": [1, 2, 4], "choose": 3, "explain": "", "origNote": "B. Cleared stateful alerts are displayed by querying DBA_ALERT_HISTORY.（正確）<br/><br/>解析： 警報分為「具狀態 (Stateful)」和「無狀態 (Stateless)」。當一個具狀態的警報（例如：表空間已滿）被解決並清除 (Cleared) 後，它就會從當前的警告視圖 (DBA_OUTSTANDING_ALERTS) 中移出，並歸檔到歷史記錄視圖 DBA_ALERT_HISTORY 中供日後查詢。<br/><br/>C. A space usage management alert is automatically cleared after the underlying problem is resolved.（正確）<br/><br/>解析： 空間使用率警報（如 Tablespace 使用率達 90%）是一種典型的「具狀態警報 (Stateful Alert)」。當 DBA 增加了資料檔大小或刪除了不需要的資料（解決了根本問題），系統偵測到空間降回安全值以下時，就會自動清除這個警報，不需要 DBA 手動去消除。<br/><br/>E. Metrics are statistical counts for a specific unit.（正確）<br/><br/>解析： 這是 Oracle 官方文件中對於 Metric (度量) 的標準定義。Metric 指的是針對特定單位的統計計數或變化率，例如：「每秒的實體讀取次數 (Physical reads per second)」或「每秒的登入次數」。<br/><br/>為什麼其他選項是錯的？<br/>A 錯誤： 選項說「所有的 metrics 都是與執行個體 (Instance) 相關的」。<br/><br/>真相： Metrics 有很多種層級，除了 Instance 級別，還有 Database 級別、Service (服務) 級別、Session (連線) 級別等，並非全部都只跟 Instance 有關。<br/><br/>D 錯誤： 選項說「當表空間達到 97% 滿時，是由 SMON 背景行程來產生警報」。<br/><br/>真相： 負責收集統計資料、檢查閥值並產生「伺服器警報」的背景行程是 MMON (Manageability Monitor)，而不是 SMON。SMON (System Monitor) 主要是負責執行個體復原 (Instance Recovery) 和清理暫存區段等工作。<br/><br/>F 錯誤： 選項說「必須將 STATISTICS_LEVEL 參數設定為 ALL 才能產生警報」。<br/><br/>真相： 要讓 AWR 收集資料並產生警報，STATISTICS_LEVEL 只需要保持在預設值 TYPICAL 即可。設定為 ALL 會收集極度詳細的作業系統與 SQL 執行計畫資訊，通常只在特殊效能調校時開啟，因為它會對系統效能造成極大負擔。" }, { "id": "E1-Q42", "exam": 1, "q": 42, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 1, "stem": "<p>Automatic Shared Memory Management is disabled for one of your database instances.<br/>Some SQL statements perform poorly due to excessive hard parse activity, thereby degrading performance.<br/>What would be your next step?<\/p>", "options": ["Run the SQL Access Advisor.", "Run the Memory Advisor for the shared pool.", "Run the SQL Tuning Advisor.", "Run the Memory Advisor for the Program Global Area.", "Run the Memory Advisor for the System Global Area."], "correct": [1], "choose": 1, "explain": "", "origNote": "這題的核心線索在於「過多的硬解析 (excessive hard parse activity)」：   <br/><br/>什麼是硬解析 (Hard Parse)？<br/>當使用者發送一條 SQL 語法給資料庫時，Oracle 會先去記憶體裡面找看看有沒有「之前別人跑過、已經解析並產生好執行計畫」的相同語法。如果有，就直接拿來用（這叫軟解析 Soft Parse，速度很快）。如果找不到，Oracle 就必須從頭開始檢查語法、權限並產生執行計畫，這個極度消耗 CPU 資源的過程就是「硬解析」。   <br/><br/>為什麼會發生過多硬解析？<br/>這些已經解析好的 SQL 執行計畫，是存放在 SGA 記憶體中的 Shared Pool（具體來說是裡面的 Library Cache）。如果 Shared Pool 的空間太小，舊的執行計畫就會一直被擠出去、清空。當下次再執行相同的 SQL 時，因為記憶體裡找不到了，就只好再次進行「硬解析」，導致系統效能大幅下降。<br/><br/>為什麼答案是 B？<br/><br/>題目特別提到 Automatic Shared Memory Management (ASMM) is disabled。這代表系統「不會」自動幫你把 Shared Pool 調大來解決問題。<br/><br/>身為 DBA，你需要手動調大 Shared Pool 的大小。在瞎猜數值之前，最好的作法就是執行 Memory Advisor for the shared pool (Shared Pool 建議程式)，讓系統根據目前的負載狀況，建議你應該把 Shared Pool 調到多大最合適。<br/><br/>為什麼其他選項是錯的？<br/>A &amp; C (SQL Access Advisor / SQL Tuning Advisor)： 這些工具是用來優化「單一寫得很差的 SQL 語法」（例如建議你建 Index 或改寫 SQL）。但題目說的問題是「硬解析過多」，這是記憶體空間不足導致的系統層級問題，不是單一 SQL 寫不好的問題。<br/><br/>D (Memory Advisor for the PGA)： PGA (Program Global Area) 是給 Session 專用的記憶體，主要用來做資料排序 (Sort) 或 Hash Join，它不負責存放 SQL 執行計畫。<br/><br/>E (Memory Advisor for the SGA)： 因為 ASMM 已經被停用了，你無法再透過整體的 SGA Advisor 來讓系統自動分配，而是必須針對出問題的子元件（也就是 Shared Pool）進行單獨的評估與調整。" }, { "id": "E2-Q2", "exam": 2, "q": 2, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 1, "stem": "<p>Which three are true about the Oracle Optimizer? (Choose three.)<\/p>", "options": ["It obeys all hints.", "It considers the filters in WHERE clauses when generating execution plans for SQL statements.", "It can re-optimize execution plans after previous executions detect suboptimal plans.", "It considers object statistics when generating execution plans for SQL statements.", "It updates stale object statistics in the Data Dictionary.", "It can only use SQL Plan Directives tied to the SQL statement for which a plan is being generated."], "correct": [1, 2, 3], "choose": 3, "explain": "", "origNote": "obeys -&gt;服從 ,considers -&gt;考慮, suboptimal -&gt;次優" }, { "id": "E3-Q10", "exam": 3, "q": 10, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 2, "stem": "<p>Which statement correctly describes the SQL profiling performed by the SQL Tuning Advisor?<\/p>", "options": ["It is a set of recommendations by the optimizer to create new indexes.", "It is a set of recommendations by the optimizer to restructure a SQL statement to avoid suboptimal execution plans.", "It is auxiliary information collected by the optimizer for a SQL statement to help use better joins orders.", "It is auxiliary information collected by the optimizer for a SQL statement to eliminate estimation error.", "It is a set of recommendations by the optimizer to change the access methods used."], "correct": [3], "choose": 1, "explain": "", "origNote": "SQL profiling  再說 SQL Profile<br/>SQL Profile 的本質是：最佳化程式（Optimizer）為特定的 SQL 敘述所收集的輔助資訊（auxiliary information），主要目的是用來消除預估誤差（eliminate estimation error），幫助系統產出更準確、更有效率的執行計畫。" }, { "id": "E3-Q15", "exam": 3, "q": 15, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 2, "stem": "<p>Which three are true about using Database Resource Manager in an Oracle multitenant environment? (Choose three.)<\/p>", "options": ["A PDB-level resource plan can limit session PGA memory.", "A CDB-level resource plan can limit PDB CPU utilization.", "A CDB-level resource plan can limit session CPU utilization.", "PDB-level resource plans can limit uncommitted UNDO per consumer group.", "A CDB-level resource plan can limit PDB UNDO use.", "A CDB-level resource plan is mandatory when using PDB-level resource plans."], "correct": [0, 1, 3], "choose": 3, "explain": "", "origNote": "A. A PDB-level resource plan can limit session PGA memory. (PDB 層級的資源計畫可以限制 session 的 PGA 記憶體)<br/><br/>解釋： 在 PDB 內部的資源計畫中，DBA 可以針對不同的資源群組（Consumer Groups）設定 SESSION_PGA_LIMIT，藉此防止某個單一連線（Session）消耗過多的 PGA 記憶體而影響其他作業。<br/><br/>B. A CDB-level resource plan can limit PDB CPU utilization. (CDB 層級的資源計畫可以限制 PDB 的 CPU 使用率)<br/><br/>解釋： 這是 CDB 層級資源計畫最主要的功能。DBA 可以透過設定 shares (資源份額) 或 utilization_limit (使用率上限)，來控制每一個 PDB 最多能使用多少整體的 CPU 資源，防止某個 PDB 霸佔系統資源（Noisy Neighbor 問題）。<br/><br/>D. PDB-level resource plans can limit uncommitted UNDO per consumer group. (PDB 層級的資源計畫可以限制每個 consumer group 的未提交 UNDO 空間)<br/><br/>解釋： 在 PDB 內部，您可以透過資源計畫設定 UNDO_POOL，來限制某個特定的使用者群組（Consumer Group）可以產生多少尚未提交的 UNDO 資料，避免大型交易耗盡 UNDO 空間。<br/><br/>錯誤選項為何不正確：<br/>C. A CDB-level resource plan can limit session CPU utilization. (CDB 層級的資源計畫可以限制 session 的 CPU 使用率)<br/><br/>為何錯誤： CDB 層級的計畫是針對「整個 PDB」來進行管理的，它不看底層的單一 Session。如果要限制單一 Session（連線）的 CPU 使用量，必須在 PDB 層級 的資源計畫中設定。<br/><br/>E. A CDB-level resource plan can limit PDB UNDO use. (CDB 層級的資源計畫可以限制 PDB 的 UNDO 使用)<br/><br/>為何錯誤： CDB 層級的資源計畫主要用於管理 CPU 和平行處理伺服器（Parallel Execution Servers）。若要限制 PDB 整體的 UNDO 使用量，通常是透過設定 PDB 層級的儲存參數（如 Local UNDO 模式下的表空間限制），而不是透過 CDB-level 的 Resource Plan 來管控。<br/><br/>F. A CDB-level resource plan is mandatory when using PDB-level resource plans. (使用 PDB 層級的資源計畫時，強制必須有 CDB 層級的資源計畫)<br/><br/>為何錯誤： 雖然實務上通常會兩者搭配使用，但 Oracle 並沒有「強制 (mandatory)」規定一定要先建立自訂的 CDB 計畫才能使用 PDB 計畫。如果沒有特別指定 CDB 計畫，系統預設的資源分配機制仍然允許 PDB 內部啟用自己的資源管理。" }, { "id": "E3-Q21", "exam": 3, "q": 21, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 2, "stem": "<p>Which two are true about memory advisors? (Choose two.)<\/p>", "options": ["If Automatic Shared Memory Management is enabled, both the SGA Advisor and PGA Advisor are always available.", "If Automatic Memory Management is enabled, no memory advisors are available.", "All memory advisors use data from Automatic Workload Repository.", "If Manual Shared Memory Management is enabled, only the Shared Pool Advisor and Buffer Cache Advisor are available.", "If Automatic Memory Management is enabled, the Shared Pool Advisor and Buffer Cache Advisor are available to set the maximum size for these individual System Global Area components."], "correct": [0, 2], "choose": 2, "explain": "", "origNote": "C. All memory advisors use data from Automatic Workload Repository. (所有的記憶體建議工具都使用來自 AWR 的資料)<br/>E. If Automatic Memory Management is enabled, the Shared Pool Advisor and Buffer Cache Advisor are available to set the maximum size for these individual System Global Area components. (...可用於設定這些個別 SGA 組件的「最大」大小)<br/><br/>為何錯誤： 當我們在使用 AMM 或是 ASMM，且同時在特定組件（如 Shared Pool 或 Buffer Cache）手動設定數值時，這個數值代表的是 「最小值 (Minimum size)」（保底記憶體），以防止自動管理將其縮得太小，而不是「最大值 (Maximum size)」。" }, { "id": "E3-Q27", "exam": 3, "q": 27, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 2, "stem": "<p>Which three are true about Automatic Workload Repository (AWR) snapshots? (Choose three.)<\/p>", "options": ["They are generated if STATISTICS_LEVEL is set to TYPICAL.", "They are generated if STATISTICS_LEVEL is set to ALL.", "They are always created automatically.", "They are always created manually.", "They can be retained forever.", "They are generated if STATISTICS_LEVEL is set to BASIC."], "correct": [0, 1, 4], "choose": 3, "explain": "", "origNote": "這題主要考驗 Oracle 資料庫中 Automatic Workload Repository (AWR) 快照的生成條件與保留策略。以下是針對每個選項的詳細專業解析：<br/>正確選項分析：<br/>A. They are generated if STATISTICS_LEVEL is set to TYPICAL. (如果 STATISTICS_LEVEL 設為 TYPICAL，則會產生快照)<br/>解釋： 正確。TYPICAL 是 Oracle 資料庫 STATISTICS_LEVEL 參數的預設值。在這個設定下，AWR 會自動收集資料庫的效能統計資料，並依據排程（預設為每小時一次）自動產生 AWR 快照。<br/>B. They are generated if STATISTICS_LEVEL is set to ALL. (如果 STATISTICS_LEVEL 設為 ALL，則會產生快照)<br/>解釋： 正確。ALL 會收集比 TYPICAL 更多的統計資訊（例如包含作業系統與 SQL 執行計畫的詳細計時資訊）。在此級別下，AWR 同樣會正常運作並自動產生快照。<br/>E. They can be retained forever. (它們可以被永久保留)<br/>解釋： 正確。AWR 快照的保留天數是可以設定的（預設為 8 天）。DBA 可以透過執行 DBMS_WORKLOAD_REPOSITORY.MODIFY_SNAPSHOT_SETTINGS 套件，將 retention 參數設定為 0。當設定為 0 時，就代表快照將會被「永久保留 (retained forever)」，系統不會自動清除過期的快照。<br/><br/>錯誤選項分析：<br/><br/>C. They are always created automatically. (它們「總是」自動建立)<br/>解釋： 錯誤。雖然 AWR 預設會透過後台的 MMON 行程自動建立快照，但它並非「只能」自動建立。DBA 可以隨時透過執行 DBMS_WORKLOAD_REPOSITORY.CREATE_SNAPSHOT() 來「手動」建立當下時間點的快照。此外，如果參數設為 BASIC，自動建立就會停止。<br/><br/>D. They are always created manually. (它們「總是」手動建立)<br/>解釋： 錯誤。如上所述，AWR 快照在標準配置下（TYPICAL 或 ALL）會依照設定的間隔時間自動產生，不需要人工介入。<br/>F. They are generated if STATISTICS_LEVEL is set to BASIC. (如果 STATISTICS_LEVEL 設為 BASIC，則會產生快照)<br/>解釋： 錯誤。當 STATISTICS_LEVEL 被設定為 BASIC 時，會關閉許多效能收集功能，包含 AWR 的統計資料收集。在此設定下，系統不會自動產生 AWR 快照。" }, { "id": "E4-Q43", "exam": 4, "q": 43, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 2, "stem": "<p>A user complains about poor database performance. You want to verify if the user‘s session has waited for certain types of I/O activity. Which view displays all waits waited on by a session at least once?<\/p>", "options": ["V$SESSTAT", "V$SESSION_WAIT", "V$SESSION_WAIT_CLASS", "V$SESSION_EVENT", "V$SESSION"], "correct": [3], "choose": 1, "explain": "", "origNote": "V$SESSION_EVENT：<br/>這個檢視表會列出一個 Session 從建立連線以來，只要發生過至少一次 (at least once) 的所有等待事件 (Wait Events)。它會幫你把該事件的發生次數 (Total Waits) 與累積等待時間 (Time Waited) 加總起來。因此，如果你想知道某個 Session 是不是一直在等特定的 I/O 活動，查這裡最準確。" }, { "id": "E7-Q9", "exam": 7, "q": 9, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 3, "stem": "<p>Which three are true about thresholds, metrics, and server-generated alerts? (Choose three.)<\/p>", "options": ["All metrics are instance related.", "STATISTICS_LEVEL must be set to ALL to generate alerts.", "Metrics are statistical counts for a specific unit.", "Cleared stateful alerts are displayed by querying DBA_ALERT_HISTORY.", "A space usage management alert is automatically cleared after the underlying problem is resolved.", "They are generated by SMON when a tablespace is 97% full."], "correct": [2, 3, 4], "choose": 3, "explain": "", "origNote": "DBA_ALERT_HISTORY 有狀態與無狀態都會記錄" }, { "id": "E7-Q27", "exam": 7, "q": 27, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 3, "stem": "<p>Which three are true about monitoring waits for sessions and services? (Choose three.)<\/p>", "options": ["V$SESSION_EVENT displays all waits for all past and existing sessions if the wait has occurred at least once for a session.", "V$SERVICE_EVENT displays all waits for all services if the wait has occurred at least once for a service.", "V$SESSION_WAIT and V$SESSION both contain details of the event on which a non-waiting session last waited.", "V$SESSION_WAIT_CLASS displays waits broken down by wait class only for waiting sessions.", "V$SESSION_WAIT and V$SESSION both contain details of the event on which a session is currently waiting.", "V$SESSION_EVENT displays all waits for all past sessions if the wait has occurred at least once for a session."], "correct": [1, 3, 4], "choose": 3, "explain": "", "origNote": "注意一下版本題型，實作一下" }, { "id": "E7-Q30", "exam": 7, "q": 30, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 3, "stem": "<p>Which two are true about server-generated alerts? (Choose two.)<\/p>", "options": ["Stateless alerts can be purged manually from the alert history.", "Stateless alerts are automatically cleared.", "Stateful alerts must be cleared by a DBA after resolving the problem.", "Stateless alerts can be cleared manually.", "Stateful alerts are purged automatically from the alert history."], "correct": [0, 3], "choose": 2, "explain": "", "origNote": "注意，要再釐清<br/>1. 有狀態警示 (Stateful Alerts) 範例：表空間客滿 (Tablespace Full)<br/><br/>情境： 假設您的 USERS 表空間使用率達到了 90% 的警告門檻 (Warning Threshold)。<br/><br/>特性 (有狀態)： 這個「超過 90%」是一個持續存在的狀態。只要空間沒清出來，這個狀態就會一直卡在那裡。此時，警示會一直停留在 DBA_OUTSTANDING_ALERTS (未解決警示) 視圖中。<br/>清除方式： 當您身為 DBA 介入處理，例如幫表空間增加了一個新的資料檔 (Add Datafile)，讓使用率降回 70%。此時根本問題解決了，Oracle 的背景監控程序 (MMON) 會偵測到狀態改變，並自動清除 (Automatically cleared) 這個警示，將其移至 DBA_ALERT_HISTORY 歷史紀錄中。<br/><br/>2. 無狀態警示 (Stateless Alerts) 範例：發生 ORA-01555 (Snapshot too old) 或死結 (Deadlock)<br/><br/>情境： 假設某個使用者的長查詢執行到一半，突然因為 Undo 空間被覆寫而引發了 ORA-01555 錯誤，或者兩個會話互相卡死發生了 ORA-00060 死結。<br/><br/>特性 (無狀態)： 這個錯誤是一個瞬間發生的事件。錯誤彈出的那一刻，事件就結束了。資料庫並不是「持續處於 ORA-01555 的狀態」。<br/>清除方式： 因為沒有一個「持續中的狀態」可以讓系統判斷「問題何時結束」，所以 Oracle 不會自動清除這類警示。它發生當下就會直接寫入 DBA_ALERT_HISTORY。如果您希望這個警示紀錄消失，DBA 必須手動清除 (Cleared/Purged manually)。" }, { "id": "E8-Q18", "exam": 8, "q": 18, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 3, "stem": "<p>Which parameters can be set at pluggable database level? (Choose three.)<\/p>", "options": ["PGA_AGGREGATE_TARGET", "SGA_TARGET", "PGA_AGGREGATE_LIMIT", "SGA_MAX_SIZE"], "correct": [0, 1, 2], "choose": 3, "explain": "", "origNote": "SGA_MAX_SIZE (您誤選的選項)<br/>錯誤原因： 這是 CDB (Instance) 專屬的參數！SGA_MAX_SIZE 定義的是整個 Oracle 實例 (Instance) 在作業系統層級能要到的實體記憶體絕對上限，這牽涉到整個作業系統的 SGA 配置，所以絕對不能在局部的 PDB 裡面去修改它。在 PDB 裡面要限制 SGA 上限，用的參數是 SGA_TARGET。" }, { "id": "E8-Q22", "exam": 8, "q": 22, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 4, "stem": "<p>Which statements are true about SGA_MIN_SIZE? (Choose three.)<\/p>", "options": ["In a PDB, range of values for this parameter is 0 to 100% of SGA_MAX_SIZE at the CDB.", "It can be set via ALTER DATABASE command.", "It indicates a possible minimum value for SGA usage of all pluggable databases (PDBs) in a CDB.", "It is modifiable in a CDB.", "It is modifiable in a PDB.", "Setting this parameter at the CDB level has no effect."], "correct": [0, 4, 5], "choose": 3, "explain": "", "origNote": "這題考驗的是 DBA 對 Oracle 多租戶架構中 PDB 記憶體資源隔離與保障 (Resource Management) 參數的理解。SGA_MIN_SIZE 是用來確保某個關鍵的 PDB 永遠能獲得最基本的 SGA 記憶體配額。<br/><br/>正確選項分析：<br/><br/>PDB 專屬參數 (Modifiable in a PDB / No effect at CDB level)： 這個參數的設計初衷就是為了解決「多租戶間的資源競爭」。因此，您必須登入到特定的 PDB 內部去修改它，以此宣告「這個 PDB 最少需要多少記憶體」。如果您在最上層的 CDB$ROOT 設定它，Oracle 根本不知道您想保障的是哪一個 PDB，因此該設定會被直接忽略 (has no effect)。<br/><br/>數值範圍限制 (0 to 100%)： 當您在特定的 PDB 內設定 SGA_MIN_SIZE 時，它的語法容許範圍是 0 到整個容器資料庫 (CDB) SGA_MAX_SIZE 的 100%。(備註：雖然語法上允許設到 100%，但在實務運作上，所有 PDB 的 SGA_MIN_SIZE 總和不能超過 CDB 總 SGA 的 50%，否則會報錯，但單一參數的設定範圍確實是 0~100%)。<br/><br/>您誤選的陷阱分析：<br/><br/>It is modifiable in a CDB. (您誤選的選項)<br/><br/>錯誤原因： 這裡的 \"in a CDB\" 指的是在 CDB$ROOT 整個容器資料庫層級。雖然您可能可以用 ALTER SYSTEM 語法去下這個指令，但就如另一個正確選項所述，這樣做「毫無作用 (no effect)」。在 Oracle 認證考試的邏輯中，既然設定了沒用，就不會將其視為「可以在 CDB 中修改 (modifiable in a CDB)」的有效特性。<br/><br/>其他錯誤選項原因：<br/>It can be set via ALTER DATABASE command.<br/>錯誤原因： 記憶體配置參數（如 SGA 相關參數）必須使用 ALTER SYSTEM 指令來修改，而不是用 ALTER DATABASE。" }, { "id": "E9-Q46", "exam": 9, "q": 46, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 4, "stem": "<p>Which two are true about server-generated alerts? (Choose two.)<\/p>", "options": ["Stateless alerts can be cleared manually.", "Stateless alerts can be purged manually from the alert history.", "Stateful alerts must be created by a DBA after resolving the problem.", "Stateless alerts are automatically cleared.", "Stateful alerts are purged automatically from the alert history."], "correct": [0, 1], "choose": 2, "explain": "", "origNote": "Stateless  Stateful 搞清楚" }, { "id": "E10-Q8", "exam": 10, "q": 8, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 4, "stem": "<p>Which three are true about monitoring waits for sessions and services? (Choose three.)<\/p>", "options": ["V$SESSION_WAIT and V$SESSION both contain details of the event on which a session is currently waiting.", "V$SESSION_EVENT displays all waits for all past and existing sessions if the wait has occurred at least once for a session.", "V$SESSION_EVENT displays all waits for all past sessions if the wait has occurred at least once for a session.", "V$SERVICE_EVENT displays all waits for all services if the wait has occurred at least once for a service.", "V$SESSION_WAIT_CLASS displays waits broken down by wait class only for waiting sessions.", "V$SESSION_WAIT and V$SESSION both contain details of the event on which a non-waiting session last waited."], "correct": [0, 3, 4], "choose": 3, "explain": "", "origNote": "注意考題" }, { "id": "E10-Q29", "exam": 10, "q": 29, "topic": "06_Performance", "topicTitle": "效能監控與調校", "part": 4, "stem": "<p>A user complains about poor database performance.<br/>You want to verify if the user‘s session has waited for certain types of I/O activity.<br/>Which view displays all waits waited on by a session at least once?<\/p>", "options": ["V$SESSION_EVENT", "V$SESSION_WAIT", "V$SESSTAT", "V$SESSION_WAIT_CLASS", "V$SESSION"], "correct": [0], "choose": 1, "explain": "", "origNote": "注意題型" }, { "id": "E2-Q41", "exam": 2, "q": 41, "topic": "07_Security_Audit", "topicTitle": "安全性、權限與稽核", "part": 1, "stem": "<p>Which three are true in Oracle 19c and later releases? (Choose three.)<\/p>", "options": ["If the password file location changes, then the new location is used automatically by the Oracle Server.", "Schema Only accounts can be granted administrator privileges.", "All the Oracle-supplied accounts are Schema Only accounts.", "Privilege Analysis is included in Oracle Enterprise Edition and no longer requires Database Vault.", "Unified Auditing can be configured to audit only events that are issued indirectly by an audited user.", "Unified Auditing can be configured to audit only events that are issued directly by an audited user."], "correct": [1, 3, 5], "choose": 3, "explain": "", "origNote": "F. Unified Auditing can be configured to audit only events that are issued directly by an audited user. (統一稽核可設定為僅稽核由受稽核使用者「直接」發出的事件)<br/>在 Oracle 統一稽核 (Unified Auditing) 中，建立稽核策略時可以使用 ONLY TOPLEVEL 條件。這代表資料庫只會記錄使用者直接下達的 SQL 敘述（Top-level statements），而忽略由 PL/SQL 預存程序或觸發器 (Triggers) 在內部自動執行的遞迴 SQL (Recursive SQL)。這項設定能大幅減少稽核日誌的雜訊，讓稽核紀錄更精簡且容易判讀。" }, { "id": "E3-Q25", "exam": 3, "q": 25, "topic": "07_Security_Audit", "topicTitle": "安全性、權限與稽核", "part": 1, "stem": "<p>Which three are true about actions that can or cannot be performed by users with the SYSBACKUP privilege? (Choose three.)<\/p>", "options": ["They can view data from any data dictionary view or dynamic performance view.", "They cannot create restore points.", "They cannot drop tablespaces.", "They can create any table.", "They can drop any tablespace.", "They can view data from any user-defined tables."], "correct": [0, 3, 4], "choose": 3, "explain": "", "origNote": "Backup<br/>Recovery<br/>RMAN<br/>CREATE RESTORE POINT<br/>DROP RESTORE POINT<br/>CREATE ANY TABLE<br/>DROP TABLESPACE<br/>SELECT ANY DICTIONARY<br/>查詢 V$ / GV$ / X$" }, { "id": "E4-Q45", "exam": 4, "q": 45, "topic": "07_Security_Audit", "topicTitle": "安全性、權限與稽核", "part": 1, "stem": "<p>Which three are true about Audit policies In container databases (CDBs)?<\/p>", "options": ["A common unified audit policy can be created at the CDB level.", "A common unified audit policy can be created at the application root level.", "Fine-grained auditing policies defined in an application root must be manually synchronized by each application PDB contained in the application root.", "Application-common unified audit policies defined In an application root must be manually synchronized by each application PDB contained in the application root.", "An application PDB cannot have a local audit policy.", "All audit records are written to the audit trail in CDB$ROOT"], "correct": [0, 1, 2], "choose": 3, "explain": "", "origNote": "Fine-grained auditing policies defined in an application root must be manually synchronized by each application PDB contained in the application root. (在 Application Root 中定義的細粒度稽核 FGA 原則，必須由其底下的每個 Application PDB 手動進行同步)" }, { "id": "E8-Q38", "exam": 8, "q": 38, "topic": "07_Security_Audit", "topicTitle": "安全性、權限與稽核", "part": 1, "stem": "<p>Which three are true about Audit policies in container databases (CDBs)?<\/p>", "options": ["Application-common unified audit policies defined in an application root must be manually synchronized by each application PDB contained in the application root.", "An application PDB cannot have a local audit policy.", "A common unified audit policy can be created at the CDB level.", "A common unified audit policy can be created at the application root level.", "All audit records are written to the audit trail in CDB$ROOT", "Fine-grained auditing policies defined in an application root must be manually synchronized by each application PDB contained in the application root."], "correct": [2, 3, 5], "choose": 3, "explain": "", "origNote": "新題型" }, { "id": "E1-Q2", "exam": 1, "q": 2, "topic": "08_Recovery", "topicTitle": "還原與復原 (Restore / Recovery)", "part": 1, "stem": "<p>A database is configured in ARCHIVELOG mode.<br/>Full RMAN backups are taken daily and no backup to trace has been taken of the control file.<br/>A media failure has occurred.<br/>In which two scenarios is complete recovery possible? (Choose two.)<\/p>", "options": ["when any archived log from, before, or after the most recent backup is corrupt.", "after losing all copies of the control file", "after losing an archived log from after the most recent backup", "after losing an archived log from before the most recent backup", "after losing the SYSTEM tablespace"], "correct": [3, 4], "choose": 2, "explain": "", "origNote": "" }, { "id": "E2-Q4", "exam": 2, "q": 4, "topic": "08_Recovery", "topicTitle": "還原與復原 (Restore / Recovery)", "part": 1, "stem": "<p>Which three true about recovering tables using RMAN? (Choose three.)<\/p>", "options": ["RMAN can recover tables in the SYSAUX tablespace.", "RMAN can recover tables owned by the SYS user.", "RMAN can recover tables in the SYSTEM tablespace.", "RMAN always uses an auxiliary instance.", "RMAN can recover a table after a DDL operation has altered the table structure.", "RMAN can recover tables owed by the SYSTEM user."], "correct": [3, 4, 5], "choose": 3, "explain": "", "origNote": "Oracle 從 12c 開始引入了 RECOVER TABLE 功能，允許透過 RMAN 將特定的資料表或分區恢復到過去的某個時間點（Table Point-In-Time Recovery）。<br/><br/>正確選項解析：<br/><br/>D. RMAN always uses an auxiliary instance (RMAN 總是使用一個輔助執行個體)<br/>正確。 當您執行 RECOVER TABLE 指令時，RMAN 會在背景自動建立並啟動一個臨時的輔助執行個體 (Auxiliary Instance)。它會將 SYSTEM、SYSAUX、UNDO 以及包含目標資料表的資料表空間還原到這個輔助資料庫中，將其復原到您指定的時間點，接著使用 Data Pump (EXPDP/IMPDP) 將該資料表匯出並匯入回主資料庫，最後自動清理輔助執行個體。<br/><br/>E. RMAN can recover a table after a DDL operation has altered the table structure (RMAN 可以在 DDL 操作改變了資料表結構後，恢復該資料表)<br/>正確。 RMAN 支援在備份完成後至目標恢復時間點之間，資料表曾經歷過 DDL 結構變更（例如 DROP、TRUNCATE 或新增/刪除欄位）的恢復作業。<br/><br/>F. RMAN can recover tables owed by the SYSTEM user (RMAN 可以恢復由 SYSTEM 使用者擁有的資料表)<br/>正確。 只要資料表不是存放在受限的系統表空間中，RMAN 可以恢復 SYSTEM 使用者所擁有的資料表。<br/><br/>錯誤選項解析（RMAN 資料表恢復的限制）：<br/><br/>A 與 C. (RMAN 可以恢復在 SYSAUX / SYSTEM 資料表空間中的資料表)<br/>錯誤。 這是 RMAN RECOVER TABLE 的官方限制：無法恢復存放在 SYSTEM 或 SYSAUX 這兩個系統資料表空間內的任何資料表。<br/><br/>B. (RMAN 可以恢復由 SYS 使用者擁有的資料表)<br/>錯誤。 RMAN 的限制中明確指出，無法恢復屬於 SYS 結構描述 (Schema) 的任何資料表或資料表分區。" }, { "id": "E2-Q32", "exam": 2, "q": 32, "topic": "08_Recovery", "topicTitle": "還原與復原 (Restore / Recovery)", "part": 1, "stem": "<p>Which two are true about instance recovery? (Choose two.)<\/p>", "options": ["It is not possible if an archived log is missing.", "It is performed automatically after the database is opened; however, blocks requiring recovery are not available until they are recovered.", "Setting FAST_START_MTTR_TARGET to a lower value reduces instance recovery time by causing dirty buffers to be written to disk more frequently, thereby reducing the number of I/Os needed during instance recovery.", "It is performed by the Recovery Writer (RVWR) background process.", "Setting FAST_START_MTTR_TARGET to a higher value reduces instance recovery time by causing the log writer to write more frequently, thereby reducing the number of I/Os needed during instance recovery.", "It is performed automatically while the database remains in MOUNT state. Then the database is opened."], "correct": [2, 5], "choose": 2, "explain": "", "origNote": "C. Setting FAST_START_MTTR_TARGET to a lower value reduces instance recovery time by causing dirty buffers to be written to disk more frequently, thereby reducing the number of I/Os needed during instance recovery.<br/><br/>解析： FAST_START_MTTR_TARGET 參數用來設定「預期的例項復原時間（以秒為單位）」。如果您將這個值設定得較低（例如希望在 30 秒內復原完畢），Oracle 為了達成這個目標，會頻繁地觸發資料庫寫入器（DBWn）將記憶體中的「髒區塊（Dirty buffers）」寫入磁碟。這樣做可以推進檢查點（Checkpoint），減少當機時需要重做（Redo）的資料量，進而減少例項復原時所需的 I/O 次數並縮短時間。   <br/><br/>F. It is performed automatically while the database remains in MOUNT state. Then the database is opened.   <br/><br/>解析： 當資料庫發生非正常關閉（如斷電或 SHUTDOWN ABORT），下次啟動（STARTUP）時，Oracle 會自動偵測並執行例項復原。這個過程發生在資料庫處於 MOUNT 狀態時（此時控制檔已掛載，Oracle 會比對控制檔與資料檔的 SCN 來決定是否需要復原）。必須先在 MOUNT 狀態下完成「向前推進（Roll forward / Cache Recovery）」後，資料庫才會被 OPEN，允許使用者連線。<br/><br/>❌ 錯誤選項陷阱<br/>A. It is not possible if an archived log is missing.<br/><br/>錯誤原因： 例項復原（Instance Recovery）只需要線上重做日誌（Online Redo Logs），不需要歸檔日誌（Archived Logs）。只有「媒體復原（Media Recovery）」（例如資料檔損毀）才需要歸檔日誌。<br/><br/>B. It is performed automatically after the database is opened...<br/><br/>錯誤原因： 例項復原的核心階段（Roll forward）必須在資料庫 OPEN 之前（也就是在 MOUNT 狀態下）完成。雖然未提交交易的「退回（Rollback）」可以在資料庫 OPEN 後於背景執行，但選項說整個例項復原是在開啟後執行是錯誤的。<br/><br/>D. It is performed by the Recovery Writer (RVWR) background process.<br/><br/>錯誤原因： RVWR（Recovery Writer）程序是專門用來處理 閃回資料庫（Flashback Database） 功能的，負責寫入閃回日誌。負責協調與執行例項復原的背景程序是 SMON（System Monitor）。<br/><br/>E. Setting FAST_START_MTTR_TARGET to a higher value reduces instance recovery time...<br/><br/>錯誤原因： 邏輯完全相反。設定較高的值代表容許更長的復原時間，這會減少日常運作時 DBWn 寫入磁碟的頻率，從而增加例項復原的時間與 I/O。" }, { "id": "E2-Q34", "exam": 2, "q": 34, "topic": "08_Recovery", "topicTitle": "還原與復原 (Restore / Recovery)", "part": 1, "stem": "<p>Which two are true about Oracle instance recovery? (Choose two.)<\/p>", "options": ["Recovery begins from the beginning of the CURRENT redo log group.", "Recovery begins from the last checkpoint position that was calculated by the Database Writer before instance failure.", "Recovery begins from the start of any ACTIVE redo log group or the start of the CURRENT log group if no other group is ACTIVE.", "Recovery reads redo until the end of the redo thread. SMON rolls back any dead transactions, and then the database is opened.", "Recovery begins from the last checkpoint position that was recorded in the control file by the checkpoint process (CKPT).", "Recovery reads redo until the end of the redo thread, and then opens the database. SMON then rolls back any dead transactions."], "correct": [4, 5], "choose": 2, "explain": "", "origNote": "E. Recovery begins from the last checkpoint position that was recorded in the control file by the checkpoint process (CKPT).<br/><br/>解析： 例項復原（通常發生在資料庫異常關閉，如斷電或 SHUTDOWN ABORT 後重新啟動時）的第一步是「向前推進（Roll Forward）」。Oracle 必須知道要從重做日誌（Redo Log）的哪個地方開始讀取。這個起點就是「最後一次檢查點（Checkpoint）的位置」。而這個位置是由 CKPT（Checkpoint Process）負責記錄在控制檔（Control File）中的。從這個點開始，所有尚未寫入資料檔的變更都會被重新套用。<br/><br/>F. Recovery reads redo until the end of the redo thread, and then opens the database. SMON then rolls back any dead transactions.<br/><br/>解析： 這是 Oracle 例項復原的標準兩階段標準流程，也是極重要的核心觀念：<br/><br/>Cache Recovery (Roll Forward / 向前推進)： 讀取 Redo Log 直到結尾，把所有資料（包含已提交和未提交的交易）都套用到資料檔中。<br/><br/>Database Open (開啟資料庫)： 當 Roll Forward 完成後，資料庫就會被 OPEN，此時使用者已經可以連線並開始工作。<br/><br/>Transaction Recovery (Rollback / 退回)： 資料庫開啟後，背景程序 SMON 會去尋找那些在當機前尚未提交（Uncommitted / Dead transactions）的交易，並利用 Undo 資訊將它們退回（Rollback）。<br/><br/>❌ 錯誤選項陷阱<br/>A. Recovery begins from the beginning of the CURRENT redo log group.<br/>C. Recovery begins from the start of any ACTIVE redo log group...<br/><br/>錯誤原因： 例項復原的起點是非常精確的「最後一次檢查點位置（Checkpoint Position）」，它可能落在 CURRENT 或 ACTIVE 日誌群組的任何一個位置，而不會死板地從整個日誌群組的「最開頭（beginning/start）」開始讀取。<br/><br/>B. Recovery begins from the last checkpoint position that was calculated by the Database Writer before instance failure.<br/><br/>錯誤原因： 雖然 DBWn（Database Writer）負責將髒區塊寫入磁碟來推進檢查點，但是「記錄」這個檢查點位置到控制檔和資料檔標頭的程序是 CKPT，而不是 DBWn。（選項 E 才是正確的描述）。<br/><br/>D. Recovery reads redo until the end of the redo thread. SMON rolls back any dead transactions, and then the database is opened.<br/><br/>錯誤原因： 順序錯誤！這個選項說「SMON 退回所有死交易後，資料庫『才』開啟」。在 Oracle 的機制中，為了提高可用性（減少停機時間），資料庫會在 Roll Forward 結束後就先開啟（Open），然後才在背景進行退回（Rollback）。（選項 F 的順序才是對的）。" }, { "id": "E2-Q37", "exam": 2, "q": 37, "topic": "08_Recovery", "topicTitle": "還原與復原 (Restore / Recovery)", "part": 1, "stem": "<p>Which two are true about automatic block repair? (Choose two.)<\/p>", "options": ["Automatic block repair can repair blocks with no standby database if DB_BLOCK_CHECKING = TRUE.", "Real-Time Query must be enabled on a physical standby database for automatic block repair to be done on that physical standby database.", "Real-Time Query must be enabled on a primary database for automatic block repair to be done on any of its physical standby databases.", "It is not possible for media corrupt blocks.", "Real-Time Query must be enabled on a physical standby database for automatic block repair to be done on its primary database."], "correct": [1, 4], "choose": 2, "explain": "", "origNote": "當資料庫在讀取資料時，如果遇到實體損壞的資料區塊（Corrupt Block，通常會報 ORA-01578 錯誤），Oracle 可以「自動且透明地」透過網路向另一端的資料庫（Primary 或 Standby）索取該區塊的良好複本，並在記憶體與磁碟中進行替換修復，應用程式甚至不會察覺到發生過錯誤。<br/>這個功能的前提是：備用資料庫（Physical Standby）必須啟用 Real-Time Query（即 Active Data Guard 狀態，以唯讀模式開啟並同時套用 Redo）。<br/><br/>✅ 正確選項解析<br/>B. Real-Time Query must be enabled on a physical standby database for automatic block repair to be done on that physical standby database.<br/><br/>解析： 當「備用資料庫（Standby）」遇到損壞的區塊時，它可以自動向主資料庫（Primary）請求一個好的區塊來修復自己。但前提是，這個備用資料庫必須處於 Real-Time Query（Active Data Guard） 狀態下，這個機制才會生效。<br/><br/>E. Real-Time Query must be enabled on a physical standby database for automatic block repair to be done on its primary database.<br/><br/>解析： 反過來說，當「主資料庫（Primary）」遇到損壞的區塊時，它會自動連線到備用資料庫（Standby）去抓取良好的區塊來修復自己。同樣地，作為提供良好區塊來源的備用資料庫，必須啟用了 Real-Time Query 才具備提供此服務的能力。<br/><br/>❌ 錯誤選項陷阱<br/>A. Automatic block repair can repair blocks with no standby database if DB_BLOCK_CHECKING = TRUE.<br/><br/>錯誤原因： 自動區塊修復必須有一個「好的區塊來源」來替換壞區塊。如果沒有 Standby 資料庫，它就沒有地方去抓取備份區塊。DB_BLOCK_CHECKING 只是用來「提早偵測」區塊是否損壞，本身無法無中生有把壞區塊修好。<br/><br/>C. Real-Time Query must be enabled on a primary database for automatic block repair to be done on any of its physical standby databases.<br/><br/>錯誤原因： Real-Time Query 是一個專屬於「備用資料庫（Standby）」的狀態（以唯讀模式開啟並持續套用日誌），主資料庫（Primary）本來就是 Read/Write 正常開啟的，沒有所謂「在 Primary 啟用 Real-Time Query」這種說法。<br/><br/>D. It is not possible for media corrupt blocks.<br/><br/>錯誤原因： 剛好相反。自動區塊修復正是專門設計用來解決「媒體損毀區塊（Media corrupt blocks，即實體磁碟層面的區塊損壞）」的完美解決方案。" }, { "id": "E3-Q4", "exam": 3, "q": 4, "topic": "08_Recovery", "topicTitle": "還原與復原 (Restore / Recovery)", "part": 2, "stem": "<p>Examine this configuration:<br/>\n1. CDB1 is a container database running in ARCHIVELOG mode.<br/>\n2. Multiple uncommitted transactions are running in CDB1.<br/>\n3. Redo log groups 1 and 2 are INACTIVE.<br/>\n4. Redo log group 3 is the CURRENT group.<br/>\nAll members of redo log group 3 are lost before it is archived.<br/>\nExamine these possible steps:<br/>\n1. SHUTDOWN ABORT<br/>\n2. STARTUP NOMOUNT<br/>\n3. STARTUP MOUNT<br/>\n4. ALTER DATABASE MOUNT<br/>\n5. RESTORE DATABSE<br/>\n6. RECOVER DATABASE NOREDO<br/>\n7. RECOVER DATABASE UNTIL AVAILABLE<br/>\n8. RESTORE ARCHIVELOG ALL<br/>\n9. ALTER DATABSE OPEN<br/>\n10.ALTER DATABASE OPEB RESETLOGS<br/>\nChoose the minimum required steps in the correct order to recover the database.<\/p>", "options": ["1, 3, 5, 8, 6, 10", "1, 3, 5, 6, 10", "1, 3, 5, 7, 10", "1, 2, 5, 7, 4, 10", "1, 3, 5, 6, 9"], "correct": [2], "choose": 1, "explain": "", "origNote": "RECOVER DATABASE NOREDO（復原但不套用任何重做日誌）- 這是錯誤作法<br/><br/>作用： 這個指令強制 Oracle 「不要套用任何 Redo Logs」。它通常只會去套用增量備份（Incremental Backups），然後就直接結束復原程序。<br/><br/>結果： 如果你用了這個指令，你放在備份與當前時間之間、那些明明還完好無缺的 Archived Redo Logs 都會被忽略。這會導致你流失大量的資料（從最後一次備份以來的所有的異動都會不見）。<br/><br/>總結來說：<br/>在遺失 CURRENT 日誌的情況下，你應該選擇 7 (UNTIL AVAILABLE) 來盡可能榨乾剩下的日誌以救回最多資料，而不是選擇 6 (NOREDO) 直接放棄套用所有日誌。" }, { "id": "E3-Q7", "exam": 3, "q": 7, "topic": "08_Recovery", "topicTitle": "還原與復原 (Restore / Recovery)", "part": 2, "stem": "<p>Which three are true about block media recovery? (Choose three.)<\/p>", "options": ["The data file containing the block being recovered remains online.", "To use it, Flashback Database must be enabled.", "A block being recovered is not accessible.", "It can be performed on noncorrupt blocks.", "The target database for which one or more blocks are to be recovered must be in the OPEN state.", "It cannot repair logical corruption."], "correct": [0, 2, 4], "choose": 3, "explain": "", "origNote": "E. The target database for which one or more blocks are to be recovered must be in the OPEN state. (要復原一個或多個區塊的目標資料庫必須處於 OPEN 狀態)<br/>解釋： BMR 的設計初衷就是在「不影響線上服務」的情況下進行修復。因此，它最主要且標準的應用情境，就是當資料庫處於 OPEN 狀態、資料檔在線（Online）時，由背景即時進行損壞區塊的復原。<br/>D. It can be performed on noncorrupt blocks. (它可以在未損壞的區塊上執行)<br/>為何錯誤： RMAN 的 RECOVER BLOCK 指令是設計用來修復「已標記為損壞」的區塊（通常紀錄在 V$DATABASE_BLOCK_CORRUPTION 視圖中）。你不能對一個正常、沒有損壞的區塊執行區塊復原。" }, { "id": "E3-Q16", "exam": 3, "q": 16, "topic": "08_Recovery", "topicTitle": "還原與復原 (Restore / Recovery)", "part": 2, "stem": "<p>Which three are true about recovery operations done without using Recovery Manager (RMAN)? (Choose three.)<\/p>", "options": ["A lost SPFILE can be recovered from memory using SQL*PLUS.", "A lost password file can be re-created with SQL*PLUS.", "A lost TEMPFILE must always be re-created manually.", "A lost password file can be manually re-created with the orapwd utility.", "A lost PFILE can be re-created alert.log using SQL*PLUS.", "A lost index tablespace can be re-created without performing any recovery."], "correct": [0, 3, 5], "choose": 3, "explain": "", "origNote": "A lost TEMPFILE must always be re-created manually==&gt;contaol file有就會自動建立<br/><br/>遺失索引表空間雖然不會讓 DB 死機，但會讓依賴該索引的資料寫入功能癱瘓，並且讓部分查詢報錯。<br/>這也是為什麼第 16 題選項 F 提到，遇到這種情況 DBA 的標準救援動作非常果斷：不用慢慢做 Recovery，直接把損壞的表空間 Offline 或 Drop 掉，把有問題的 Index 刪除，然後立刻重建（Re-create/Rebuild），讓應用程式的讀寫能最快恢復正常！" }, { "id": "E8-Q17", "exam": 8, "q": 17, "topic": "08_Recovery", "topicTitle": "還原與復原 (Restore / Recovery)", "part": 2, "stem": "<p>Which three are true about recovering tables using RMAN? (Choose three.)<\/p>", "options": ["RMAN can recover a table after a DDL operation has altered the table structure.", "RMAN can recover tables in the SYSTEM tablespace.", "RMAN always uses an auxiliary instance.", "RMAN can recover tables owned by the SYS user.", "RMAN can recover tables in a standby database.", "RMAN can recover tables owed by the SYSTEM user."], "correct": [0, 2, 5], "choose": 3, "explain": "", "origNote": "SYS 帳號（絕對禁區）：SYS 是資料庫最核心的帳號，擁有最底層的資料字典基表（Data Dictionary Base Tables）。為了防止核心系統崩潰，Data Pump 引擎寫死了絕對禁止匯出或匯入任何由 SYS 擁有的物件。因此，RMAN 絕對無法單獨復原 SYS 的表格。<br/><br/>SYSTEM 帳號（技術上允許）：SYSTEM 雖然也是極高權限的系統管理帳號，用來存放次要的系統工具或管理資料，但它並不受限於 Data Pump 的硬性阻擋。因此，從純粹的「技術能力」來看，RMAN 確實有能力透過 Data Pump 將 SYSTEM 擁有的表格匯出並復原。這就是為什麼考題答案中 \"RMAN can recover tables owed by the SYSTEM user.\" 是正確的" }, { "id": "E9-Q45", "exam": 9, "q": 45, "topic": "08_Recovery", "topicTitle": "還原與復原 (Restore / Recovery)", "part": 2, "stem": "<p>Which three true about recovering tables using RMAN? (Choose three.)<\/p>", "options": ["RMAN can recover tables owed by the SYSTEM user.", "RMAN can recover tables owned by the SYS user.", "RMAN can recover tables in the SYSTEM tablespace.", "RMAN always uses an auxiliary instance.", "RMAN can recover a table after a DDL operation has altered the table structure.", "RMAN can recover tables in the SYSAUX tablespace."], "correct": [0, 3, 4], "choose": 3, "explain": "", "origNote": "SYS絕不能動" }, { "id": "E1-Q25", "exam": 1, "q": 25, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 1, "stem": "<p>While backing up to the Oracle Fast Recovery Area (FRA), you determined the backup is taking too long and suspect a performance bottleneck. Which three are true about diagnosing and tuning these problems? (Choose three.)<\/p>", "options": ["If an RMAN BACKUP VALIDATE command takes roughly the same time as an actual backup, then both read and write I/O are likely bottlenecks.", "Setting DBWR_IO_SLAVES to a non zero value can improve backup performance when using synchronous I/O.", "If an RMAN BACKUP VALIDATE command takes noticeably less than an actual backup, then write I/O is a likely bottleneck.", "If an RMAN BACKUP VALIDATE command takes roughly the same time as an actual backup, then read I/O is a likely bottleneck.", "Data files with a high value in V$BACKUP_SYNC_IO.DISCRETE_BYTES_PER_SECOND are a potential performance bottleneck when synchronous I/O is used.", "Setting DBWR_IO_SLAVES to a non zero value can improve backup performance when using asynchronous I/O/"], "correct": [0, 2, 4], "choose": 3, "explain": "", "origNote": "" }, { "id": "E1-Q28", "exam": 1, "q": 28, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 1, "stem": "<p>While backing up to an SBT channel, you determine that the read phase of your compressed Recovery Manager (RMAN) incremental level 0 backup is a bottleneck.<br/>FORCE LOGGING is enabled for the database.<br/>Which two could improve read performance? (Choose two.)<\/p>", "options": ["Increase the size of tape I/O buffers.", "Disable FORCE LOGGING for the database.", "Increase the size of the database buffer cache.", "Enable asynchronous disk I/O.", "Increase the level of RMAN multiplexing."], "correct": [3, 4], "choose": 2, "explain": "", "origNote": "D. Enable asynchronous disk I/O.（正確）<br/><br/>解析： 當 RMAN 從磁碟（或 ASM）讀取資料檔案時，如果能啟用非同步磁碟 I/O (Asynchronous Disk I/O)，伺服器行程可以在發出一個 I/O 請求後不必等待其完成就能繼續執行其他工作，藉此大幅提升資料讀取的並行度與吞吐量，解決讀取瓶頸。<br/><br/>E. Increase the level of RMAN multiplexing.（正確）<br/><br/>解析： 增加 RMAN 多工處理的程度（Multiplexing Level）會讓 RMAN 同時從多個資料檔案讀取區塊並寫入同一個備份片段中。這能提高 RMAN 填充緩衝區的速率，使伺服器能夠以更快的速度連續讀取資料（特別適用於防止磁帶設備因為讀取緩慢而導致串流中斷/streaming break 的情況）。" }, { "id": "E1-Q44", "exam": 1, "q": 44, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 1, "stem": "<p>Which two are true about RMAN duplexed backup sets? (Choose two.)<\/p>", "options": ["A duplexed backup set uses the same number of SBT channels as a non-duplexed backup set for the same number of files.", "A non-duplexed backup set written to disk can be duplexed to disk by backing up the backup set that is already on disk.", "A non-duplexed backup set written to SBT can be duplexed to tape by backing up the backup set that is already on tape.", "A non-duplexed backup set written to disk can be duplexed to tape by backing up the backup set that is already on disk.", "A non-duplexed backup set written to SBT can be duplexed to disk by backing up the backup set that is already on tape.", "A duplexed backup set always uses twice as many SBT channels as a non-duplexed backup set for the same number of files."], "correct": [1, 3], "choose": 2, "explain": "", "origNote": "這題考的是 RMAN (Recovery Manager) 雙重備份集 (Duplexed Backup Sets) 的運作規則與限制。<br/><br/>核心觀念：什麼是雙重備份集？<br/>為了提升備份的安全性（避免單一檔案損壞），RMAN 允許你為「同一個備份集」建立多個一模一樣的副本（最多可達 4 份）。<br/>達成的方式有兩種：<br/><br/>備份當下同時產生： 下 BACKUP 指令時加上 COPIES 參數。<br/><br/>事後拷貝： 針對已經備份好的檔案，使用 BACKUP BACKUPSET 指令再複製一份出來。這題的選項主要都是在考「事後拷貝」的路徑限制。<br/><br/>正確答案解析<br/>B. A non-duplexed backup set written to disk can be duplexed to disk by backing up the backup set that is already on disk.（正確）<br/><br/>說明： 你可以把「已經存在硬碟 (Disk) 上」的單一備份集當作來源，透過 BACKUP BACKUPSET 指令，將它拷貝到硬碟上的另一個位置，藉此完成雙重化。<br/><br/>D. A non-duplexed backup set written to disk can be duplexed to tape by backing up the backup set that is already on disk.（正確）<br/><br/>說明： 你可以把「已經存在硬碟 (Disk) 上」的備份集當作來源，將它拷貝到「磁帶 (SBT)」上。這是實務上極度常見的 D2D2T (Disk-to-Disk-to-Tape) 策略：先快速備份到本機硬碟，離峰時間再把硬碟的備份檔轉存到磁帶做長期保存。<br/><br/>為什麼其他選項是錯的？<br/>⛔ 關於來源設備的致命限制 (選項 C 與 E)<br/>RMAN 有一個非常嚴格的限制：不能把「磁帶 (SBT)」當作 BACKUP BACKUPSET 的來源。<br/><br/>C 錯誤： 選項說可以把已經在磁帶上的備份集，拷貝到另一卷磁帶 (Tape to Tape)。RMAN 不支援這種操作，這通常要靠底層磁帶櫃的硬體功能來達成。<br/><br/>E 錯誤： 選項說可以把已經在磁帶上的備份集，拷貝回硬碟 (Tape to Disk)。RMAN 同樣不支援將磁帶上的備份集作為來源進行備份。<br/><br/>⛔ 關於通道 (Channel) 數量的錯誤描述 (選項 A 與 F)<br/>如果你是在備份的「當下」同時寫入多份副本到磁帶 (SBT)，RMAN 的規則是：每一個副本都需要一個獨立的 SBT Channel。<br/><br/>A 錯誤： 選項說雙重備份使用的 SBT 通道數量與單一備份「相同」。這是錯的，因為你要同時寫入兩份，就需要兩個通道，數量不會相同。<br/><br/>F 錯誤： 選項說雙重備份「總是使用兩倍 (twice as many)」的通道。這也是錯的，因為 RMAN 允許你最高產生 4 份副本。如果你設定 COPIES 3，就會需要 3 個通道，而不總是兩倍。這個選項太過絕對。" }, { "id": "E1-Q45", "exam": 1, "q": 45, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 1, "stem": "<p>Which three are true about RMAN persistent configuration settings, administration, and their effects? (Choose three.)<\/p>", "options": ["A target database?s persistent RMAN configuration settings are always stored in the target?s control file", "Backup older than the recovery window retention policy are always deleted automatically if the backup location has insufficient space.", "Backups written to the fast recovery area (FRA) that are obsolete based on the redundancy retention policy can be deleted automatically to free space.", "The RMAN SHOW ALL command displays only settings with nondefault values.", "A target database?s persistent RMAN configuration settings are always synchronized automatically with the RMAN catalog.", "The V$RMAN_CONFIGURATION view displays only settings with values that have been modified."], "correct": [0, 2, 5], "choose": 3, "explain": "", "origNote": "" }, { "id": "E2-Q40", "exam": 2, "q": 40, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 1, "stem": "<p>Which three are true about Recovery Manager (RMAN) in Oracle Database 19c and later releases? (Choose three.)<\/p>", "options": ["It is only possible for RMAN to connect to a pluggable database as a target if an RMAN Virtual Private Catalog is used.", "It is always possible for RMAN to connect to a pluggable database as a target if any RMAN Catalog is used.", "A Virtual Private Catalog used to register a container database must be created in a pluggable database.", "A Virtual Private Catalog used to register a container database can be created in a pluggable database.", "It is always possible for RMAN to connect to a pluggable database as a target.", "A Virtual Private Catalog used to register a container database can be created in a non-container database."], "correct": [3, 4, 5], "choose": 3, "explain": "", "origNote": "選項 D 與 F（正確）： RMAN 復原目錄（包含 Virtual Private Catalog, VPC）在底層實體上，就只是一個存放中繼資料的資料庫 Schema。Oracle 完全支援將這個 Schema 建立在傳統的非容器資料庫（Non-CDB）中，或者建立在較新的插接式資料庫（PDB）裡。<br/><br/>選項 E（正確）： RMAN 允許你直接將 PDB 作為目標資料庫來連線（例如透過 TNS 連線：CONNECT TARGET sys@pdb_name），藉此對單一 PDB 執行備份或還原操作。<br/><br/>為什麼其他選項是錯的？<br/>A 錯誤： 此選項說「只有在 (only possible) 使用 VPC 時才能將 PDB 作為目標連線」。這是錯的，因為你完全可以不掛載任何目錄（預設的 NOCATALOG 模式），直接依靠目標端 CDB 的控制檔來連線並管理 PDB。<br/><br/>B 錯誤： 此選項說「使用『任何 (any)』RMAN 目錄都可以連線到 PDB」。這是 Oracle 12c 以後常考的陷阱：如果你連線到 PDB 作為目標，且你決定要搭配目錄使用，Oracle 強制規定你只能使用 VPC，絕對不能使用基礎目錄 (Base Recovery Catalog)。   <br/><br/>C 錯誤： 此選項說 VPC「必須 (must)」建立在 PDB 中。如同選項 F 所證實的，VPC 也可以建立在 Non-CDB 中，並沒有強制綁定在 PDB 的限制。" }, { "id": "E2-Q45", "exam": 2, "q": 45, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 1, "stem": "<p>Which two are true about creating RMAN backups for an Oracle container database? (Choose two.)<\/p>", "options": ["Tablespaces from different PDBs with identical names must be backed up by connecting RMAN separately to each PDB to back up the tablespaces.", "The BACKUP DATABASE command will create a pluggable database (PDB) backup when RMAN is connected to a PDB.", "SPFILE backups can be created while connected to an application root PDB.", "The BACKUP DATABASE PLUS ARCHIVELOG command will back up archive logs when RMAN is connected to a PDB.", "The BACKUP PLUGGABLE DATABASE command can be used to back up CDB$ROOT."], "correct": [1, 4], "choose": 2, "explain": "", "origNote": "正確選項解析<br/>B. The BACKUP DATABASE command will create a pluggable database (PDB) backup when RMAN is connected to a PDB.<br/>在多租戶架構中，RMAN 的操作範圍會受到「連線對象」的限制。當您使用 RMAN 直接連線到某個特定的 PDB（例如：RMAN TARGET sys@pdb1），您對 RMAN 下達 BACKUP DATABASE; 指令時，RMAN 只會備份「目前連線的這一個 PDB」，而不會備份整個 CDB。<br/><br/>E. The BACKUP PLUGGABLE DATABASE command can be used to back up CDB$ROOT.<br/>當您連線到 CDB 的根容器 (CDB$ROOT) 時，可以使用 BACKUP PLUGGABLE DATABASE 指令來備份特定的 PDB。特別的是，Oracle 在這裡將 CDB$ROOT 也視為一個特殊的 PDB，因此您可以使用 BACKUP PLUGGABLE DATABASE \"CDB$ROOT\"; 這樣的語法來單獨備份根容器。<br/>❌ 錯誤選項解析<br/>A. Tablespaces from different PDBs with identical names must be backed up by connecting RMAN separately to each PDB to back up the tablespaces.<br/>錯誤。如果不同 PDB 中有相同名稱的 Tablespace（例如大家都叫 USERS），您不需要分別連線到每個 PDB 才能備份。您可以直接連線到 CDB$ROOT，然後使用 PDB名稱:Tablespace名稱 的格式來指定備份，例如：BACKUP TABLESPACE pdb1:users, pdb2:users;。<br/><br/>C. SPFILE backups can be created while connected to an application root PDB.<br/>錯誤。伺服器參數檔 (SPFILE) 屬於整個 CDB 層級的配置檔案，PDB（包含 Application Root PDB）本身並沒有獨立的 SPFILE。因此，必須連線到 CDB$ROOT 才能備份 SPFILE，無法在 PDB 層級進行。<br/><br/>D. The BACKUP DATABASE PLUS ARCHIVELOG command will back up archive logs when RMAN is connected to a PDB.<br/>錯誤。歸檔日誌 (Archive Logs) 是實體資料庫層級 (CDB-level) 的檔案，所有的 PDB 都是共用同一組 Redo Logs 與 Archive Logs。因此，當 RMAN 連線到單一 PDB 時，是沒有權限也沒有辦法使用 PLUS ARCHIVELOG 來備份歸檔日誌的。備份歸檔日誌必須在連線至 CDB$ROOT 的狀態下進行。" }, { "id": "E2-Q52", "exam": 2, "q": 52, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 2, "stem": "<p>Which three capabilities require the use of the RMAN recovery catalog? (Choose three.)<\/p>", "options": ["using the KEEP FOREVER clause with the BACKUP command", "using RMAN stored scripts", "using the REPORT SCHEMA command to list a database?s current data files and tablespaces", "creating customized reports about a single database?s backups", "creating encrypted backups", "using the REPORT SCHEMA command to list a database?s data files and tablespaces at times in the past"], "correct": [0, 1, 5], "choose": 3, "explain": "", "origNote": "at times in the past-過去某些時候<br/>B 使用 RMAN 儲存腳本 (using RMAN stored scripts) 是絕對需要 Recovery Catalog 才能完成的功能" }, { "id": "E3-Q3", "exam": 3, "q": 3, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 2, "stem": "<p>Which three are true about RMAN archival backups with the RESTORE POINT clause? (Choose three.)<\/p>", "options": ["All archive logs are retained after an archival backup is taken, until the next archival backup is taken of the same database.", "The SPFILE is included in the archival backup.", "They are never considered obsolete by RMAN.", "Archive logs are retained if they are necessary to allow the database to be recovered to a consistent state when an archival backup is restored.", "The ARCHIVAL attribute for a backup overrides the RMAN retention policy.", "They can optionally be written to a fast recovery area (FRA)."], "correct": [1, 3, 4], "choose": 3, "explain": "", "origNote": "B. The SPFILE is included in the archival backup. (SPFILE 會被包含在歸檔備份中)<br/><br/>解釋： 為了確保這個備份在未來（可能是幾年後）能夠獨立且完整地被還原，RMAN 在建立歸檔備份（Keep Backup）時，會自動將 SPFILE（伺服器參數檔）以及控制檔（Control File）包含進去。這樣一來，即使未來的環境全毀，你依然有啟動資料庫所需的參數與架構資訊。<br/><br/>D. Archive logs are retained if they are necessary to allow the database to be recovered to a consistent state when an archival backup is restored. (如果為了讓歸檔備份還原時能恢復到一致狀態，必要的 Archive Logs 會被保留)<br/><br/>解釋： 如果你是在資料庫開啟（Online）的狀態下進行備份，資料庫在備份期間可能會有異動。為了確保這份備份還原後能達到「資料一致性」，RMAN 會自動備份並保留「備份期間產生」的 Archive Logs（歸檔日誌），這些日誌會跟著這個歸檔備份一起被長期保留。<br/><br/>E. The ARCHIVAL attribute for a backup overrides the RMAN retention policy. (備份的 ARCHIVAL 屬性會覆蓋 RMAN 的保留策略)<br/><br/>解釋： 這是歸檔備份（使用 KEEP 子句）最主要的功能。它會宣告這個備份是特殊的（例如 KEEP UNTIL TIME ... 或 KEEP FOREVER），因此 RMAN 預設的保留天數或備份份數限制（Retention Policy）對它無效，確保它不會被意外標記為廢棄（Obsolete）並刪除。<br/><br/>錯誤選項為何不正確：<br/>A. All archive logs are retained... (所有的 Archive logs 都會被保留直到下次歸檔備份)<br/><br/>錯誤原因： RMAN 只會保留「能讓該次備份恢復到一致狀態」所必需的特定 Archive logs，而不是保留所有的日誌。<br/><br/>C. They are never considered obsolete by RMAN. (它們永遠不會被 RMAN 視為廢棄)<br/><br/>錯誤原因： 如果你設定的是 KEEP UNTIL TIME '特定日期'，當超過那個日期後，它還是會被視為廢棄（Obsolete）。只有使用 KEEP FOREVER 才會永遠不廢棄。<br/><br/>F. They can optionally be written to a fast recovery area (FRA). (它們可以選擇寫入快速復原區 FRA)<br/><br/>錯誤原因： 歸檔備份（Keep Backups）不能存放在 FRA（Fast Recovery Area）中。因為 FRA 的空間是由資料庫根據保留策略自動管理的，而歸檔備份不受保留策略控管，如果放在 FRA 會導致空間管理機制混亂，RMAN 會阻擋這種操作。" }, { "id": "E3-Q22", "exam": 3, "q": 22, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 2, "stem": "<p>Which two are true about backup set compression using RMAN default compression? (Choose two.)<\/p>", "options": ["Compressed backups can be written only to media.", "Binary compression adds CPU overhead to backup operations.", "Unused blocks below the high water mark are backed up.", "Compressed backups cannot have a section size defined.", "Compression can be done only for locally managed tablespaces."], "correct": [1, 4], "choose": 2, "explain": "", "origNote": "Compression can be done only for locally managed tablespaces.<br/>E. Compression can be done only for locally managed tablespaces. (壓縮只能對本地管理的表空間進行)<br/>解釋： （這就是剛剛提到的經典陷阱！）這裡指的「壓縮」包含了 RMAN 預設啟用的 「未用區塊壓縮 (Unused Block Compression)」。RMAN 備份時為了加速並節省空間，會自動跳過那些「高水位線 (HWM) 以下，但目前為空」的區塊。要做到這點，RMAN 必須讀取表空間的點陣圖 (Bitmap)，而只有本地管理表空間 (LMT, Locally Managed Tablespaces) 才具備 Bitmap 架構。舊版的字典管理表空間 (DMT) 無法使用此功能。" }, { "id": "E3-Q26", "exam": 3, "q": 26, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 2, "stem": "<p>Which three are true about using an RMAN Recovery Catalog with a pluggable database (PDB) target connection in Oracle Database 19c and later releases? (Choose three.)<\/p>", "options": ["The base catalog owner must give the Virtual Private Catalog access to metadata for one or more PDBs.", "The base catalog must be enabled for Virtual Private Catalog use.", "The target PDB must be registered in a base catalog.", "The base catalog must be used by RMAN when performing point-in-time recovery for the PDB registered in the Virtual Private Catalog.", "The target PDB must be registered in a Virtual Private Catalog.", "The target PDB must be registered in both the base catalog and the Virtual Private Catalog."], "correct": [0, 3, 4], "choose": 3, "explain": "", "origNote": "A. The base catalog owner must give the Virtual Private Catalog access to metadata for one or more PDBs. (基礎目錄擁有者必須授予虛擬私有目錄存取一個或多個 PDB 元資料的權限)<br/><br/>解釋： 正確。Virtual Private Catalog (VPC) 的本質是 Base Catalog 的一個子集。為了讓 VPC 能夠管理特定的 PDB，Base Catalog 的擁有者（通常擁有整個 CDB 的權限）必須透過 GRANT 指令，明確將特定 PDB 的 metadata 存取權限授權給 VPC 的擁有者。<br/><br/>E. The target PDB must be registered in a Virtual Private Catalog. (目標 PDB 必須註冊在虛擬私有目錄中)<br/><br/>解釋： 正確。在 Oracle 架構中，Base Catalog 是用來註冊整個 CDB 的。如果您只想要連接並備份/還原單一個 PDB（PDB target connection），該 PDB 不能直接註冊在 Base Catalog 中，而是必須註冊在為該 PDB 專門建立的 Virtual Private Catalog (VPC) 中。<br/><br/>D. The base catalog must be used by RMAN when performing point-in-time recovery for the PDB registered in the Virtual Private Catalog. (當為註冊在虛擬私有目錄中的 PDB 執行時間點復原時，RMAN 必須使用基礎目錄)<br/><br/>解釋： 正確。執行 PDB 的時間點復原 (PITR) 是一個複雜的過程，RMAN 在底層會自動建立一個輔助執行個體 (Auxiliary Instance)。這個過程需要獲取整個 CDB 層級的元資料（例如 Control File 資訊、CDB 的 UNDO 資訊等），而這些資訊存在於 Base Catalog 中，因此在執行 PDB PITR 時，RMAN 仍會需要存取 Base Catalog。<br/><br/>錯誤選項分析：<br/><br/>B. The base catalog must be enabled for Virtual Private Catalog use. (基礎目錄必須先被啟用以供虛擬私有目錄使用)<br/><br/>解釋： 錯誤。Base Catalog 在建立後 ( CREATE CATALOG ) 就具備了支援 VPC 的能力，不需要額外執行所謂的 \"enable\" 指令。只要 Base Catalog 擁有者直接給予權限 (GRANT CATALOG FOR DATABASE...) 即可建立 VPC。<br/><br/>C. The target PDB must be registered in a base catalog. (目標 PDB 必須註冊在基礎目錄中)<br/><br/>解釋： 錯誤。如同選項 E 所述，Base Catalog 是用來註冊整個 CDB 的。單一 PDB 是註冊在 Virtual Private Catalog 裡，不能直接註冊在 Base Catalog。<br/><br/>F. The target PDB must be registered in both the base catalog and the Virtual Private Catalog. (目標 PDB 必須同時註冊在基礎目錄與虛擬私有目錄中)<br/><br/>解釋： 錯誤。與選項 C 的理由相同，PDB 不會直接註冊在 Base Catalog 中，只會註冊在 VPC 裡。" }, { "id": "E3-Q31", "exam": 3, "q": 31, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 2, "stem": "<p>Which three are true about interpreting Recovery Manager (RMAN) error stacks returned to standard output? (Choose three.)<\/p>", "options": ["Some messages in the error stack are not errors.", "If an RMAN command fails, the output will only identify the command that failed.", "If an RMAN command fails, the output will identify the channel ID where the failure occurred.", "Media Management errors appear as a line with ?sbtio? and a number.", "Media Management errors appear as a line with ?sbtio?.", "Media Management errors appear as a line with ?Additional information? and a number."], "correct": [0, 2, 5], "choose": 3, "explain": "", "origNote": "F. Media Management errors appear as a line with \"Additional information\" and a number. (媒體管理錯誤會顯示為包含 \"Additional information\" 及一個數字的行)<br/><br/>解釋： 正確。當 RMAN 透過 Media Management Layer (MML) 與第三方磁帶或備份軟體溝通並發生錯誤時，RMAN 本身通常會拋出 ORA-19511 等錯誤，並在堆疊中附帶一行 Additional information: &lt;數字&gt;。這個數字是第三方媒體管理廠商（如 NetBackup, Commvault）專屬的錯誤代碼，供 DBA 去查閱廠商的文件。" }, { "id": "E4-Q17", "exam": 4, "q": 17, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 3, "stem": "<p>On the 10th of August, you implement an incremental database backup strategy and configure a recovery window of five days. Level 0 backups are taken on the 10th, 17th, and 24th of August. Differential level 1 incremental backups are taken daily between the level 0 backups. Today is the 26th of August. <strong>Which backups will be obsolete?<\/strong><\/p>", "options": ["all backups prior to 24th of August", "all backups prior to 22nd of August", "all backups prior to 10th of August", "all backups prior to 20th of August", "all backups prior to 17th of August"], "correct": [4], "choose": 1, "explain": "", "origNote": "MAN 必須保留足夠的備份，以確保資料庫可以還原到過去 5 天內的任何一個時間點" }, { "id": "E4-Q51", "exam": 4, "q": 51, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 3, "stem": "<p>Which two are true about RMAN duplexed backup sets? (Choose two.)<\/p>", "options": ["A non-duplexed backup set written to SBT can be duplexed to disk by backing up the backup set that is already on tape.", "A non-duplexed backup set written to disk can be duplexed to disk by backing up the backup set that is already on disk.", "A non-duplexed backup set written to SBT can be duplexed to tape by backing up the backup set that is already on tape.", "A duplexed backup set uses the same number of SBT channels as a non-duplexed backup set for the same number of files.", "A non-duplexed backup set written to disk can be duplexed to tape by backing up the backup set that is already on disk.", "A duplexed backup set always uses twice as many SBT channels as a non-duplexed backup set for the same number of files."], "correct": [1, 4], "choose": 2, "explain": "", "origNote": "這題考驗的是 RMAN 中 備份組的備份 (BACKUP BACKUPSET) 以及 雙重備份 (Duplexed Backup Sets) 的底層限制。<br/>背起來<br/>實務上，我們常常會先將資料庫備份到磁碟 (Disk) 以求最快的備份速度，隨後再利用 RMAN 把這些在磁碟上的備份檔複製 (Duplex) 到另一顆硬碟或是備份到磁帶 (Tape / SBT) 上做異地存放。" }, { "id": "E5-Q1", "exam": 5, "q": 1, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 3, "stem": "<p>Which three are true about RMAN archival backups with the RESTORE POINT clause? (Choose three.)<\/p>", "options": ["Archive logs are retained if they are necessary to allow the database to be recovered to a consistent state when an archival backup is restored.", "They are never considered obsolete by RMAN.", "They can optionally be written to a fast recovery area (FRA).", "The SPFILE is included in the archival backup.", "The ARCHIVAL attribute for a backup overrides the RMAN retention policy.", "All archive logs are retained after an archival backup is taken, until the next archival backup is taken of the same database."], "correct": [0, 3, 4], "choose": 3, "explain": "", "origNote": "「Archival Backup (封存備份)」 和 「Archive Log (歸檔日誌)」 雖然單字長得很像，但在 Oracle 裡是完全不一樣的東西。<br/>Archival Backup (封存備份)<br/><br/>這是什麼： 這是一個 「特殊的 RMAN 備份動作」。有時候因為法規要求（例如財務資料要保留 7 年），你需要把今天的資料庫做一個「時空膠囊」永久保存起來，不被日常的過期刪除機制（Retention Policy）給清掉。<br/>對應語法： 就是前面提到的 BACKUP DATABASE KEEP" }, { "id": "E5-Q27", "exam": 5, "q": 27, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 3, "stem": "<p>Examine this configuration:<\/p>\n<p>1.The ORCL database data files are in Automatic Storage Management (Oracle ASM) disk group +DATA.<br/>\n2.ORCL uses disk group +FRA for the Fast Recovery Area.<br/>\n3.LISTENER is the listener for ORCL.<br/>\n4.The database, listener, ASM instance, and ASM disk groups are managed by Oracle Restart.<br/>\n5.All components are currently shut down.<\/p>\n<p>You execute this command:<\/p>\n<p><strong>$ srvctl start database -d orcl<\/strong><\/p>\n<p>What is the outcome?<\/p>", "options": ["Only the ORCL database instance and the +DATA and +FRA disk groups are started.", "Only the ORCL database and the ASM instances are started.", "Only the ORCL database instance is started.", "The ORCL database, the Oracle ASM instances, the +DATA and +FRA disk groups, and the LISTENER are started.", "Only the ORCL database instance, the Oracle ASM instance, and the +DATA and +FRA disk groups are started."], "correct": [3], "choose": 1, "explain": "", "origNote": "可再確認一下" }, { "id": "E6-Q34", "exam": 6, "q": 34, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 3, "stem": "<p>Which three are true about using an RMAN Recovery Catalog with a pluggable database (PDB) target connection in Oracle Database 19c and later releases? (Choose three.)<\/p>", "options": ["The target PDB must be registered in a base catalog.", "The base catalog owner must give the Virtual Private Catalog access to metadata for one or more PDBs.", "The base catalog must be enabled for Virtual Private Catalog use.", "The target PDB must be registered in both the base catalog and the Virtual Private Catalog.", "The base catalog must be used by RMAN when performing point-in-time recovery for the PDB registered in the Virtual Private Catalog.", "The target PDB must be registered in a Virtual Private Catalog."], "correct": [1, 4, 5], "choose": 3, "explain": "", "origNote": "The base catalog owner must give the Virtual Private Catalog access to metadata for one or more PDBs. (基礎目錄的擁有者必須授予虛擬私有目錄 (VPC) 存取一個或多個 PDB 中繼資料的權限。)<br/>存取權限的下放 (Grant Access)：<br/>VPC 裡面一開始是空的。建立 VPC 後，擁有最高權限的「基礎目錄擁有者 (Base Catalog Owner)」必須明確地執行授權指令（例如 GRANT CATALOG FOR DATABASE <pdb_name> TO <vpc_owner>），VPC 才能真正拿到該 PDB 的備份中繼資料。<\/vpc_owner><\/pdb_name>" }, { "id": "E7-Q18", "exam": 7, "q": 18, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 4, "stem": "<p>You have configured RMAN SBT channels to write backups to media. You then take an RMAN backup by using this command:<br/>\nWhich three are true? (Choose three.)<\/p>\n<p><img alt=\"Generated image\" class=\"\" decoding=\"async\" height=\"337\" src=\"https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-fc28-622f-ac16-606eed4f95b4/raw?se=2025-09-18T18%3A15%3A25Z&amp;sp=r&amp;sv=2024-08-04&amp;sr=b&amp;scid=13f31067-4e0a-54dd-8ddb-01edf998a758&amp;skoid=d5627e4c-566b-4761-a954-54993b0ed17b&amp;sktid=a48cca56-e6da-484e-a814-9c849652bcb3&amp;skt=2025-09-18T06%3A30%3A47Z&amp;ske=2025-09-19T06%3A30%3A47Z&amp;sks=b&amp;skv=2024-08-04&amp;sig=z3/zmhXmYSpZCWI6WAkMwsF5J/seEjB5w4pyRPOIf90%3D\" width=\"337\"/><\/p>", "options": ["All archive logs created after this backup are kept for two years.", "The control file is included in the self-contained archival backup.", "The restore point is a label for the system change number (SCN) that will be saved two years after the archival backup was taken.", "The SPFILE is included in the self-contained archival backup.", "The restore point is a label for the system change number (SCN) before the archival backup was taken.", "The data file backups in the self-contained archive backup are not considered obsolete for two years regardless of the retention policy."], "correct": [1, 3, 5], "choose": 3, "explain": "", "origNote": "沒圖" }, { "id": "E7-Q29", "exam": 7, "q": 29, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 4, "stem": "<p>Which three are true about Recovery Manager (RMAN) in Oracle Database 19c and later releases? (Choose three.)<\/p>", "options": ["It is always possible for RMAN to connect to a pluggable database as a target.", "A Virtual Private Catalog used to register a container database must be created in a pluggable database.", "It is only possible for RMAN to connect to a pluggable database as a target if an RMAN Virtual Private Catalog is used.", "A Virtual Private Catalog used to register a container database can be created in a non-container database.", "A Virtual Private Catalog used to register a container database can be created in a pluggable database.", "It is always possible for RMAN to connect to a pluggable database as a target if any RMAN Catalog is used."], "correct": [0, 3, 4], "choose": 3, "explain": "", "origNote": "It is always possible for RMAN to connect to a pluggable database as a target if any RMAN Catalog is used.<br/>錯誤原因： 錯在後面的條件限制（if any RMAN Catalog is used）。這句話暗示了「你必須使用 RMAN Catalog 才能連線到 PDB 作為 Target」，這在 19c 中是錯誤的。即使您不使用任何 Catalog（僅依賴目標端控制檔 NOCATALOG 模式），您依然可以直接連線到 PDB。因此，不需要這個條件限制。" }, { "id": "E7-Q45", "exam": 7, "q": 45, "topic": "09_RMAN_Backup", "topicTitle": "RMAN 備份與設定", "part": 4, "stem": "<p>Which two are true about Recovery Manager (RMAN) diagnostic message output? (Choose two.)<\/p>", "options": ["The RMAN LOG command line clause causes output issued during RMAN command compilation to be written to a log file only.", "RMAN error stacks should be read from the top down as that is the order in which errors are generated.", "The RMAN LOG command line clause causes output issued during RMAN command compilation to be written to a log file and to standard output.", "Media Management messages for SBT devices are written to an
