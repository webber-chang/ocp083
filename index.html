<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oracle 1Z0-083 主題測驗 · 錯題筆記</title>
  <meta name="description" content="Oracle 1Z0-083 依主題分類的互動測驗，作答判分並記錄錯題與個人筆記。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --bg2: #111831;
      --panel: rgba(255, 255, 255, .045);
      --panel2: rgba(255, 255, 255, .08);
      --line: rgba(255, 255, 255, .09);
      --text: #e6e9f5;
      --muted: #8e97b8;
      --accent: hsl(256 90% 68%);
      --accent2: hsl(190 90% 55%);
      --ok: hsl(152 65% 48%);
      --okbg: hsla(152, 65%, 48%, .12);
      --bad: hsl(352 85% 62%);
      --badbg: hsla(352, 85%, 62%, .12);
      --warn: hsl(38 95% 58%);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      background-image: radial-gradient(1200px 600px at 10% -10%, hsla(256, 90%, 60%, .18), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, hsla(190, 90%, 50%, .12), transparent 60%);
      background-attachment: fixed
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: none;
      background: none
    }

    ::-webkit-scrollbar {
      width: 10px
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .12);
      border-radius: 10px
    }

    .app {
      display: grid;
      grid-template-columns: 310px 1fr;
      height: 100vh
    }

    /* ---------- sidebar ---------- */
    aside {
      border-right: 1px solid var(--line);
      background: rgba(8, 12, 26, .6);
      backdrop-filter: blur(14px);
      overflow-y: auto;
      padding: 22px 16px
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 6px;
      cursor: pointer
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 8px 24px hsla(256, 90%, 60%, .35)
    }

    .brand h1 {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: .2px
    }

    .brand small {
      color: var(--muted);
      font-size: .78rem
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center
    }

    .stat b {
      display: block;
      font-size: 1.25rem
    }

    .stat span {
      font-size: .72rem;
      color: var(--muted)
    }

    .stat.bad b {
      color: var(--bad)
    }

    .stat.ok b {
      color: var(--ok)
    }

    .sec-title {
      font-size: .72rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 16px 8px 8px
    }

    .quick {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .qbtn {
      padding: 10px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      font-size: .85rem;
      text-align: left;
      transition: .2s
    }

    .qbtn:hover {
      background: var(--panel2);
      transform: translateY(-1px)
    }

    .qbtn i {
      font-style: normal;
      margin-right: 6px
    }

    .qbtn.wrong {
      border-color: hsla(352, 85%, 62%, .35)
    }

    .topic {
      border-radius: 12px;
      margin-bottom: 4px;
      transition: .2s
    }

    .topic-head {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border-radius: 12px;
      text-align: left
    }

    .topic-head:hover {
      background: var(--panel)
    }

    .topic.open .topic-head {
      background: var(--panel2)
    }

    .tnum {
      font-family: 'JetBrains Mono';
      font-size: .72rem;
      color: var(--muted);
      width: 20px
    }

    .tname {
      flex: 1;
      font-size: .86rem
    }

    .tcount {
      font-size: .72rem;
      color: var(--muted)
    }

    .tbar {
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .07);
      margin: 0 10px 6px 40px;
      overflow: hidden
    }

    .tbar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .5s
    }

    .parts {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px 10px 10px 40px
    }

    .topic.open .parts {
      display: flex
    }

    .chip {
      font-size: .75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      transition: .2s
    }

    .chip:hover {
      border-color: var(--accent);
      color: #fff
    }

    .chip.all {
      background: linear-gradient(135deg, hsla(256, 90%, 68%, .25), hsla(190, 90%, 55%, .2))
    }

    .chip .w {
      color: var(--bad);
      margin-left: 4px
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 8px
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .85rem;
      color: #c8cde3
    }

    .switch {
      position: relative;
      width: 38px;
      height: 22px
    }

    .switch input {
      display: none
    }

    .switch span {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      background: rgba(255, 255, 255, .12);
      transition: .25s
    }

    .switch span::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      transition: .25s
    }

    .switch input:checked+span {
      background: var(--accent)
    }

    .switch input:checked+span::after {
      transform: translateX(16px)
    }

    /* ---------- main ---------- */
    main {
      overflow-y: auto;
      padding: 28px clamp(16px, 4vw, 48px) 80px
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap
    }

    .crumb {
      font-size: .85rem;
      color: var(--muted)
    }

    .crumb b {
      color: var(--text)
    }

    .spacer {
      flex: 1
    }

    .tab {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: .85rem;
      background: var(--panel);
      border: 1px solid var(--line);
      transition: .2s
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent), hsl(256 70% 55%));
      border-color: transparent;
      box-shadow: 0 6px 20px hsla(256, 90%, 60%, .35)
    }

    .progress {
      height: 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .07);
      overflow: hidden;
      margin-bottom: 22px
    }

    .progress i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .4s
    }

    .dots {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: -10px 0 22px
    }

    .dot {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      font-size: .7rem;
      display: grid;
      place-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      transition: .15s
    }

    .dot:hover {
      border-color: var(--accent)
    }

    .dot.cur {
      outline: 2px solid var(--accent);
      outline-offset: 1px
    }

    .dot.ok {
      background: var(--okbg);
      border-color: hsla(152, 65%, 48%, .5);
      color: var(--ok)
    }

    .dot.bad {
      background: var(--badbg);
      border-color: hsla(352, 85%, 62%, .5);
      color: var(--bad)
    }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .03));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
      animation: rise .35s ease
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .qhead {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .pill {
      font-size: .72rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel2);
      color: #c9cff0
    }

    .pill.id {
      font-family: 'JetBrains Mono';
      background: hsla(256, 90%, 68%, .18);
      color: #cfc3ff
    }

    .pill.multi {
      background: hsla(38, 95%, 58%, .15);
      color: var(--warn)
    }

    .pill.hist {
      background: var(--badbg);
      color: var(--bad)
    }

    .star {
      font-size: 1.25rem;
      opacity: .45;
      transition: .2s
    }

    .star.on {
      opacity: 1;
      filter: drop-shadow(0 0 8px hsla(45, 100%, 60%, .6))
    }

    .stem {
      font-size: 1.05rem;
      margin-bottom: 18px
    }

    .stem p {
      margin-bottom: 8px
    }

    .stem img,
    .note-body img,
    .explain img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      background: #fff;
      padding: 6px;
      margin: 8px 0
    }

    .stem pre,
    .option pre {
      font-family: 'JetBrains Mono';
      font-size: .85rem;
      background: rgba(0, 0, 0, .35);
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .option {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      text-align: left;
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .035);
      border: 1.5px solid var(--line);
      transition: .18s
    }

    .option:hover:not([disabled]) {
      border-color: hsla(256, 90%, 68%, .6);
      background: rgba(255, 255, 255, .06)
    }

    .option .key {
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: .82rem;
      background: var(--panel2);
      transition: .18s
    }

    .option.sel {
      border-color: var(--accent);
      background: hsla(256, 90%, 68%, .12)
    }

    .option.sel .key {
      background: var(--accent);
      color: #fff
    }

    .option.correct {
      border-color: var(--ok);
      background: var(--okbg)
    }

    .option.correct .key {
      background: var(--ok);
      color: #06210f
    }

    .option.wrongpick {
      border-color: var(--bad);
      background: var(--badbg)
    }

    .option.wrongpick .key {
      background: var(--bad);
      color: #fff
    }

    .option.missed {
      border-style: dashed
    }

    .option .tag {
      margin-left: auto;
      flex: none;
      font-size: .72rem;
      padding: 2px 8px;
      border-radius: 6px;
      align-self: center
    }

    .option.correct .tag {
      background: var(--ok);
      color: #052
    }

    .option.wrongpick .tag {
      background: var(--bad);
      color: #fff
    }

    .option[disabled] {
      cursor: default
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      align-items: center;
      flex-wrap: wrap
    }

    .btn {
      padding: 11px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: .9rem;
      background: var(--panel2);
      border: 1px solid var(--line);
      transition: .2s
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, .12)
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), hsl(230 85% 60%));
      border: none;
      box-shadow: 0 8px 22px hsla(256, 90%, 60%, .35)
    }

    .btn.primary:disabled {
      opacity: .4;
      transform: none;
      cursor: not-allowed
    }

    .btn.danger {
      color: var(--bad)
    }

    .hint {
      font-size: .78rem;
      color: var(--muted)
    }

    kbd {
      font-family: 'JetBrains Mono';
      font-size: .7rem;
      padding: 1px 6px;
      border-radius: 5px;
      background: var(--panel2);
      border: 1px solid var(--line)
    }

    .result {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: rise .3s
    }

    .result.ok {
      background: var(--okbg);
      color: var(--ok);
      border: 1px solid hsla(152, 65%, 48%, .4)
    }

    .result.bad {
      background: var(--badbg);
      color: var(--bad);
      border: 1px solid hsla(352, 85%, 62%, .4)
    }

    .result small {
      color: var(--text);
      font-weight: 400;
      opacity: .85
    }

    details.box {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(0, 0, 0, .18);
      overflow: hidden
    }

    details.box summary {
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: .9rem;
      list-style: none;
      display: flex;
      gap: 8px;
      align-items: center
    }

    details.box summary::before {
      content: "▸";
      transition: .2s;
      color: var(--muted)
    }

    details.box[open] summary::before {
      transform: rotate(90deg)
    }

    .note-body,
    .explain {
      padding: 4px 18px 16px;
      font-size: .92rem;
      color: #d4d8ea
    }

    .mynote {
      margin-top: 18px;
      border-radius: 14px;
      padding: 16px 18px;
      background: linear-gradient(135deg, hsla(45, 100%, 60%, .08), hsla(30, 100%, 60%, .04));
      border: 1px solid hsla(45, 100%, 60%, .25)
    }

    .mynote h3 {
      font-size: .92rem;
      color: hsl(45 100% 70%);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .mynote h3 .saved {
      font-size: .72rem;
      color: var(--muted);
      font-weight: 400;
      margin-left: auto;
      transition: .3s
    }

    .reasons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px
    }

    .reason {
      font-size: .76rem;
      padding: 4px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      transition: .15s
    }

    .reason.on {
      background: hsla(45, 100%, 60%, .2);
      border-color: hsla(45, 100%, 60%, .6);
      color: hsl(45 100% 78%)
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
      font-size: .9rem;
      background: rgba(0, 0, 0, .3);
      color: var(--text);
      border: 1px solid var(--line);
      outline: none;
      transition: .2s
    }

    textarea:focus {
      border-color: hsla(45, 100%, 60%, .6);
      box-shadow: 0 0 0 3px hsla(45, 100%, 60%, .12)
    }

    /* summary & wrong book */
    .hero {
      text-align: center;
      padding: 30px 10px
    }

    .hero .big {
      font-size: 3.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      color: transparent
    }

    .hero p {
      color: var(--muted)
    }

    .welcome h2 {
      font-size: 1.7rem;
      margin-bottom: 8px
    }

    .welcome .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
      margin-top: 24px
    }

    .tcard {
      padding: 18px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      text-align: left;
      transition: .2s
    }

    .tcard:hover {
      transform: translateY(-3px);
      border-color: hsla(256, 90%, 68%, .5);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .3)
    }

    .tcard b {
      display: block;
      margin: 4px 0 8px;
      font-size: .95rem
    }

    .tcard small {
      color: var(--muted)
    }

    .wb-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 18px
    }

    select {
      font: inherit;
      font-size: .85rem;
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--bg2);
      color: var(--text);
      border: 1px solid var(--line)
    }

    .wb-item {
      margin-bottom: 14px;
      padding: 18px 20px
    }

    .wb-item .stem {
      font-size: .95rem;
      margin-bottom: 10px
    }

    .wb-ans {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: .82rem;
      margin-bottom: 8px
    }

    .wb-ans span {
      padding: 3px 10px;
      border-radius: 8px
    }

    .wb-ans .c {
      background: var(--okbg);
      color: var(--ok)
    }

    .wb-ans .p {
      background: var(--badbg);
      color: var(--bad)
    }

    .wb-note {
      white-space: pre-wrap;
      font-size: .88rem;
      background: rgba(0, 0, 0, .25);
      border-left: 3px solid hsl(45 100% 60%);
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 8px
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 50px
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      padding: 10px 18px;
      border-radius: 10px;
      background: #1d2545;
      border: 1px solid var(--line);
      transition: .3s;
      pointer-events: none;
      z-index: 9
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%)
    }

    .menu-btn {
      display: none
    }

    @media (max-width:900px) {
      .app {
        grid-template-columns: 1fr
      }

      aside {
        position: fixed;
        inset: 0 auto 0 0;
        width: 300px;
        z-index: 5;
        transform: translateX(-100%);
        transition: .3s
      }

      aside.show {
        transform: none
      }

      .menu-btn {
        display: inline-block
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="logo">083</div>
        <div>
          <h1>1Z0-083 主題測驗</h1><small>重點筆記題 · 錯題追蹤</small>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b id="st-done">0</b><span>已作答</span></div>
        <div class="stat ok"><b id="st-rate">0%</b><span>答對率</span></div>
        <div class="stat bad"><b id="st-wrong">0</b><span>錯題</span></div>
      </div>
      <div class="quick">
        <button class="qbtn" id="btn-all"><i>📚</i>全部題目</button>
        <button class="qbtn" id="btn-random"><i>🎲</i>隨機 20 題</button>
        <button class="qbtn wrong" id="btn-wrong"><i>❌</i>練習錯題</button>
        <button class="qbtn" id="btn-star"><i>⭐</i>加星題目</button>
        <button class="qbtn" id="btn-unseen"><i>🆕</i>未作答</button>
        <button class="qbtn" id="btn-book"><i>📒</i>錯題本</button>
      </div>
      <div class="sec-title">主題分類</div>
      <div id="topic-list"></div>
      <div class="sec-title">設定</div>
      <div class="opts">
        <label class="toggle">題目順序隨機<span class="switch"><input type="checkbox"
              id="opt-shufq"><span></span></span></label>
        <label class="toggle">選項順序隨機<span class="switch"><input type="checkbox"
              id="opt-shufo"><span></span></span></label>

ith performance.", "Tuning activities should stop once agreed service levels for performance have been met.", "The database instance memory should always be tuned before tuning any file systems.", "SQL statements should always be tuned before tuning any file systems.", "The alert log should be used to find the database and instance areas most in need of tuning."], "correct": [0, 4], "choose": 2, "explain": "", "origNote": "答案疑似有誤" }, { "id": "E2-Q39", "exam": 2, "q": 39, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 1, "stem": "<p>Which three are true about performing an Oracle Database install on Linux? (Choose three.)<\/p>", "options": ["The runfixup.sh script can install missing RPMs.", "The Oracle Preinstallation RPM must be used to configure the Oracle database installation owner, the Oracle Inventory group, and an Oracle administrative privileges group.", "It allows you to select the languages supported by the Oracle database server.", "It can be done before installing Grid Infrastructure for a Standalone Server.", "The Oracle Preinstallation RPM can be used to configure the Oracle database installation owner, the Oracle Inventory group, and an Oracle administrative privileges group.", "It can be done after installing Grid Infrastructure for a Standalone Server."], "correct": [3, 4, 5], "choose": 3, "explain": "", "origNote": "AI與答案不符<br/>正確答案解析<br/>C. It allows you to select the languages supported by the Oracle database server.（正確）<br/><br/>說明： 在執行 Oracle Universal Installer (OUI) 安裝資料庫軟體的過程中，會有一個步驟允許你點選「Product Languages (產品語言)」，藉此選擇資料庫伺服器所需要支援的語言套件。<br/><br/>E. The Oracle Preinstallation RPM can be used to configure the Oracle database installation owner, the Oracle Inventory group, and an Oracle administrative privileges group.（正確）<br/><br/>說明： Oracle 官方提供了 Preinstallation RPM (例如 oracle-database-preinstall-19c)。執行這個 RPM 可以 (can) 幫你自動建立 oracle 使用者、oinstall 群組以及 dba 等管理群組，同時還會幫你設定好 OS 核心參數與限制，非常方便。<br/><br/>F. It can be done after installing Grid Infrastructure for a Standalone Server.（正確）<br/><br/>說明： 這是 Oracle 官方標準的安裝順序！如果你計畫使用 ASM (自動儲存管理) 或 Oracle Restart，你必須先安裝 Grid Infrastructure (GI)，然後再安裝 Oracle Database 軟體。這樣在建立資料庫時，OUI 才能自動識別出 ASM 磁碟，並將資料庫自動註冊到 Oracle Restart 中。<br/><br/>❌ 為什麼其他選項是錯的？<br/>A 錯誤： 選項說「runfixup.sh 腳本可以安裝缺少的 RPMs」。<br/><br/>真相： 安裝程式 (OUI 或 CVU) 產生的 runfixup.sh 腳本，主要是用來自動修復 OS 核心參數 (Kernel parameters) 或 資源限制 (Limits, 如 limits.conf)。它不會幫你觸發 yum 去下載安裝缺失的 RPM 軟體包。缺少的 RPM 必須由系統管理員手動安裝。<br/><br/>B 錯誤： 選項說「必須 (must) 使用 Oracle Preinstallation RPM 來設定使用者和群組」。<br/><br/>真相： 關鍵字錯在「must」。雖然官方強烈建議使用 Preinstallation RPM 來簡化流程，但這絕對不是強制的。DBA 完全可以手動下 Linux 指令 (groupadd, useradd, 修改 sysctl.conf) 來完成所有的前置設定。<br/><br/>D 錯誤： 選項說「可以在安裝單機版 Grid Infrastructure 之前進行資料庫安裝」。<br/><br/>真相： 根據 Oracle 官方安裝指南的明確規定，如果你打算在此伺服器上使用 Grid Infrastructure (Oracle Restart)，則 GI 的安裝與設定必須發生在安裝 Oracle Database 之前。如果在 GI 之前先裝了資料庫，後續的整合與註冊會出現問題或需要大量手動重建。" }, { "id": "E4-Q20", "exam": 4, "q": 20, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 1, "stem": "<p>Which two are true about creating pluggable databases (PDBs) using snapshots in Oracle 19c and later releases? (Choose two.)<\/p>", "options": ["A PDB snapshot depends on a storage snapshot which can be stored on any file system.", "A snapshot copy PDB depends on a storage snapshot which can only be stored on specific file systems.", "A PDB snapshot is always a full copy of the source PDB.", "A PDB snapshot is always a sparse copy of the source PDB.", "A snapshot copy PDB can be created from a stand-alone clone PDB.", "A PDB snapshot depends on a storage snapshot which can only be stored on specific file systems."], "correct": [1, 5], "choose": 2, "explain": "", "origNote": "題庫疑慮:<br/>. 當選項主詞是「A snapshot copy PDB」<br/><br/>對應語法： CREATE ... SNAPSHOT COPY<br/><br/>解題聯想： 這是指利用底層儲存設備建立的「稀疏複製 PDB」。<br/><br/>必備條件： 看到這個主詞，立刻聯想它強烈依賴特定的檔案系統（例如 ACFS），並且可以從獨立的 clone PDB 建立。<br/><br/>2. 當選項主詞是「A PDB snapshot」<br/><br/>對應語法： CREATE ... "<p>Examine this configuration: CDB1 is a container database. PDB1 and PDB2 are pluggable databases in CDB1. You execute these commands successfully:<br/>\nWhich two are true? (Choose two.)<\/p>", "options": ["Redo logs are opened.", "PDB1 and PDB2 are in MOUNT state.", "PDB$SEED is in READ ONLY state.", "PDB1 and PDB2 are in READ ONLY state.", "CDB$ROOT is in MOUNT state."], "correct": [1, 4], "choose": 2, "explain": "", "origNote": "不完整" }, { "id": "E7-Q22", "exam": 7, "q": 22, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 1, "stem": "<p>You are managing this configuration: CDB1 is a container database. PDB1 and PDB2 are two pluggable databases in CDB1. USER1.EMP is a table in PDB1 and USER2.DEPT is a table in PDB2. CDB1 user SYS executes these commands after connecting successfully to PDB2:<br/>\nWhich two are true? (Choose two.)<\/p>", "options": ["The inserts on USER1.EMP were rolled back when the session connected to PDB2.", "The inserts on USER1.EMP were committed when the session inserted a row into USER2.DEPT.", "The insert on USER2.DEPT is a recursive autonomous transaction by the child session and is committed.", "The insert on USER2.DEPT is uncommitted.", "The insert on USER2.DEPT fails because of the active transaction in the parent container.", "The inserts on USER1.EMP remain uncommitted when the session connected to PDB2."], "correct": [4, 5], "choose": 2, "explain": "", "origNote": "不完整" }, { "id": "E9-Q22", "exam": 9, "q": 22, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 2, "stem": "<p>Examine this configuration: CDB1 is a container database running in ARCHIVELOG mode. Multiple uncommitted transactions are running in CDB1. Redo log groups 1 and 2 are INACTIVE. Redo log group 3 is the CURRENT group. All members of redo log group 3 are lost before it is archived. Examine these possible steps: 1. SHUTDOWN ABORT 2. STARTUP NOMOUNT 3. STARTUP MOUNT 4. ALTER DATABASE MOUNT 5. RESTORE DA         0<br/>shared_pool_size                              big integer                 0<br/>statistics_level                                   big integer                 0<br/>workarea_size_policy                       big integer                 0<br/>How are System Global Area (SGA) and Program Global Area (PGA) memory managed by an instance using these parameter settings?<\/p>", "options": ["SGA memory is managed by using Automatic Shared Memory Management (ASMM) and PGA memory is manually managed", "SGA memory is managed by using Automatic Shared Memory Management (ASMM) and PGA memory is managed by using Automated SQL Execution Memory Management", "SGA and PGA memory are manually managed", "SGA and PGA memory are managed by using Automatic Memory Management (AMM)", "SGA memory is manually managed and PGA memory is managed by using Automated SQL Execution Memory Management"], "correct": [3], "choose": 1, "explain": "", "origNote": "有疑慮喔<br/>AI答案為:SGA and PGA memory are manually managed<br/>MEMORY_TARGET = 0<br/>→ 不是 AMM<br/>SGA_TARGET = 0<br/>→ 不是 ASMM<br/>PGA_AGGREGATE_TARGET = 0<br/>→ PGA Workarea 不是自動管理<br/>⇒ SGA + PGA 手動管理" }, { "id": "E11-Q14", "exam": 11, "q": 14, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 2, "stem": "<p>Which two are true about the character sets used in an Oracle database? (Choose two.)<\/p>", "options": ["Multibyte character sets allow more efficient space utilization than single byte character sets.", "Single-byte character sets provide better performance than multibyte character sets.", "Unicode is the only supported character set for Oracle databases created using Database Configuration Assistant (DBCA).", "Single-byte character sets always use 8-bit encoding schemes.", "Unicode enables information from any language to be stored using a single character set.", "Single-byte character sets always use 7-bit encoding schemes."], "correct": [1, 4], "choose": 2, "explain": "", "origNote": "答案疑慮<br/>AI: <br/>Multibyte character sets allow more efficient space utilization than single byte character sets.<br/>Unicode enables information from any language to be stored using a single character set." }, { "id": "E11-Q16", "exam": 11, "q": 16, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 2, "stem": "<p>A schema owner truncated a table in error and must recover the data.<br/>\nWhich Oracle Flashback feature could be used to recover the data?<\/p>", "options": ["FLASHBACK TABLE", "FLASHBACK DATABASE", "FLASHBACK TRANSACTION", "FLASHBACK DATA ARCHIVE", "FLASHBACK VERSION QUERY"], "correct": [3], "choose": 1, "explain": "", "origNote": "答案疑慮喔" }, { "id": "E11-Q17", "exam": 11, "q": 17, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 2, "stem": "<p>Which four are true about RMAN backup sets? (Choose four.)<\/p>", "options": ["A data file can be split into multiple sections stored in different backup sets.", "A data file can be split into multiple sections stored in different backup pieces in the same backup set.", "A backup set must be written to media.", "A backup set can contain only one backup piece.", "Blocks from multiple data files can be contained in one backup piece.", "A backup piece can belong to only one backup set."], "correct": [1, 2, 4, 5], "choose": 4, "explain": "", "origNote": "答案疑慮喔" }, { "id": "E11-Q18", "exam": 11, "q": 18, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 3, "stem": "<p>choose two Examine these RMAN commands:<br/>\nRMAN&gt; CONNECT TARGET “sbu@prod AS SYSBACKUP“; RMAN&gt; CONNECT AUXILIARY “sbu@dup_db AS SYSBACKUP“; RMAN&gt; DUPLICATE TARGET DATABASE TO dup_db FROM ACTIVE DATABASE PASSWORD FILE SECTION SIZE 400M;<br/>\nWhich two statements are true about the DUPLICATE comman<\/p>", "options": ["No catalogued backup of the TARGET is used to duplicate the database", "It succeed", "Itsucceeds only if the target database is greater than 40", "It fails because no parallel channels are allocated for the auxiliary databa", "It fails because connection to the AUXILIARY instance must be as SYSD"], "correct": [0, 1], "choose": 2, "explain": "", "origNote": "題目不完整" }, { "id": "E11-Q20", "exam": 11, "q": 20, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 3, "stem": "<p><strong>Examine this configuration:<\/strong><\/p>\n<ol role=\"list\" start=\"1\">\n<li>CDB1 is a container database running in ARCHIVELOG mode.<\/li>\n<li>Multiple uncommitted transactions are running in CDB1.<\/li>\n<li>Redo log groups 1 and 2 are INACTIVE.<\/li>\n<li>Redo log group 3 is the CURRENT group.<\/li>\n<li>All members of redo log group 3 are lost before it is archived.<\/li>\n<\/ol>\n<p><strong>Possible steps:<\/strong><\/p>\n<ol role=\"list\" start=\"1\">\n<li>SHUTDOWN ABORT<\/li>\n<li>STARTUP NOMOUNT<\/li>\n<li>STARTUP MOUNT<\/li>\n<li>ALTER DATABASE MOUNT<\/li>\n<li>RESTORE DATABASE<\/li>\n<li>RECOVER DATABASE NOREDO<\/li>\n<li>RECOVER DATABASE UNTIL AVAILABLE<\/li>\n<li>RESTORE ARCHIVELOG ALL<\/li>\n<li>ALTER DATABASE OPEN<\/li>\n<li>ALTER DATABASE OPEN RESETLOGS<\/li>\n<\/ol>\n<p><strong>Choose the minimum required steps in the correct order to recover the database.<\/strong><\/p>\n<p> <\/p>", "options": ["1, 3, 5, 8, 6, 10", "1, 3, 5, 7, 10", "1, 3, 5, 6, 9", "1, 2, 5, 7, 4, 10", "1, 3, 5, 6, 10"], "correct": [4], "choose": 1, "explain": "", "origNote": "答案疑慮喔<br/>查2家AI都是1, 3, 5, 7, 10" }, { "id": "E11-Q21", "exam": 11, "q": 21, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 3, "stem": "<p>Oracle Data Redaction is active on the SCOTT.EMP table. You queried the table twice.<br/>\nSQL&gt; SELECT ENAME, SAL, COMM, MGR, HIREDATE FROM EMP WHERE DEPTNO=30; SQL&gt; SELECT ENAME, SAL, COMM, MGR, HIREDATE FROM EMP WHERE DEPTNO=30;<br/>\nWhich is guaranteed to be true concerning the redaction policy?<\/p>", "options": ["FULL redaction is active on the SAL column", "RANDOM redaction is active on the HIREDATE column", "RANDOM redaction is active on the MGR column", "PARTIAL redaction is active on the MGR column.", "PARTIAL redaction is active of the HIREDATE column."], "correct": [1], "choose": 1, "explain": "", "origNote": "題目不完整" }, { "id": "E11-Q22", "exam": 11, "q": 22, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 3, "stem": "<p>You execute the following code with appropriate privileges to add Oracle Data Redaction policies on the <strong>SCOTT.EMP<\/strong> table and the <strong>SCOTT.EMP_VW<\/strong> view. User SCOTT has been granted the <strong>CREATE SESSION<\/strong> privilege and the <strong>MGR<\/strong> role. Which two statements are true when a session logged in as SCOTT queries the <strong>SAL<\/strong> column in the view and the table?<\/p>", "options": ["Data is redacted for the EMP_V.SAL column only if the SCOTT session does not have the MGR role set. Correct", "DataisredactedfortheEMP.SALcolumnonlyiftheSCOTTsessiondoesnothavetheMGR role set.", "Data is redacted for the EMP_V.SAL column only if the SCOTT session has the MGR role set.", "DataisredactedforEMP.SALcolumnonlyiftheSCOTTsessionhastheMGRroleset.", "Data is never redacted for the EMP_VW.SAL column."], "correct": [1, 4], "choose": 2, "explain": "", "origNote": "題目不完整" }, { "id": "E11-Q23", "exam": 11, "q": 23, "topic": "01_Review_Issues", "topicTitle": "題庫疑慮與不完整題 (Review Issues)", "part": 3, "stem": "<p>Examine this configuration:<\/p>\n<ul role=\"list\">\n<li>CDB1 is a container database.<\/li>\n<li>COMMON_USER_PREFIX is C##.<\/li>\n<li>PDB1 is a pluggable database contained in CDB1.<\/li>\n<li>APP1_ROOT is an application container contained in CDB1.<\/li>\n<li>APP1_PDB1 is an application PDB contained in APP1_ROOT.<\/li>\n<\/ul>\n<p>You execute commands to create users in different contexts.<\/p>\n<p>Which two are true? <em>(Choose two)<\/em><\/p>", "options": ["APP1_USER1 can have different privileges in each Application PDB contained in APP1_ROOT.", "P1_USER1 can be created in CDB1.", "APP1_USER1 can be created in PDB1.", "C##_USER1 will have the same privileges and roles granted in all PDBs in CDB1.", "C##_APP_USER1 can be created in CDB1.", "APP1_USER1 can be created in CDB1."], "correct": [2, 4], "choose": 2, "explain": "", "origNote": "答案有疑慮" }, { "id": "E1-Q26", "exam": 1, "q": 26, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 1, "stem": "<p>Your SALES_ROOT application container has two application PDBs.<br/>\nThe SALES_APP application has a common table, FIN.REVENUE, in the two PDBs.<br/>\nExamine this query and its output:<\/p>\n<p><img decoding=\"async\" src=\"../images/E01_Q026_img1.png\"/><br/>\nWhich two are true? (Choose two.)<\/p>", "options": ["The CONTAINERS clause cannot be used in queries on the REVENUE table.", "The REVENUE table must be a list-partitioned table.", "The MAPTABLE tables defines a logical partition key on a commonly used column for the REVENUE table.", "The MAPTABLE table is a metadata-linked table.", "A container map exists for the REVENUE table, but is not enabled.", "The REVENUE table partitions are not pruned across the PDBs automatically."], "correct": [2, 5], "choose": 2, "explain": "", "origNote": "" }, { "id": "E2-Q15", "exam": 2, "q": 15, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 1, "stem": "<p>HR_ROOT is an application container with the HR_APP application installed.<br/>\nNo application PDBs and no application seed have yet been created in HR_ROOT.<br/>\nAn application PDB, PDB1, must be created so that the HR_APP application?s common objects are accessible to it.<br/>\nWhich two methods can be used? (Choose two.)<\/p>", "options": ["Create an application seed, and install HR_APP in it.", "Create the PDB1 application PDB and install HR_APP in it.", "Create an application seed, synchronize it with HR_ROOT, and then create the PDB1 application PDB.", "Create the PBD1 application PDB and synchronize it with HR_ROOT.", "Create the PBD1 application PDB and synchronize it with PDB$SEED."], "correct": [2, 3], "choose": 2, "explain": "", "origNote": "在 Oracle 12c R2 之後，引入了應用程式容器 (Application Container) 的概念。這是一個專門為特定應用程式（如本題的 HR_APP）設計的微型多租戶環境。<br/><br/>核心架構概念：<br/><br/>Application Root (應用程式根目錄，如 HR_ROOT)： 應用程式的通用物件（Common Objects，如共用的資料表結構、預存程序）安裝在這裡。<br/><br/>Application PDB (應用程式 PDB，如 PDB1)： 實際存放各個租戶/客戶專屬資料的資料庫。它必須連接到 Application Root 才能看到共用的應用程式結構。<br/><br/>Application Seed (應用程式種子)： 這是一個選用的「範本」。如果建立並更新了這個種子，未來建立新的 Application PDB 時速度會非常快，因為可以直接從這個種子複製。<br/><br/>Synchronization (同步)： 當 Application Root 中的應用程式有安裝或升級時，底下的 PDB（或 Seed）必須執行同步指令（ALTER PLUGGABLE DATABASE APPLICATION ... SYNC），才能獲取最新的通用物件。<br/><br/>正確選項解析（建立並讓 PDB 取得應用程式物件的兩種合法途徑）：<br/><br/>D. Create the PBD1 application PDB and synchronize it with HR_ROOT. (直接建立 PDB1 並與 HR_ROOT 同步)<br/>正確（直接法）。 您可以直接在 HR_ROOT 底下建立一個新的 Application PDB (PDB1)。建立完成後，由於它剛誕生，還不知道 HR_APP 的存在，因此您必須手動對 PDB1 執行同步作業，讓它從 HR_ROOT 擷取 HR_APP 的通用物件。<br/><br/>C. Create an application seed, synchronize it with HR_ROOT, and then create the PDB1 application PDB. (建立應用程式種子，將其與 HR_ROOT 同步，然後建立 PDB1)<br/>正確（範本法）。 這是適合大規模部署的做法。您先建立一個 Application Seed，將其與 HR_ROOT 同步（讓種子內包含 HR_APP 的物件）。接著，當您建立 PDB1 時，Oracle 會自動從這個已經同步好的種子進行複製。因此 PDB1 建立好就自帶應用程式物件，不需要再對 PDB1 額外做同步。<br/><br/>錯誤選項解析：<br/><br/>A. (建立應用程式種子，並在其中安裝 HR_APP)<br/>錯誤。 應用程式（HR_APP）必須且已經安裝在 Application Root (HR_ROOT) 中。您不能也不需要在 Seed 裡面「安裝」應用程式，Seed 只能透過「同步」來取得 Root 的結構。<br/><br/>B. (建立 PDB1 並在其中安裝 HR_APP)<br/>錯誤。 與 A 的理由相同。Application PDB 只是用來放租戶的私有資料，應用程式的主體架構是統一安裝在 Root 層級的，PDB 只能透過同步來存取。如果在 PDB 內安裝，它就變成該 PDB 專屬的本地應用程式，失去了 Application Container 共用管理的意義。<br/><br/>E. (建立 PDB1 並與 PDB$SEED 同步)<br/>錯誤。 PDB$SEED 是整個 CDB（容器資料庫）最底層的標準全域範本。如果要獲取特定應用程式 (HR_APP) 的變更，必須與該應用程式的專屬根目錄 (HR_ROOT) 同步，與全域的 PDB$SEED 同步是無效且不合邏輯的。" }, { "id": "E4-Q13", "exam": 4, "q": 13, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 1, "stem": "<p>Which two are true about common objects? (Choose two.)<\/p>", "options": ["They can exist in user-defined schemas only in application containers.", "They can be only metadata-linked in an application container.", "They can exist in CDB$ROOT and an application root.", "They can be created only in CDB$ROOT.", "They can be extended data-linked in CDB$ROOT.", "They can be created only in an application root."], "correct": [2, 5], "choose": 2, "explain": "", "origNote": "They can exist in CDB<br/>𝑅<br/>𝑂<br/>𝑂<br/>𝑇<br/>𝑎<br/>𝑛<br/>𝑑<br/>𝑎<br/>𝑛<br/>𝑎<br/>𝑝<br/>𝑝<br/>𝑙<br/>𝑖<br/>𝑐<br/>𝑎<br/>𝑡<br/>𝑖<br/>𝑜<br/>𝑛<br/>𝑟<br/>𝑜<br/>𝑜<br/>𝑡<br/>.<br/>(<br/>它們可以存在於<br/>𝐶<br/>𝐷<br/>𝐵<br/>ROOTandanapplicationroot.(它們可以存在於CDBROOT 和應用程式根目錄中)<br/><br/>原因： Oracle 的共同物件主要分為兩類。第一類是 Oracle 內建提供的共同物件（例如系統資料表 OBJ$ 或資料字典視圖 DBA_OBJECTS），這些物件存在於根容器 (CDB$ROOT) 中，並分享給所有的 PDB。第二類是 使用者自訂的應用程式共同物件，這些物件存在於應用程式容器的根目錄 (Application Root) 中，並分享給該應用程式的 PDB。因此，共同物件確實可以存在於這兩個層級的 Root 當中。<br/><br/>They can be created only in an application root. (它們只能在應用程式根目錄中建立)<br/><br/>原因： 這裡指的是「使用者自訂 (User-defined)」的共同物件。為了保護 CDB$ROOT 的系統完整性並避免干擾整個資料庫，Oracle 不允許一般使用者直接在 CDB$ROOT 建立自訂的共同物件。如果您希望建立自己的共同物件供多個 PDB 使用，您必須建立一個 Application Container，並且只能在 Application Root 中（透過 ALTER PLUGGABLE DATABASE APPLICATION ... BEGIN INSTALL 語法）來建立這些自訂的共同物件。<br/><br/>為什麼其他選項是錯的？<br/><br/>They can exist in user-defined schemas only in application containers. (錯，CDB$ROOT 內的系統 schema 如 SYS 也有共同物件)<br/><br/>They can be only metadata-linked in an application container. (錯，在 Application Container 中，共同物件可以是 metadata-linked、data-linked 或 extended data-linked。)<br/><br/>They can be created only in CDB$ROOT. (錯，如上所述，使用者無法在 CDB$ROOT 建立共同物件，只能在 Application Root 建立。)<br/><br/>They can be extended data-linked in CDB$ROOT. (錯，使用者不能在 CDB$ROOT 建立任何 data-linked 或 extended data-linked 的物件。)" }, { "id": "E4-Q29", "exam": 4, "q": 29, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 1, "stem": "<p>Which three are true about an application seed pluggable database (PDB)? (Choose three.)<\/p>", "options": ["It is automatically synchronized with its application root PDB when an application is upgraded.", "A new application PDB created by cloning an application seed PDB can have an old version of the application installed after cloning completes.", "It is not required in an application container.", "It cannot be dropped from its application container.", "It cannot be added to an application container after the application container has already been created.", "A new application PDB created by cloning an application seed PDB can have an up-to-date version of the application installed after cloning completes."], "correct": [1, 2, 5], "choose": 3, "explain": "", "origNote": "It is not required in an application container. (在應用程式容器中，它並非必須存在)" }, { "id": "E5-Q31", "exam": 5, "q": 31, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 1, "stem": "<p><strong>Your SALES_ROOT application container has two application PDBs. <\/strong><\/p>\n<p><strong>The SALES_APP application has a common table, FIN.REVENUE, in the two PDBs. <\/strong><\/p>\n<p><strong>Examine this query and its output:<\/strong><\/p>\n<p><strong><img class=\"wp-image-294410\" decoding=\"async\" height=\"175\" src=\"../images/E05_Q031_img1.png\" width=\"947\"/><\/strong><\/p>\n<p><strong>Which two are true? (Choose two.)<\/strong><\/p>", "options": ["The MAPTABLE table is a metadata-linked table.", "The MAPTABLE tables defines a logical partition key on a commonly used column for the REVENUE table.", "A container map exists for the REVENUE table, but is not enabled.", "The REVENUE table partitions are not pruned across the PDBs automatically.", "The CONTAINERS clause cannot be used in queries on the REVENUE table.", "The REVENUE table must be a list-partitioned table."], "correct": [1, 3], "choose": 2, "explain": "", "origNote": "難，考前看，有時間實作一下" }, { "id": "E6-Q40", "exam": 6, "q": 40, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 1, "stem": "<p>The HR_ROOT application container must support the execution of a query on a table shared by application local PDBs PDB1 and PDB2, and remote PDB PDB3. Which three are true? (Choose three.)<\/p>", "options": ["A database link must exist in the remote CDB referring to the local CDB.", "A proxy PDB must exist in the application root in the local CDB.", "PDB3‘s application root replica must exist in the local CDB.", "A proxy PDB must exist in the application root in the remote CDB.", "The HR_ROOT replica must exist in the remote CDB.", "A database link must exist in the local CDB root referring to the remote CDB."], "correct": [1, 4, 5], "choose": 3, "explain": "", "origNote": "The HR_ROOT replica must exist in the remote CDB. (HR_ROOT 的複本必須存在於遠端 CDB 中)<br/>既然遠端的 PDB3 要能讀懂 HR_ROOT 這個應用程式的共用結構 (例如共用資料表或視圖)，遠端的 CDB 裡就不能只有 PDB3，它必須擁有一個 HR_ROOT 的應用程式根目錄複本 (Application Root Replica)。有了這個複本，PDB3 才能正確同步應用程式的 Metadata。" }, { "id": "E7-Q17", "exam": 7, "q": 17, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 2, "stem": "<p><strong>Your SALES_ROOT application container has two application PDBs. The SALES_APP application has a common table, FIN.REVENUE, in the two PDBs. Examine this query and its output:<\/strong><\/p>\n<p><strong><img class=\"wp-image-294410\" decoding=\"async\" height=\"172\" src=\"../images/E07_Q017_img1.png\" width=\"931\"/><\/strong><\/p>\n<p> <\/p>\n<p><strong>Which two are true? (Choose two.)<\/strong><\/p>", "options": ["The MAPTABLE table is a metadata-linked table.", "The REVENUE table must be a list-partitioned table.", "The REVENUE table partitions are not pruned across the PDBs automatically.", "A container map exists for the REVENUE table, but is not enabled.", "The MAPTABLE tables defines a logical partition key on a commonly used column for the REVENUE table."], "correct": [2, 4], "choose": 2, "explain": "", "origNote": "我要實作一下" }, { "id": "E8-Q2", "exam": 8, "q": 2, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 2, "stem": "<p>The HR_ROOT application container must support the execution of a query on a table shared by application local PDBs PDB1 and PDB2, and remote PDB PDB3. Which three are true? (Choose three.)<\/p>", "options": ["A database link must exist in the remote CDB referring to the local CDB.", "A proxy PDB must exist in the application root in the local CDB.", "The HR_ROOT replica must exist in the remote CDB.", "A proxy PDB must exist in the application root in the remote CDB.", "PDB3s application root replica must exist in the local CDB.", "A database link must exist in the local CDB root referring to the remote CDB."], "correct": [1, 2, 5], "choose": 3, "explain": "", "origNote": "The HR_ROOT replica must exist in the remote CDB. (HR_ROOT 複本必須存在於遠端 CDB 中。)<br/>遠端需要什麼 (Replica)： PDB3 雖然在遠端的 CDB，但它依然屬於 HR_ROOT 這個應用程式的一份子。為了讓遠端 CDB 知道如何管理這個應用程式的共通物件與元資料，您必須在遠端 CDB 建立一個 HR_ROOT 的「複本 (Replica)」。" }, { "id": "E8-Q31", "exam": 8, "q": 31, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 2, "stem": "<p><strong>Examine this configuration:<\/strong><\/p>\n<p><strong><img class=\"wp-image-294411\" decoding=\"async\" height=\"713\" src=\"../images/E08_Q031_img1.jpeg\" width=\"635\"/><\/strong><\/p>\n<p><strong>CDB1 is a container database. APP_ROOT is an application root in CDB1. APP_PDB1 is an application PDB in APP_ROOT. FLASHBACK DATABASE is ON. You execute these commands: Which table or set of tables will exist after the Flashback operation has completed?<\/strong><\/p>", "options": ["none of the tables, because all three tables will be dropped", "CDB1_TAB and APP_ROOT_TAB", "CDB1_TAB and APP_PDB1_TAB", "CDB1_TAB, APP_ROOT_TAB, and APP_PDB1_TAB", "CDB1_TAB only"], "correct": [2], "choose": 1, "explain": "", "origNote": "注意此題型" }, { "id": "E9-Q16", "exam": 9, "q": 16, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 2, "stem": "<p>Which three are true about upgrading an application in an application container? (Choose three.)<\/p>", "options": ["After an application upgrade, the application containers PDBs are automatically synchronized with the application root clone", "The upgrade can be performed when connected either to CDB$ROOT or to PDB$SEED", "An application root clone gets created automatically", "An application name and version number must be specified to upgrade the application", "The upgrade must be performed when connected to CDB$ROOT", "After an application upgrade, the application container's PDB's remain synchronized with the existing application root"], "correct": [2, 3, 5], "choose": 3, "explain": "", "origNote": "新題型<br/>自動建立 Clone 確保服務不中斷： 當您在 Application Root 執行 ALTER PLUGGABLE DATABASE APPLICATION &lt;名稱&gt; BEGIN UPGRADE ... 時，Oracle 為了不影響底下正在運作的 Application PDBs，會在背景自動建立一個隱藏的 Application Root Clone。這個 Clone 保存了升級前的舊版本結構與資料。<br/>明確的語法要求： 在執行升級指令時，語法強制要求您必須指名道姓：要升級「哪一個應用程式 (Name)」，以及要升級到「哪一個新版本 (Version)」，例如 ... BEGIN UPGRADE '1.0' TO '2.0'。<br/>PDB 的延遲同步特性： 當 Application Root 完成升級後，底下的 PDB 不會跟著自動升級。它們會自動指向剛才建立的那個 Clone (也就是維持在升級前的 existing 狀態繼續運作)。直到 DBA 準備好，手動連線進各個 PDB 執行 SYNC 指令時，PDB 才會真正套用新版本的變更。<br/>錯誤選項陷阱分析 (為什麼其他不能選)：<br/>...PDBs are automatically synchronized with the application root clone.<br/>錯誤原因： 這是一個文字陷阱。PDBs 是「繼續指向/依附」於那個 Clone 運作，而不是發生了「自動同步 (automatically synchronized)」的動作。在多租戶架構的術語中，「同步 (Sync)」通常意指主動去拉取並套用新的變更。<br/>The upgrade can be performed when connected either to CDB<br/>ROOTortoPDBSEED.<br/>The upgrade must be performed when connected to CDB$ROOT.<br/>錯誤原因： 連線的上下文 (Context) 完全錯誤。應用程式是安裝在特定的 Application Root 裡面（例如名為 APP_ROOT 的容器），因此升級操作必須連線到該 Application Root 內部執行，絕對不能在全域的 CDB$ROOT 或範本 PDB$SEED 中執行。" }, { "id": "E11-Q29", "exam": 11, "q": 29, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 2, "stem": "<p>Your SALES_ROOT application container has two application PDBs.<br/>The SALES_APP application has a common table, FIN.REVENUE, in the two PDBs.<br/>Examine this query and its output:<br/>SELECT containers_ default, container_map, table_name<br/>     FROM dba_tables WHERE owner=‘FIN‘ ;<br/>CONTAINERS_DEFAULT        CONTAINER_MAP        CONTAINER_MAP_OBJECT            TABLE_NAME<br/>————————————————————————————————————-<br/>            No                                                    Yes                                            No                                        REVENUE<br/>            No                                                     No                                            Yes                                        MAPTABLE<br/>Which two are true? (Choose two.)<\/p>", "options": ["The REVENUE table must be a list-partitioned table.", "The MAPTABLE table is a metadata-linked table.", "The CONTAINERS clause cannot be used in queries on the REVENUE table.", "A container map exists for the REVENUE table, but is not enabled.", "The MAPTABLE tables defines a logical partition key on a commonly used column for the REVENUE table.", "The REVENUE table partitions are not pruned across the PDBs automatically."], "correct": [4, 5], "choose": 2, "explain": "", "origNote": "題型要搞懂" }, { "id": "E11-Q30", "exam": 11, "q": 30, "topic": "02_Application_Container", "topicTitle": "Application Container 應用程式容器", "part": 2, "stem": "<p>The HR_ROOT application container must support the execution of a query on a table shared by application local PDBs PDB1 and PDB2, and remote PDB PDB3.<br/>Which three are true? (Choose three.)<\/p>", "options": ["A proxy PDB must exist in the application root in the remote CDB.", "The HR_ROOT replica must exist in the remote CDB.", "A database link must exist in the remote CDB referring to the local CDB.", "PDB3‘s application root replica must exist in the local CDB.", "A proxy PDB must exist in the application root in the local CDB.", "A database link must exist in the local CDB root referring to the remote CDB."], "correct": [1, 4, 5], "choose": 3, "explain": "", "origNote": "把 HR_ROOT 想像成一家企業的「人資總部」，而各個 PDB 就是底下的「分店」。<br/><br/>本機端 (Local CDB)： 就像是台北總公司大樓。裡面有「人資總部 (HR_ROOT)」，以及它直轄的一號分店 (PDB1) 與二號分店 (PDB2)。<br/><br/>遠端端 (Remote CDB)： 就像是高雄分公司大樓。我們想在那邊開一家隸屬於人資部門的三號分店 (PDB3)。<br/><br/>為什麼高雄大樓必須要有 HR_ROOT Replica (總部複本)？<br/><br/>分店不能沒有直屬上司： 高雄的三號分店 (PDB3) 不能孤零零地隨便塞在大樓裡，它必須要有上級單位。所以，台北總部必須在高雄先設立一個「人資總部駐高雄辦事處」（這就是 HR_ROOT Replica）。有了辦事處，三號分店才能掛牌營業。<br/><br/>規章制度要自動同步： 台北總公司如果修改了員工守則或共用表單（共用資料表與結構），總部會自動把新規定派發給「駐高雄辦事處 (Replica)」。這樣一來，高雄的三號分店就能直接從辦事處拿到最新規定，不用大老遠連線回台北要資料。<br/><br/>總部要查帳 (跨庫查詢的對口)： 當台北總部想要查高雄三號分店的資料時，台北會派一個「代理專員」(Proxy PDB) 打電話 (Database Link) 到高雄。這通電話必須要有「駐高雄辦事處 (Replica)」來接聽並解析指令，才能指揮底下的三號分店交出資料。<br/><br/>遠端的資料庫不能只放一個小分店 (PDB3)，必須連同「帶隊的主管機構」(HR_ROOT Replica) 一起建置過去，這樣分店才有規矩可循，總部也才有對口可以溝通。" }, { "id": "E1-Q29", "exam": 1, "q": 29, "topic": "03_Flashback", "topicTitle": "Flashback 閃回技術", "part": 1, "stem": "<p>Which three are true about requirements for various FLASHBACK operations? (Choose three.)<\/p>", "options": ["FLASHBACK transaction query requires undo to retrieve all versions of a row that existed between two points in time.", "FLASHBACK drop requires that the RECYCLEBIN parameter be set to ON.", "FLASHBACK version query requires that the RECYCLEBIN parameter be set to ON.", "FLASHBACK DATA ARCHIVE requires undo to store all versions of all rows of a table being tracked.", "FLASHBACK drop requires undo to retrieve all versions of a row that existed between two points in time.", "FLASHBACK version query requires undo to retrieve all versions of a row that existed between two points in time."], "correct": [0, 1, 5], "choose": 3, "explain": "", "origNote": "觀念要釐清" }, { "id": "E1-Q43", "exam": 1, "q": 43, "topic": "03_Flashback", "topicTitle": "Flashback 閃回技術", "part": 1, "stem": "<p>Which two are true about flashback features in Oracle Database 19c and later releases? (Choose two.)<\/p>", "options": ["Flashback logs are automatically purged when DB_FLASHBACK_RETENTION_TARGET is set lower than the time they have already been retained.", "Flashback logs are monitored and proactively deleted when beyond the retention period defined in DB_FLASHBACK_RETENTION_TARGET only after there is space pressure.", "Flashback logs are monitored and proactively deleted when beyond the retention period defined in DB_FLASHBACK_RETENTION_TARGET before there is space pressure.", "Flashback logs are monitored for being older than the retention period defined in DB_FLASHBACK_RETENTION_TARGET and can be deleted by an administrator written event trigger.", "Flashback logs are automatically purged whenever the value of DB_FLASHBACK_RETENTION_TARGET is changed."], "correct": [0, 2], "choose": 2, "explain": "", "origNote": "beyond=&gt;超過 ,proactively =&gt;主動<br/>A. 當 DB_FLASHBACK_RETENTION_TARGET 的設定值被調低（低於目前日誌已保留的時間）時，Flashback 日誌會被自動清除。<br/><br/>說明： 假設你原本設定保留 24 小時，系統裡存滿了 24 小時的日誌。如果你突然把這個參數改成只保留 12 小時，那麼系統發現有 12 小時的日誌「已經超過你現在的目標」了，它就會自動清理掉那些多出來的、過期的日誌來釋放空間。<br/><br/>C. 當 Flashback 日誌超過 DB_FLASHBACK_RETENTION_TARGET 所定義的保留期限時，系統會在「面臨空間壓力之前」就主動監控並刪除它們。<br/><br/>說明： 這是 Oracle 自動儲存管理的優點。系統是主動（proactively）在做大掃除的，只要日誌過了你的保留期限，它就會把它們清掉，而不會等到 FRA 空間快被塞爆了（space pressure）才手忙腳亂地去清。<br/><br/>為什麼其他選項是錯的？<br/>B 錯誤： 選項說「只有在面臨空間壓力（space pressure）之後，才會刪除超過保留期限的日誌」。<br/><br/>真相： 剛好與選項 C 相反，Oracle 是未雨綢繆的，不會等到空間不足才去清理過期的日誌。<br/><br/>D 錯誤： 選項說「可以透過管理員撰寫的事件觸發程序 (event trigger) 來刪除」。<br/><br/>真相： 清理過期的 Flashback 日誌完全是 Oracle 內部背景行程自動管理的機制，不需要、也不應該由 DBA 去寫什麼觸發程式來做這件事。<br/><br/>E 錯誤： 選項說「只要 DB_FLASHBACK_RETENTION_TARGET 的值被改變，Flashback 日誌就會被自動清除」。<br/><br/>真相： 只有當你把參數調低（如選項 A 所述），導致現有日誌超過新標準時，才會觸發清理。如果你是把參數從 12 小時調高到 24 小時，系統當然不會去清除現有的日誌，反而會開始保留更多。" }, { "id": "E2-Q56", "exam": 2, "q": 56, "topic": "03_Flashback", "topicTitle": "Flashback 閃回技術", "part": 1, "stem": "<p>Your database is in ARCHIVELOG mode and you plan to use Flashback Database.<br/>Which two features or parameters manage space availability in the fast recovery area? (Choose two.)<\/p>", "options": ["the archived log deletion policy", "the backup optimization policy", "the backup retention policy", "using guaranteed UNDO retention", "the DB_CREATE_ONLINE_LOG_DEST_n parameter setting", "the DB_RECOVERY_FILE_DEST parameter setting"], "correct": [0, 2], "choose": 2, "explain": "", "origNote": "F. the DB_RECOVERY_FILE_DEST parameter setting (參數 DB_RECOVERY_FILE_DEST)<br/>這是一個常見的陷阱選項。這個參數只是用來「指定 FRA 的實體路徑位置」（搭配 DB_RECOVERY_FILE_DEST_SIZE 指定上限大小），它本身並沒有管理或決定「哪些檔案可以被刪除以釋放空間」的邏輯。空間的釋放邏輯是由選項 A 和 C 的策略所主導的。" }, { "id": "E9-Q19", "exam": 9, "q": 19, "topic": "03_Flashback", "topicTitle": "Flashback 閃回技術", "part": 1, "stem": "<p>You have an Active DataGuard configuration having one primary and one standby database. The standby database is open in read only mode and in sync with primary. To recover from erroneous transaction, you need to flashback the whole database configuration to a past time. Which methods of flashback operation are correct in this scenario? (Choose two.)<\/p>", "options": ["Shut down and startup mount the standby database. Flashback the primary database to required time and it will flashback the standby database automatically.", "Flashback the standby database to few seconds prior to required time. Flashback the primary database to required time.", "Flashback the primary database to required time and it will flashback the standby database automatically without any additional steps.", "Flashback the primary database to required time. Flashback the standby database to few seconds prior to required time."], "correct": [0, 1], "choose": 2, "explain": "", "origNote": "自動跟隨 (重啟至 Mount)： 當主資料庫執行 Flashback 並以 RESETLOGS 開啟後，會產生新的資料庫化身 (Incarnation)。如果您事先將備用資料庫關閉並重新啟動至 MOUNT 狀態，當備用資料庫的 MRP (Managed Recovery Process) 接收到主庫閃回的標記時，它夠聰明，會自動在背景執行 Flashback 來跟隨主庫，不需要您手動對備庫下達 Flashback 指令。<br/>手動閃回 (安全距離)： 另一個標準做法是 DBA 手動介入。您可以先將備用資料庫手動 Flashback 到「比主庫目標時間點稍微早一點點 (few seconds prior)」的時間。接著主庫再進行 Flashback 與 Resetlogs。當備庫啟動 MRP 後，它會自動向主庫請求並套用新的 Redo，完美接軌。<br/>錯誤選項陷阱分析 (為什麼您的選項不能選)：<br/>...it will flashback the standby database automatically without any additional steps. (您誤選的項目)<br/>錯誤原因： 陷阱在於題幹特別標明了備用資料庫目前是 \"open in read only mode\" (Active Data Guard 狀態)。Oracle 絕對無法對一個正在開啟 (Open) 狀態的資料庫自動執行 Flashback。如果您沒有做「任何額外步驟 (例如關閉它)」，備庫的 MRP 遇到閃回標記時只會直接中止 (Abort) 並報錯，而不會自動閃回。<br/>Flashback the primary database to required time. Flashback the standby database to few seconds prior to required time.<br/>錯誤原因： 這個順序不佳。如果主庫先 Flashback 並產生了新的化身與日誌，而備庫還在舊的狀態，備庫可能會因為接收不到連續的日誌而發生混亂。最佳實務是先處理備庫 (或讓備庫處於 Mount 準備狀態)，再來 Flashback 主庫。" }, { "id": "E9-Q34", "exam": 9, "q": 34, "topic": "03_Flashback", "topicTitle": "Flashback 閃回技術", "part": 1, "stem": "<p>Which two are true about reclaiming space used by Flashback logs in Oracle Database 19c and later releases? (Choose two.)<\/p>", "options": ["Space might be reclaimed automatically when the retention period for Flashback logs is lowered.", "Space is always reclaimed proactively before space pressure occurs.", "Space is always reclaimed automatically when the retention period for Flashback logs is lowered.", "Space is only reclaimed when there is space pressure in the Fast Recovery Area. (FRA)", "Space might be reclaimed proactively before space pressure occurs."], "correct": [1, 2], "choose": 2, "explain": "", "origNote": "is always 還是  might be" }, { "id": "E9-Q44", "exam": 9, "q": 44, "topic": "03_Flashback", "topicTitle": "Flashback 閃回技術", "part": 1, "stem": "<p>Which two are true about flashback features in Oracle Database 19c and later releases? (Choose two.)<\/p>", "options": ["Flashback logs are automatically purged whenever the value of DB_FLASHBACK_RETENTION_TARGET is changed.", "Flashback logs are monitored and proactively deleted when beyond the retention period defined in DB_FLASHBACK_RETENTION_TARGET only after there is space pressure.", "Flashback logs are monitored and proactively deleted when beyond the retention period defined in DB_FLASHBACK_RETENTION_TARGET before there is space pressure.", "Flashback logs are monitored for being older than the retention period defined in DB_FLASHBACK_RETENTION_TARGET and can be deleted by an administrator written event trigger.", "Flashback logs are automatically purged when DB_FLASHBACK_RETENTION_TARGET is set lower than the time they have already been retained."], "correct": [2, 4], "choose": 2, "explain": "", "origNote": "注意題型" }, { "id": "E11-Q1", "exam": 11, "q": 1, "topic": "03_Flashback", "topicTitle": "Flashback 閃回技術", "part": 1, "stem": "<p>Which two are true about reclaiming space used by Flashback logs in Oracle Database 19c and later releases? (Choose two.)<\/p>", "options": ["Space is only reclaimed when there is space pressure in the Fast Recovery Area. (FRA)", "Space might be reclaimed proactively before space pressure occurs.", "Space is always reclaimed proactively before space pressure occurs.", "Space might be reclaimed automatically when the retention period for Flashback logs is lowered.", "Space is always reclaimed automatically when the retention period for Flashback logs is lowered."], "correct": [2, 4], "choose": 2, "explain": "", "origNote": "might be &amp; always" }, { "id": "E1-Q36", "exam": 1, "q": 36, "topic": "04_Duplicate_Transport", "topicTitle": "資料庫複製與搬移 (Duplicate / Transport / Data Pump)", "part": 1, "stem": "<p>You must transport the UNIVERSITY tablespace from one database to another.<br/>The UNIVERSITY tablespace is currently open read/write.<br/>The source and destination platforms have different endian formats.<br/>Examine this list of actions:<br/>1. Make the UNIVERSITY tablespace read-only on the source system.<br/>2. Export the UNIVERSITY tablespace metadata using EXPDP.<br/>3. Convert the UNIVERSITY tablespace data files to the destination platform format using RMAN on the source system.<br/>4. Copy the UNIVERSITY tablespace data files to the destination system.<br/>5. Copy the Data Pump dump set to the destination system.<br/>6. Convert the UNIVERSITY tablespace data files to the destination platform format using RMAN on the destination system.<br/>7. Import the UNIVERSITY tablespace metadata using IMPDP.<br/>8. Make the UNIVERSITY tablespace read/write on the destination system.<br/>Which is the minimum number of actions required, in the correct order, to transport the UNIVERSITY tablespace?<\/p>", "options": ["1, 2, 4, 5, 7, 8", "1, 2, 4, 6, 7, 8", "1, 2, 3, 4, 5, 7, 8", "1, 2, 3, 4, 5, 6, 7, 8", "2, 4, 5, 6, 7"], "correct": [2], "choose": 1, "explain": "", "origNote": "這題考的是 Oracle 跨平台傳輸表空間（Transportable Tablespace, TTS），而且題目特別設下陷阱：兩邊作業系統的「字節序（Endian format）不同」。<br/><br/>為你總結必記的 4 大核心觀念與標準流程：<br/><br/>1. 鎖定資料（起手式必備）<br/>動作： 必須先將來源表空間設為 READ ONLY。<br/><br/>考點： 沒有這一步，就無法保證搬移時資料的一致性。（選項 E 直接淘汰，因為它跳過了這步）。<br/><br/>2. 分工合作 (Metadata vs. 實體檔案)<br/>搬移表空間要處理兩條線：<br/><br/>Metadata（中繼資料）： 用 EXPDP 匯出成 Dump 檔，搬到新機器後用 IMPDP 匯入。<br/><br/>實體檔案（Datafiles）： 因為兩邊平台的 Endian 格式不同（例如大端序轉小端序），必須使用 RMAN (CONVERT TABLESPACE) 進行格式轉換，否則新系統會讀成亂碼。（選項 A 淘汰，因為它完全沒做轉換）。<br/><br/>3. 轉換只需做「一次」，檔案都要「一起搬」<br/>考點 1： RMAN 轉換可以在來源端做，也可以在目的端做，但只需要做一次！（選項 D 淘汰，因為它在兩邊各做了一次轉換）。<br/><br/>考點 2： 轉換好的「Datafile」跟 EXPDP 匯出的「Dump 檔」，這兩個東西都要複製過去目的端。（選項 B 淘汰，因為它忘記把 Dump 檔複製過去）。<br/><br/>4. 上線啟用（收尾）<br/>動作： 在目的端用 IMPDP 掛載成功後，將表空間改回 READ WRITE，大功告成。" }, { "id": "E2-Q17", "exam": 2, "q": 17, "topic": "04_Duplicate_Transport", "topicTitle": "資料庫複製與搬移 (Duplicate / Transport / Data Pump)", "part": 1, "stem": "<p>You plan to perform cross-platform PDB transport using XTTS.<br/>\nWhich two are true? (Choose two.)<\/p>", "options": ["A backup of the PDB must exist, taken using the BACKUP command with the TO PLATFORM clause.", "The source PDB must be in MOUNT state.", "The source PDB must not be an application root.", "The source PDB can be in MOUNT or OPEN state.", "The source and target platforms must have the same endianness.", "Automatic conversion of endianness occurs."], "correct": [1, 4], "choose": 2, "explain": "", "origNote": "XTTS 是 Cross-Platform Transportable Tablespaces" }, { "id": "E2-Q30", "exam": 2, "q": 30, "topic": "04_Duplicate_Transport", "topicTitle": "資料庫複製與搬移 (Duplicate / Transport / Data Pump)", "part": 1, "stem": "<p>Which four are true about a Recovery Manager (RMAN) duplication without a TARGET connection? (Choose three correct options.)<\/p>", "options": ["The NOREDO clause must be used if the backups of the database being duplicated were taken when the database was in NOARCHIVELOG mode.", "The UNDO TABLESPACE clause is always required when no connection exists to the TARGET instance.", "RMAN ?pushes? the backups of the database to be duplicated over the network to the auxiliary instance.", "The UNDO TABLESPACE clause is always required when no connection exists to the recovery catalog and the TARGET database is closed.", "The UNDO TABLESPACE clause is always required when no connection exists to the recovery catalog and the TARGET database is opened.", "RMAN disk-based backups of the database to be duplicated can be used by the auxiliary instance."], "correct": [0, 1, 5], "choose": 3, "explain": "", "origNote": "這題（Question 30）的核心在考驗 「在沒有連接來源資料庫（Without a TARGET connection）的情況下，RMAN 複製（Duplicate）的運作規則」。<br/><br/>為您將這題的正確觀念與易錯陷阱統整如下：<br/><br/>核心觀念：沒有 TARGET 連線代表什麼？<br/>RMAN 無法連線到「活著的」來源資料庫，所以無法直接詢問來源端的架構或即時傳送資料。它必須完全依賴存放在磁碟上的備份檔案來憑空建立出一個新的輔助例項（Auxiliary Instance）。<br/><br/>✅ 正確選項解析 (A, B, F)：<br/><br/>[選項 F] 備份來源限制： 因為沒有來源資料庫可以連線，輔助例項（新資料庫）必須直接讀取、使用指定的 磁碟備份（RMAN disk-based backups），例如 Backup sets 或 Image copies 來進行複製。<br/><br/>[選項 B] 必須指定 UNDO TABLESPACE： 由於無法向來源資料庫查詢 Undo 表格空間的設定（metadata），因此在下達 DUPLICATE 指令時，強制規定必須手動加上 UNDO TABLESPACE 子句，告訴新資料庫要建立什麼名稱的 Undo。<br/><br/>[選項 A] NOARCHIVELOG 模式必須加上 NOREDO： 如果你使用的這個備份，當初是在 NOARCHIVELOG 模式下拍的，代表沒有歸檔日誌（Archivelog）可以做復原。因此複製時必須加上 NOREDO 子句，告訴 RMAN 不要嘗試套用 Redo。<br/><br/>❌ 錯誤選項陷阱 (C, D, E)：<br/><br/>[選項 C] 網路傳輸是 Pull 而不是 Push（你的提問點）： 題目敘述 RMAN 會把備份「Push（推）」過去是錯的。因為沒有連接來源端，實際上是由新的輔助例項自己去指定的路徑把備份給「Pull（拉）」過來。<br/><br/>[選項 D &amp; E] Recovery Catalog 狀態混淆： 這兩個選項把「沒有連接 Recovery Catalog」和「Target 開啟/關閉狀態」與 UNDO TABLESPACE 綁在一起，這是錯誤的觀念拼湊。需要 UNDO TABLESPACE 的唯一原因是沒有 TARGET 連線，跟 Catalog 或 Target 的狀態無關。" }, { "id": "E2-Q51", "exam": 2, "q": 51, "topic": "04_Duplicate_Transport", "topicTitle": "資料庫複製與搬移 (Duplicate / Transport / Data Pump)", "part": 1, "stem": "<p>Which three are true in Oracle 19c and later releases? (Choose three.)<\/p>", "options": ["Tablespaces never remain in read/write mode during transportable tablespace operations.", "A transportable data pump import can leave a plugged-in tablespace in read-only mode.", "A transportable data pump import can leave a plugged-in tablespace in read/write mode.", "Simultaneous data pump jobs can be limited at the pluggable database (PDB) level.", "Tablespaces always remain in read/write mode during transportable tablespace operations.", "An ordinary data pump export of a table with encrypted columns will always encrypt the same columns when imported."], "correct": [1, 2, 3], "choose": 3, "explain": "", "origNote": "表空間狀態具備高度彈性 (對應選項 B 與 C)<br/>Data Pump 匯入表空間後，該表空間的最終狀態可以是「讀寫 (Read/Write)」，也可以是「唯讀 (Read-Only)」。<br/><br/>實務盲點釐清：Data Pump 預設會將其自動轉為「讀寫」；若要讓它最終「保持在唯讀狀態」，實務上通常是 DBA 在匯入後手動補上 ALTER TABLESPACE ... READ ONLY 指令來達成。考題文字 (\"can leave\") 只是在強調系統允許並支援這種最終狀態。<br/><br/>PDB 層級的資源控管 (對應選項 D)<br/>為了防止單一 PDB 耗盡整個容器資料庫 (CDB) 的資源，Oracle 允許在 PDB 層級設定參數（MAX_DATAPUMP_JOBS_PER_PDB），來精準限制該 PDB 可以同時執行的 Data Pump 作業數量。<br/><br/>PDB 狀態與表空間狀態不可混淆 (延伸觀念)<br/>即便您希望匯入的「表空間」最終是唯讀的，在執行匯入動作的當下，接收它的 PDB 必須處於可讀寫 (Read/Write) 狀態，因為系統需要寫入 Metadata (資料字典) 才能完成掛載。不能直接將表空間匯入到一個處於唯讀狀態的 PDB 中" }, { "id": "E5-Q18", "exam": 5, "q": 18, "topic": "04_Duplicate_Transport", "topicTitle": "資料庫複製與搬移 (Duplicate / Transport / Data Pump)", "part": 1, "stem": "<p>Which two are true about duplicating pluggable databases (PDBs) with RMAN? (Choose two.)<\/p>", "options": ["All tablespaces belonging to a PDB must be duplicated when duplicating the PDB.", "The auxiliary instance is automatically created with ENABLE_PLUGGABLE_DATABASE = TRUE.", "Two or more PDBs can be duplicated with the same RMAN DUPLICATE command.", "A user with SYSDBA or SYSBACKUP must be logged in with RMAN to the PDB to duplicate it.", "CDB$ROOT and PDB$SEED are automatically duplicated."], "correct": [2, 4], "choose": 2, "explain": "", "origNote": "The auxiliary instance is automatically created with ENABLE_PLUGGABLE_DATABASE = TRUE. (您誤踩的陷阱)   錯誤原因： RMAN 不會「自動」幫你建立輔助執行個體 (Auxiliary Instance) 並設定這個參數。在敲下 DUPLICATE 指令之前，DBA 必須親自動手寫好一個 PFILE，裡面設定好 ENABLE_PLUGGABLE_DATABASE=TRUE，並且手動把這個輔助資料庫啟動到 NOMOUNT 狀態。RMAN 只是連進去使用它，事前準備工作是 DBA 的責任。" }, { "id": "E9-Q20", "exam": 9, "q": 20, "topic": "04_Duplicate_Transport", "topicTitle": "資料庫複製與搬移 (Duplicate / Transport / Data Pump)", "part": 1, "stem": "<p><strong>Scenario:<\/strong> You are asked: <em>Which three are true about cloning databases into an existing CDB with RMAN? (Choose three.)<\/em><\/p>\n<div><\/div>", "options": ["A non-CDB can be cloned into a PDB.", "A user with SYSDBA or SYSBKUP must be logged in with RMAN to the non-CDB being cloned when cloning a non-CDB.", "Only one PDB can be cloned at a time.", "A user with SYSDBA or SYSBKUP must be logged in with RMAN to CDB$ROOT when cloning a PDB.", "Two or more PDBs can be cloned with the same command.", "The target and auxiliary instance passwords must be the same."], "correct": [2, 3, 5], "choose": 3, "explain": "", "origNote": "注意題型" }, { "id": "E9-Q27", "exam": 9, "q": 27, "topic": "04_Duplicate_Transport", "topicTitle": "資料庫複製與搬移 (Duplicate / Transport / Data Pump)", "part": 1, "stem": "<p>Which three are true in Oracle 19c and later releases? (Choose three.)<\/p>", "options": ["Tablespaces always remain in read/write mode during transportable tablespace operations.", "Simultaneous data pump jobs can be limited at the pluggable database (PDB) level.", "A transportable data pump import can leave a plugged-in tablespace in read-only mode.", "An ordinary data pump export of a table with encrypted columns will always encrypt the same columns when imported.", "Tablespaces never remain in read/write mode during transportable tablespace operations.", "A transportable data pump import can leave a plugged-in tablespace in read/write mode."], "correct": [1, 2, 5], "choose": 3, "explain": "", "origNote": "PDB 層級限制 Data Pump 作業： 在多租戶架構中，為了避免某個租戶 (PDB) 執行過多的 expdp/impdp 背景作業而吃光系統行程與記憶體資源，Oracle 支援在 PDB 層級透過參數（如 MAX_DATAPUMP_JOBS_PER_PDB）來限制同時並行的 Data Pump 工作數量，落實多租戶資源隔離。" }, { "id": "E1-Q32", "exam": 1, "q": 32, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 1, "stem": "<p>Which three are located by using environment variables? (Choose three.)<\/p>", "options": ["the Optimal Flexible Architecture (OFA) compliant path to store Oracle software and configuration files.", "the location of Oracle Net Services configuration files", "the list of a disk group names to be mounted by an Oracle Automatic Storage Management (ASM) instance at startup", "default directories for temporary files used by temporary tablespaces", "the temporary disk space used by Oracle Installer during installation", "the maximum number of database files that can be opened by a database instance"], "correct": [0, 1, 4], "choose": 3, "explain": "", "origNote": "E. the temporary disk space used by Oracle Installer during installation（正確）<br/><br/>解析： 當執行 Oracle 安裝程式（如 OUI）時，安裝程式會去讀取作業系統的暫存目錄環境變數（例如 Linux 上的 TMP、TMPDIR 或 Windows 上的 TEMP）來決定安裝時使用的暫存磁碟空間。<br/>F 錯誤： 資料庫執行個體能開啟的最大資料檔案數量由初始化參數 DB_FILES 決定，與環境變數無關。" }, { "id": "E1-Q33", "exam": 1, "q": 33, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 1, "stem": "<p>Which three are true about opatchauto? (Choose three.)<\/p>", "options": ["It performs a shutdown and then a restart of all processes in both Oracle Grid Infrastructure and Oracle Database home during the patching process.", "It must be invoked by a user with root user privileges.", "Patches are applied via opatchauto.", "Users must always input patch plans to opatchauto.", "It requires the Oracle Grid Infrastructure and Oracle Database instances to be shut down before being invoked.", "It applies patches in nonrolling mode by default."], "correct": [0, 1, 2], "choose": 3, "explain": "", "origNote": "詳細觀念解析與說明<br/>opatchauto 是 Oracle 用來自動化管理 Grid Infrastructure (GI) 與 RDBMS (Database) 補丁安裝的核心工具。<br/><br/>A. It performs a shutdown and then a restart of all processes in both Oracle Grid Infrastructure and Oracle Database home during the patching process.（正確）<br/><br/>解析： 在執行補丁套用過程中，opatchauto 會自動關閉並在完成後重新啟動 GI 以及 Database Home 相關的所有行程（特別是非滾動式/non-rolling 或需要停機的元件）。<br/><br/>B. It must be invoked by a user with root user privileges.（正確）<br/><br/>解析： 由於 opatchauto 需要修改底層系統二進位檔、權限與 Grid Infrastructure 的檔案，因此必須由 root 權限的使用者來執行（雖然它會自動去呼叫 oracle 使用者來處理資料庫層面的動作）。<br/><br/>C. Patches are applied via opatchauto.（正確）<br/><br/>解析： 這正是該工具的基本定義，它就是用來自動化套用 Oracle 軟體補丁的公用程式。<br/><br/>為什麼其他選項是錯的？<br/>D 錯誤： 使用者不需要（也無法）每次都手動輸入什麼「patch plans」給 opatchauto，它會自動偵測並分析目錄中的補丁。<br/><br/>E 錯誤： 你不需要在執行 opatchauto 之前手動去關閉 Grid Infrastructure 和 Database 執行個體，工具本身就會自動處理關閉與重啟。<br/><br/>F 錯誤： opatchauto 針對 Grid Infrastructure 環境預設通常是嘗試以 rolling mode（滾動式，若支援） 進行，而不是非滾動式（nonrolling mode）預設" }, { "id": "E1-Q34", "exam": 1, "q": 34, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 1, "stem": "<p>Which two are true about the character sets used in an Oracle database? (Choose two.)<\/p>", "options": ["Single-byte character sets provide better performance than multibyte character sets.", "Unicode enables information from any language to be stored using a single character set.", "Unicode is the only supported character set for Oracle databases created using Database Configuration Assistant (DBCA).", "Single-byte character sets always use 7-bit encoding schemes.", "Multibyte character sets allow more efficient space utilization than single byte character sets.", "Single-byte character sets always use 8-bit encoding schemes."], "correct": [0, 1], "choose": 2, "explain": "", "origNote": "詳細觀念解析與說明<br/>A. Single-byte character sets provide better performance than multibyte character sets.（正確）<br/><br/>解析： 單位元組字元集（Single-byte character sets）在進行資料處理、字串操作和計算字元長度時，由於每個字元固定佔用 1 個位元組，資料庫不需要額外去判斷或解析多位元組的邊界，因此在效能上通常比多位元組字元集（Multibyte character sets，例如 UTF-8）表現得更為高效。<br/><br/>B. Unicode enables information from any language to be stored using a single character set.（正確）<br/><br/>解析： Unicode（如 UTF-8、UTF-16）是一種業界標準，它設計的目的就是為了讓全球各種不同語言的文字都能夠被容納並同時儲存在同一個字元集中，解決了過去多國語系混用時編碼衝突的問題。<br/><br/>為什麼其他選項是錯的？<br/>C 錯誤： Unicode 並不是透過 DBCA 建立資料庫時「唯一支援」的字元集，資料庫仍可支援傳統的非 Unicode 字元集（如 AL32UTF8 以外的編碼）。<br/><br/>D 錯誤： 單位元組字元集不一定只用 7-bit（例如許多 8-bit 的編碼如 WE8MSWIN1252 也是單位元組）。<br/><br/>E 錯誤： 多位元組字元集（例如英文字母在 UTF-8 中可能只佔 1 byte，但中文字會佔 3 bytes）針對非英文字母反而可能需要消耗更多的儲存空間，並不會比單位元組更具空間效率。<br/><br/>F 錯誤： 單位元組字元集不一定都固定使用 8-bit 編碼（有些 7-bit 編碼如 US7ASCII 也是單位元組）。" }, { "id": "E1-Q37", "exam": 1, "q": 37, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 1, "stem": "<p>Which two are true about OS groups and users for Oracle Grid Infrastructure and the Oracle Relational Database Management System (RDBMS)? (Choose two.)<\/p>", "options": ["By default, members of the OSASM group can access Automatic Storage Management and RDBMS instances.", "The primary group for the Oracle Grid Infrastructure and Oracle Database owners must be the Oracle Inventory group.", "The Oracle Grid Infrastructure installation must be owned by the grid user.", "The Oracle Grid Infrastructure owner owns Oracle Restart and Oracle Automatic Storage Management binaries.", "The Oracle Grid Infrastructure owner must have OSOPER, OSBACKUPDBA, and OSKMDBA as secondary groups.", "The same OSDBA group must be used for Automatic Storage Management and the Oracle Database."], "correct": [1, 3], "choose": 2, "explain": "", "origNote": "B. The primary group for the Oracle Grid Infrastructure and Oracle Database owners must be the Oracle Inventory group.（正確）<br/><br/>解析： 不論是安裝 Grid Infrastructure 的使用者（通常命名為 grid）還是安裝 Database 的使用者（通常命名為 oracle），他們的 主要群組（Primary Group）都必須是 Oracle Inventory 群組（通常命名為 oinstall）。這是因為這兩個使用者都必須具備讀寫中央清單目錄（oraInventory）的權限，才能順利安裝與套用更新。<br/><br/>D. The Oracle Grid Infrastructure owner owns Oracle Restart and Oracle Automatic Storage Management binaries.（正確）<br/><br/>解析： 負責安裝 Grid Infrastructure 的 OS 使用者（如 grid），就是 Oracle Restart（單機版 GI）以及 Oracle ASM（自動儲存管理）執行檔（binaries）的擁有者（Owner）。<br/><br/>為什麼其他選項是錯的？<br/>A 錯誤： 選項說「OSASM 群組的成員可以存取 ASM 和 RDBMS 執行個體」。<br/><br/>真相： OSASM 群組（對應 SYSASM 權限）是專門用來管理 ASM 執行個體的，它不能用來管理資料庫（RDBMS）執行個體。資料庫管理應該使用 OSDBA（對應 SYSDBA 權限）。<br/><br/>C 錯誤： 選項說「Grid Infrastructure 的安裝必須由名為 grid 的使用者擁有」。<br/><br/>真相： 雖然 Oracle 官方文件與業界慣例強烈建議將這個使用者命名為 grid，但這並非強制規定。你高興的話也可以把它命名為 giowner 或 oragrid。<br/><br/>E 錯誤： 選項說「Grid Infrastructure 擁有者必須將 OSOPER, OSBACKUPDBA, 和 OSKMDBA 作為次要群組」。<br/><br/>真相： OSBACKUPDBA（備份）、OSKMDBA（金鑰管理）等群組主要是針對 Oracle Database（RDBMS）的細部權限劃分（Role Separation），而不是給 Grid Infrastructure (ASM) 擁有者的必要群組。GI 擁有者需要的是 OSASM、OSDBA for ASM 等。<br/><br/>F 錯誤： 選項說「ASM 和 Oracle Database 必須使用相同的 OSDBA 群組」。<br/><br/>真相： 為了安全與職責分離（Role Separation），Oracle 強烈建議 ASM 和 Database 使用不同的 OSDBA 群組。例如，ASM 使用 asmdba，而 Database 使用 dba 群組。所以它們不需要也不應該強制相同。" }, { "id": "E1-Q38", "exam": 1, "q": 38, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 1, "stem": "<p>Examine this command:<br/>$ rhpctl move database ?“sourcehome Oracle_home_path ?“destinationhome Oracle_home_path<br/>For which two purposes can you use this command? (Choose two.)<\/p>", "options": ["to switch an existing Oracle Database home to a newer release of Oracle software on the same server", "to switch to a read-only Oracle home", "to switch back to the previous Oracle home as part of a rollback operation", "to switch the Oracle Database home when using a centralized Rapid Home Provisioning server", "to switch to a patched Oracle Database home"], "correct": [2, 4], "choose": 2, "explain": "", "origNote": "要理解這個指令，首先要知道 RHP (Rapid Home Provisioning) 採用的是「異地打補丁（Out-of-place patching）」的概念。當你要更新資料庫時，你不會在原本正在運行的 Oracle Home 裡面直接安裝更新檔，而是會先準備好一個「已經包含最新補丁的全新 Oracle Home」。<br/><br/>E. to switch to a patched Oracle Database home（正確）<br/><br/>解析： 這是 move database 最主要的用途！當你準備好一個打完補丁的新目錄（destinationhome）後，透過這個指令，可以平順地將資料庫從舊目錄切換到這個「已打好補丁的 Oracle Database home」來運行，完成更新作業。<br/><br/>C. to switch back to the previous Oracle home as part of a rollback operation（正確）<br/><br/>解析： 這是異地打補丁最大的優勢！如果切換到新目錄後，發現應用程式出現不相容或嚴重錯誤，因為你原本的舊目錄（previous Oracle home）完全沒被動過，你可以再次執行 move database，瞬間「切換回舊目錄」，這就是所謂的退回/還原操作（Rollback）。<br/><br/>為什麼其他選項是錯的？<br/>A 錯誤： 如果你是要跨大版本升級（例如從 12c 升級到 19c，也就是 \"newer release\"），單純切換目錄是不夠的，資料庫內部的字典 (Data Dictionary) 也需要升級。這時候應該使用的是 rhpctl upgrade database 指令，而不是 move。move 主要用於同版本間的補丁套用 (Patching)。<br/><br/>B 錯誤： 雖然 Oracle 18c 之後支援「唯讀的 Oracle Home (Read-Only Oracle Home)」，但 move database 這個指令的目的並不是為了把家目錄「變成」唯讀的，而是用來在不同的家目錄之間切換以進行維護。<br/><br/>D 錯誤： 這個選項只是描述了你正在使用「集中式的 RHP 伺服器」這個環境背景，並沒有回答出 move database 具體要達成的「目的 (purposes)」（也就是打補丁與還原）。" }, { "id": "E1-Q48", "exam": 1, "q": 48, "topic": "05_Install_Upgrade_Patch", "topicTitle": "安裝、升級與修補", "part": 1, "stem": "<p>Examine this configuration:<\/p>\n<p>1. CDB1 is an Oracle Database 12c Release 2 database containing pluggable databases PDB$SEED, PDB1, and PDB2.<br/>\n2. PDB$SEED is open READ ONLY<br/>\n3. PDB1 is open READ WRITE<br/>\n4. PDB2 is MOUNTED.<br/>\n5. ORACLE_HOME is /u01/app/oracle/product/18.1.0/dbhome_1.<br/>\nYou execute these commands before upgrading the database to the current release:<\/p>\n<p><img decoding=\"async\" src=\"../images/E01_Q048_img1.png\"/><br/>\nFor which databases will fixup scripts be created?<\/p>", "options": ["CDB1, PDB$SEED, PDB1, and PDB2", "PDB$SEED, PDB1, and PDB2 only", "CDB1 and PDB$SEED only", "CDB1, PDB1, and PDB2 only", "CDB1, PDB$SEED, and PDB1 only"], "correct": [4], "choose": 1, "explain": "", "origNote": "核心觀念：<br/>preupgrade.
